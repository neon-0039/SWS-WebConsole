<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWS Web Console v0.3</title>

<style>
:root {
  --bg: #0b0b0b;
  --panel: #111;
  --panel-2: #181818;
  --editor-bg: #0d1117;
  --text: #e6eef8;
  --muted: #9aa7b5;
  --border: #2a2a2a;
  --border-strong: #3d4a58;
  --accent: #2196f3;
  --accent-hover: #42a5f5;
  --success: #9ef0a9;
  --error: #ff9b9b;
  --warning: #ffd166;
  --info: #a9d1ff;

  --syntax-command: #4db3ff;
  --syntax-keyword: #ffc107;
  --syntax-class: #ce93d8;
  --syntax-string: #a9d1ff;
  --syntax-number: #90ee90;
  --syntax-pitch: #ffb3b3;
  --syntax-comment: #84909c;
  --syntax-operator: #ff9800;
  --syntax-error: #ff6b6b;

  --editor-font: "Cascadia Code", "JetBrains Mono", "SFMono-Regular",
    Consolas, "Courier New", monospace;
  --editor-size: 14px;
  --editor-line-height: 1.5;
  --editor-line-px: 21px;
  --editor-padding-top: 12px;
  --editor-padding-bottom: 16px;
  --editor-padding-left: 14px;
  --editor-padding-right: 14px;
  --line-number-width: 52px;

  --track-main: #2196f3;
  --track-bass: #9c6bff;
  --track-melody: #ffb347;
  --track-default: #78909c;
}

body.light {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --panel-2: #eef1f4;
  --editor-bg: #fbfcfe;
  --text: #20262e;
  --muted: #667085;
  --border: #d5dbe3;
  --border-strong: #aeb9c7;

  --syntax-command: #1565c0;
  --syntax-keyword: #996600;
  --syntax-class: #7b1fa2;
  --syntax-string: #2454a6;
  --syntax-number: #28752e;
  --syntax-pitch: #a33f3f;
  --syntax-comment: #7b8794;
  --syntax-operator: #ef6c00;
  --syntax-error: #c62828;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  transition: background .2s ease, color .2s ease;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  min-height: 36px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-2);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  touch-action: manipulation;
}

button:hover {
  background: var(--border);
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

button.primary {
  border-color: #1766d6;
  background: linear-gradient(180deg, #2b8aef, #1766d6);
  color: #fff;
}

button.primary:hover {
  background: linear-gradient(180deg, #42a5f5, #1976d2);
}

button.danger {
  border-color: #a51b1b;
  background: linear-gradient(180deg, #d32f2f, #a51b1b);
  color: #fff;
}

button:disabled {
  cursor: not-allowed;
  opacity: .45;
}

input[type="file"] {
  display: none;
}

input[type="text"],
input[type="number"],
select {
  width: 100%;
  min-height: 36px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
}

input[type="color"] {
  width: 44px;
  height: 36px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
}

/* Application layout */

#app {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
}

.app-header {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

.app-title {
  min-width: max-content;
  font-size: 15px;
  font-weight: 700;
}

.app-subtitle {
  margin-left: 8px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 400;
}

#toolbar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  flex-wrap: wrap;
}

.toolbar-separator {
  width: 1px;
  height: 26px;
  margin: 0 2px;
  background: var(--border);
}

#workspace {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* Track / class panel */

#trackPanel {
  display: flex;
  width: 240px;
  min-width: 240px;
  flex-shrink: 0;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--border);
  background: var(--panel);
}

.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 43px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-2);
}

.panel-heading-title {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.panel-heading-status {
  color: var(--muted);
  font-size: 10px;
}

#trackList {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 8px;
}

.track-item {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  margin-bottom: 4px;
  padding: 8px;
  border: 1px solid transparent;
  border-left: 3px solid transparent;
  border-radius: 6px;
  cursor: pointer;
}

.track-item:hover {
  background: rgba(255, 255, 255, .04);
}

.track-item.selected {
  border-color: rgba(33, 150, 243, .25);
  border-left-color: var(--accent);
  background: rgba(33, 150, 243, .1);
}

.track-dot {
  width: 11px;
  height: 11px;
  flex: 0 0 11px;
  border-radius: 50%;
  background: var(--track-default);
}

.track-dot.main {
  background: var(--track-main);
}

.track-dot.bass {
  background: var(--track-bass);
}

.track-dot.melody {
  background: var(--track-melody);
}

.track-info {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
  gap: 2px;
}

.track-name {
  overflow: hidden;
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.track-meta {
  overflow: hidden;
  color: var(--muted);
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.track-state {
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.track-state.playing {
  color: var(--success);
}

#trackActions {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  padding: 8px;
  border-top: 1px solid var(--border);
  background: var(--panel-2);
}

/* Editor region */

#editorWorkspace {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}

#editorPanel {
  display: flex;
  min-height: 250px;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
  background: var(--editor-bg);
}

.editor-header {
  display: flex;
  min-height: 43px;
  flex-shrink: 0;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

.editor-title-group {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 8px;
}

.editor-title {
  font-size: 12px;
  font-weight: 700;
}

.editor-file-name {
  max-width: 260px;
  overflow: hidden;
  color: var(--muted);
  font-family: var(--editor-font);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.editor-status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.editor-status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
}

.editor-status-dot.dirty {
  background: var(--warning);
}

#editorShell {
  display: flex;
  min-height: 0;
  flex: 1;
  overflow: hidden;
}

#lineNumbers {
  width: var(--line-number-width);
  min-width: var(--line-number-width);
  flex: 0 0 var(--line-number-width);
  overflow: hidden;
  padding: var(--editor-padding-top) 8px var(--editor-padding-bottom) 4px;
  border-right: 1px solid var(--border);
  background: rgba(0, 0, 0, .18);
  color: #7894ad;
  font-family: var(--editor-font);
  font-size: var(--editor-size);
  font-weight: 400;
  line-height: var(--editor-line-px);
  text-align: right;
  user-select: none;
  white-space: pre;
}

.line-number {
  display: block;
  width: 100%;
  height: var(--editor-line-px);
  line-height: var(--editor-line-px);
  text-align: right;
  white-space: pre;
}

#editorMain {
  position: relative;
  min-width: 0;
  flex: 1;
  overflow: hidden;
  background: var(--editor-bg);
}

#editorScroll {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

#editorContent {
  position: relative;
  min-width: max-content;
  min-height: 100%;
}

/*
 * Highlight layer and textarea deliberately share every text-layout
 * property. The textarea remains the input/selection layer while the
 * highlight layer is only responsible for visual token colors.
 */
#highlightLayer,
#codeEditor {
  position: absolute;
  top: 0;
  left: 0;
  display: block;
  width: 100%;
  min-width: max-content;
  min-height: 100%;
  margin: 0;
  padding: var(--editor-padding-top)
    var(--editor-padding-right)
    var(--editor-padding-bottom)
    var(--editor-padding-left);

  border: 0;
  font-family: var(--editor-font);
  font-size: var(--editor-size);
  font-weight: 400;
  line-height: var(--editor-line-px);
  letter-spacing: normal;
  tab-size: 2;
  text-align: left;
  text-indent: 0;
  white-space: pre;
  word-spacing: normal;
  word-break: normal;
  overflow-wrap: normal;
}

#highlightLayer {
  z-index: 1;
  min-width: 100%;
  color: var(--text);
  pointer-events: none;
  user-select: none;
}

#codeEditor {
  z-index: 2;
  min-width: 100%;
  resize: none;
  overflow: hidden;
  outline: none;
  color: transparent;
  caret-color: var(--text);
  background: transparent;
  -webkit-text-fill-color: transparent;
  white-space: pre;
  tab-size: 2;
  touch-action: manipulation;
}

#codeEditor::selection {
  background: rgba(33, 150, 243, .38);
  -webkit-text-fill-color: transparent;
}

#highlightLayer code {
  display: block;
  min-height: var(--editor-line-px);
  font: inherit;
  white-space: pre;
}

.syn-command {
  color: var(--syntax-command);
}

.syn-keyword {
  color: var(--syntax-keyword);
}

.syn-class {
  color: var(--syntax-class);
}

.syn-string {
  color: var(--syntax-string);
}

.syn-number {
  color: var(--syntax-number);
}

.syn-pitch {
  color: var(--syntax-pitch);
}

.syn-comment {
  color: var(--syntax-comment);
  opacity: .75;
}

.syn-operator {
  color: var(--syntax-operator);
}

.syn-error {
  color: var(--syntax-error);
  text-decoration: underline wavy var(--syntax-error);
  text-underline-offset: 3px;
}

.syn-text {
  color: var(--text);
}

/* Compile / tempo strip */

#editorInfoBar {
  display: flex;
  min-height: 32px;
  flex-shrink: 0;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 12px;
  border-top: 1px solid var(--border);
  background: var(--panel);
  color: var(--muted);
  font-family: var(--editor-font);
  font-size: 10px;
}

.editor-info-items {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.editor-info-item strong {
  color: var(--text);
  font-weight: 500;
}

/* Console */

#consolePanel {
  display: flex;
  min-height: 150px;
  max-height: 270px;
  flex-shrink: 0;
  flex-direction: column;
  border-top: 1px solid var(--border);
  background: var(--bg);
}

.console-header {
  display: flex;
  min-height: 38px;
  flex-shrink: 0;
  align-items: center;
  justify-content: space-between;
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

.console-title {
  font-size: 12px;
  font-weight: 700;
}

.console-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.console-actions button {
  min-height: 28px;
  padding: 4px 8px;
  font-size: 10px;
}

#consoleOutput {
  flex: 1;
  min-height: 0;
  margin: 8px;
  padding: 8px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: rgba(0, 0, 0, .25);
  color: var(--text);
  font-family: var(--editor-font);
  font-size: 11px;
  line-height: 1.55;
}

.console-line {
  min-height: 18px;
  white-space: pre-wrap;
  word-break: break-word;
}

.console-line.info {
  color: var(--info);
}

.console-line.success {
  color: var(--success);
}

.console-line.warning {
  color: var(--warning);
}

.console-line.error {
  color: var(--error);
}

.console-line .console-time {
  margin-right: 8px;
  color: var(--muted);
}

#errorPanel {
  display: none;
  flex-shrink: 0;
  margin: 0 8px 8px;
  padding: 10px 12px;
  border: 1px solid rgba(255, 107, 107, .55);
  border-left: 4px solid var(--error);
  border-radius: 6px;
  background: rgba(180, 40, 40, .12);
}

#errorPanel.visible {
  display: block;
}

.error-heading {
  margin-bottom: 7px;
  color: var(--error);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .08em;
}

.error-details {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 3px 10px;
  font-family: var(--editor-font);
  font-size: 11px;
}

.error-label {
  color: var(--muted);
}

.error-value {
  min-width: 0;
  color: var(--text);
  overflow-wrap: anywhere;
}

.error-value.error-type {
  color: var(--error);
  font-weight: 700;
}

#outputBar {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  background: var(--panel);
}

.output-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.output-buttons {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.output-buttons button {
  min-height: 30px;
  padding: 5px 10px;
  font-size: 11px;
}

/* Generic modals retained for future JavaScript modules */

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: auto;
  background: rgba(0, 0, 0, .65);
}

.modal-overlay.active {
  display: flex;
}

.modal-dialog {
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  padding: 20px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
}

.modal-dialog h3 {
  margin-bottom: 14px;
  color: var(--accent);
  font-size: 16px;
}

.modal-dialog label {
  display: block;
  margin: 10px 0 6px;
  color: var(--muted);
  font-size: 12px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

/* Piano Roll is intentionally isolated from the editor in Phase 1. */

#pianoRollModule {
  display: none;
}

.piano-roll-module {
  display: none;
}

/* Mobile layout */

@media (max-width: 900px) {
  #workspace {
    flex-direction: column;
    overflow: auto;
  }

  #trackPanel {
    width: 100%;
    min-width: 0;
    max-height: 190px;
    min-height: 120px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }

  #trackList {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    overflow-y: hidden;
  }

  .track-item {
    width: 150px;
    min-width: 150px;
    margin-bottom: 0;
  }

  #trackActions {
    grid-template-columns: 1fr 1fr 1fr;
  }

  #editorWorkspace {
    min-height: 0;
  }

  #editorPanel {
    min-height: 320px;
  }

  #consolePanel {
    max-height: 220px;
  }
}

@media (max-width: 680px) {
  .app-header {
    align-items: stretch;
    flex-direction: column;
    padding: 8px 10px;
  }

  .app-title {
    text-align: center;
  }

  .app-subtitle {
    display: none;
  }

  #toolbar {
    justify-content: stretch;
  }

  #toolbar button {
    flex: 1 1 calc(25% - 6px);
    min-width: 72px;
  }

  .toolbar-separator {
    display: none;
  }

  .editor-header {
    padding: 7px 9px;
  }

  .editor-file-name {
    max-width: 130px;
  }

  .editor-status {
    display: none;
  }

  #editorInfoBar {
    min-height: 40px;
    align-items: flex-start;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  #consolePanel {
    min-height: 155px;
    max-height: 210px;
  }

  #outputBar {
    align-items: stretch;
    flex-direction: column;
  }

  .output-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }

  .output-buttons button {
    width: 100%;
  }
}

@media (max-width: 430px) {
  :root {
    --line-number-width: 42px;
    --editor-size: 13px;
    --editor-line-px: 20px;
    --editor-padding-left: 10px;
    --editor-padding-right: 10px;
  }

  #toolbar button {
    min-width: 64px;
    padding-right: 7px;
    padding-left: 7px;
    font-size: 11px;
  }

  #trackPanel {
    max-height: 165px;
  }

  .track-item {
    width: 132px;
    min-width: 132px;
  }

  .console-header {
    padding-right: 8px;
    padding-left: 8px;
  }

  #consoleOutput {
    margin: 6px;
  }
}

::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}

::-webkit-scrollbar-track {
  background: var(--bg);
}

::-webkit-scrollbar-thumb {
  border-radius: 6px;
  background: #3a4652;
}

::-webkit-scrollbar-thumb:hover {
  background: #536273;
}
</style>
</head>

<body class="dark">

<div id="app">

  <header class="app-header" id="appHeader">
    <div class="app-title">
      🎵 SWS Web Console
      <span class="app-subtitle">SWS Editor v0.3</span>
    </div>

    <nav id="toolbar" aria-label="SWS toolbar">
      <input
        id="fileInput"
        type="file"
        accept=".ss,.ust"
        aria-label="Open SWS or UST file"
      >

      <button id="openButton" type="button">Open</button>
      <button id="saveButton" type="button">Save</button>

      <span class="toolbar-separator" aria-hidden="true"></span>

      <button id="compileButton" type="button">Compile</button>
      <button id="playButton" class="primary" type="button">▶ Play</button>
      <button id="stopButton" class="danger" type="button" disabled>■ Stop</button>

      <span class="toolbar-separator" aria-hidden="true"></span>

      <button id="midiButton" type="button">MIDI</button>
      <button id="wavButton" type="button">WAV</button>
      <button id="ustButton" type="button">UST</button>
      <button id="pluginButton" type="button">Plugin</button>
      <button id="themeToggle" type="button">☀ Light</button>
    </nav>
  </header>

  <main id="workspace">

    <aside id="trackPanel" aria-label="Track and class panel">
      <div class="panel-heading">
        <span class="panel-heading-title">Tracks / Classes</span>
        <span id="trackCount" class="panel-heading-status">1 track</span>
      </div>

      <div id="trackList" role="listbox" aria-label="SWS tracks">
        <div
          class="track-item selected"
          id="track-main"
          data-track-name="main"
          data-class-name="main"
          data-track-color="#2196f3"
          data-track-instrument="synth"
          role="option"
          aria-selected="true"
          tabindex="0"
        >
          <span class="track-dot main" aria-hidden="true"></span>

          <span class="track-info">
            <span class="track-name">main</span>

-->
<section
  id="pianoRollModule"
  class="piano-roll-module"
  aria-hidden="true"
  data-module="piano-roll"
  data-event-model-source="sws-editor"

<script>
/*
 * Phase 1 intentionally contains no compiler, parser, Web Audio,
 * MIDI, WAV, UST, plugin, or Piano Roll implementation.
 *
 * The following DOM contracts are reserved for the next phase:
 *
 * Editor:
 *   #codeEditor
 *   #highlightLayer
 *   #highlightCode
 *   #lineNumbers
 *   #editorScroll
 *
 * Toolbar:
 *   #openButton
 *   #saveButton
 *   #compileButton
 *   #playButton
 *   #stopButton
 *   #midiButton
 *   #wavButton
 *   #ustButton
 *   #pluginButton
 *
 * Tracks:
 *   #trackPanel
 *   #trackList
 *   [data-track-name]
 *   [data-class-name]
 *
 * Console and errors:
 *   #consoleOutput
 *   #errorPanel
 *   #errorLine
 *   #errorType
 *   #errorMessage
 *
 * Future Event Model / Piano Roll:
 *   #pianoRollModule
 *   [data-event-model-source="sws-editor"]
 */
(() => {
  "use strict";

  const codeEditor = document.getElementById("codeEditor");
  const highlightLayer = document.getElementById("highlightLayer");
  const highlightCode = document.getElementById("highlightCode");
  const lineNumbers = document.getElementById("lineNumbers");
  const editorScroll = document.getElementById("editorScroll");
  const editorContent = document.getElementById("editorContent");

  if (
    !codeEditor ||
    !highlightLayer ||
    !highlightCode ||
    !lineNumbers ||
    !editorScroll ||
    !editorContent
  ) {
    return;
  }

  /*
   * 初期状態ではtextareaを直接表示する。
   *
   * highlightLayerへ文字が描画される前にtextareaを透明にすると、
   * エディタの文字が完全に消えるため、先に表示状態を確保する。
   */
  codeEditor.style.color = "var(--text)";
  codeEditor.style.webkitTextFillColor = "var(--text)";
  codeEditor.style.caretColor = "var(--text)";

  /*
   * HTMLエスケープ
   */
  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  /*
   * 正規表現用エスケープ
   */
  function escapeRegExp(value) {
    return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  /*
   * SWSのPitch判定。
   *
   * 対応:
   * C4
   * C#4
   * Db4
   * C#4-
   * C#4+
   * C4~
   * C4!
   * C4~!
   */
  const pitchPattern =
    /^[A-Ga-g](?:#|b)?-?\d+(?:[+-])?(?:~!?|!~?)?$/;

  const commandNames = [
    "snd",
    "sleep",
    "lp",
    "chips",
    "tempoconst",
    "newtempo",
    "key",
    "output",
    "plugin",
    "index"
  ];

  const keywordNames = [
    "class",
    "fsn",
    "null",
    "Lyric"
  ];

  /*
   * 1行分のSyntax Highlight。
   *
   * 文字列・コメント・通常トークンを順番に処理する。
   * 文字列内部の記号やコメント記号を誤認識しない。
   */
  function highlightLine(line) {
    let html = "";
    let index = 0;

    while (index < line.length) {
      const char = line[index];

      /*
       * コメント
       */
      if (char === "<") {
        const closeIndex = line.indexOf(">", index + 1);

        if (closeIndex !== -1) {
          const comment = line.slice(index, closeIndex + 1);
          html += `<span class="syn-comment">${escapeHtml(comment)}</span>`;
          index = closeIndex + 1;
          continue;
        }
      }

      /*
       * 文字列
       */
      if (char === '"') {
        let end = index + 1;

        while (end < line.length) {
          if (
            line[end] === '"' &&
            line[end - 1] !== "\\"
          ) {
            end++;
            break;
          }

          end++;
        }

        const stringValue = line.slice(index, end);
        html += `<span class="syn-string">${escapeHtml(stringValue)}</span>`;
        index = end;
        continue;
      }

      /*
       * 単語・Pitch・数値
       */
      if (/[A-Za-z0-9_#.+!-]/.test(char)) {
        let end = index + 1;

        while (
          end < line.length &&
          /[A-Za-z0-9_#.+!-]/.test(line[end])
        ) {
          end++;
        }

        const word = line.slice(index, end);
        const lowerWord = word.toLowerCase();

        if (commandNames.includes(lowerWord)) {
          html += `<span class="syn-command">${escapeHtml(word)}</span>`;
        } else if (keywordNames.includes(word)) {
          html += `<span class="syn-keyword">${escapeHtml(word)}</span>`;
        } else if (pitchPattern.test(word)) {
          html += `<span class="syn-pitch">${escapeHtml(word)}</span>`;
        } else if (/^\d+(?:\.\d+)?$/.test(word)) {
          html += `<span class="syn-number">${escapeHtml(word)}</span>`;
        } else {
          html += `<span class="syn-text">${escapeHtml(word)}</span>`;
        }

        index = end;
        continue;
      }

      /*
       * 記号
       */
      if ("=(),[]{};.".includes(char)) {
        html += `<span class="syn-operator">${escapeHtml(char)}</span>`;
        index++;
        continue;
      }

      /*
       * 空白・日本語・その他文字
       */
      html += escapeHtml(char);
      index++;
    }

    /*
     * 空行でも行の高さを維持する。
     */
    return html || " ";
  }

  /*
   * 行番号を更新する。
   */
  function updateLineNumbers() {
    const value = codeEditor.value;
    const lineCount = Math.max(1, value.split("\n").length);

    const fragment = document.createDocumentFragment();

    for (let line = 1; line <= lineCount; line++) {
      const number = document.createElement("span");
      number.className = "line-number";
      number.textContent = String(line);
      fragment.appendChild(number);
    }

    lineNumbers.replaceChildren(fragment);
  }

  /*
   * ハイライトを更新する。
   *
   * textContentではなくinnerHTMLを使用するが、
   * 各文字列は必ずescapeHtml()を通す。
   */
  function updateHighlight() {
    const lines = codeEditor.value.split("\n");

    highlightCode.innerHTML = lines
      .map(highlightLine)
      .join("\n");

    /*
     * textareaとpreの高さを合わせる。
     */
    const editorHeight = Math.max(
      codeEditor.scrollHeight,
      highlightCode.scrollHeight,
      editorScroll.clientHeight
    );

    editorContent.style.height = `${editorHeight}px`;
    highlightLayer.style.height = `${editorHeight}px`;
    codeEditor.style.height = `${editorHeight}px`;
  }

  /*
   * textareaの高さを更新する。
   *
   * overflow:hiddenのtextareaでも、親の#editorScrollが
   * 正しく縦スクロールできるようにする。
   */
  function updateEditorSize() {
    codeEditor.style.height = "auto";

    const height = Math.max(
      codeEditor.scrollHeight,
      editorScroll.clientHeight
    );

    codeEditor.style.height = `${height}px`;
    highlightLayer.style.height = `${height}px`;
    editorContent.style.height = `${height}px`;
  }

  /*
   * 行番号・Highlight・Editorサイズを一括更新。
   */
  function refreshEditor() {
    updateLineNumbers();
    updateHighlight();
    updateEditorSize();
  }

  /*
   * textareaとHighlightのスクロール同期。
   *
   * #editorScrollを共通スクロールコンテナとして使用するため、
   * 実際のスクロール位置はeditorScrollから取得する。
   */
  function syncScroll() {
    const left = editorScroll.scrollLeft;
    const top = editorScroll.scrollTop;

    highlightLayer.style.transform =
      `translate(${-left}px, ${-top}px)`;

    codeEditor.style.transform =
      `translate(${-left}px, ${-top}px)`;

    lineNumbers.scrollTop = top;
  }

  /*
   * textarea入力。
   */
  codeEditor.addEventListener("input", () => {
    refreshEditor();
  });

  /*
   * textareaのスクロールイベント。
   *
   * ブラウザによってtextarea自身がスクロールする場合に備える。
   */
  codeEditor.addEventListener("scroll", () => {
    editorScroll.scrollLeft = codeEditor.scrollLeft;
    editorScroll.scrollTop = codeEditor.scrollTop;
    syncScroll();
  });

  /*
   * 共通スクロールコンテナのスクロール。
   */
  editorScroll.addEventListener("scroll", () => {
    syncScroll();
  });

  /*
   * Tabキーを入力した場合、フォーカスを失わせず、
   * 半角スペース2文字を入力する。
   */
  codeEditor.addEventListener("keydown", (event) => {
    if (event.key !== "Tab") {
      return;
    }

    event.preventDefault();

    const start = codeEditor.selectionStart;
    const end = codeEditor.selectionEnd;
    const value = codeEditor.value;

    codeEditor.value =
      value.slice(0, start) +
      "  " +
      value.slice(end);

    codeEditor.selectionStart = start + 2;
    codeEditor.selectionEnd = start + 2;

    refreshEditor();
  });

  /*
   * ウィンドウサイズ変更時にも行位置を維持する。
   */
  window.addEventListener("resize", () => {
    refreshEditor();
    syncScroll();
  });

  /*
   * 初期内容。
   *
   * 文字を表示できることを確認するための最小サンプル。
   * 既に内容がある場合は上書きしない。
   */
  if (!codeEditor.value) {
    codeEditor.value = [
      'tempoconst="120";',
      "",
      'snd("piano",4,C4);',
      'snd("piano",4,E4);',
      'snd("piano",4,G4);'
    ].join("\n");
  }

  refreshEditor();
  syncScroll();
})();
(() => {
  "use strict";

  const SAMPLE_RATE = 44100;
  const PPQ = 480;
  const TEMPO_MAX = 999.9;
  const DEFAULT_VOLUME = 100;

  const VALID_INSTRUMENTS = new Set([
    "piano", "grand_piano", "synth", "synth_lead", "synth_bass",
    "bass", "drum", "kick", "hihat", "hi_hat", "snare",
    "sine", "square", "triangle", "saw", "sawtooth", "null"
  ]);

  const NOTE_TABLE = {
    C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3,
    E: 4, F: 5, "F#": 6, Gb: 6, G: 7, "G#": 8,
    Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11
  };

  const KEY_SCALES = {
    C: [0, 2, 4, 5, 7, 9, 11],
    G: [7, 9, 11, 0, 2, 4, 6],
    D: [2, 4, 6, 7, 9, 11, 1],
    A: [9, 11, 1, 2, 4, 6, 8],
    E: [4, 6, 8, 9, 11, 1, 3],
    B: [11, 1, 3, 4, 6, 8, 10],
    "F#": [6, 8, 10, 11, 1, 3, 5],
    F: [5, 7, 9, 10, 0, 2, 4],
    Bb: [10, 0, 2, 3, 5, 7, 9],
    Eb: [3, 5, 7, 8, 10, 0, 2],
    Ab: [8, 10, 0, 1, 3, 5, 7],
    Db: [1, 3, 5, 6, 8, 10, 0],
    Am: [9, 11, 0, 2, 4, 5, 7],
    Em: [4, 5, 7, 9, 11, 0, 2],
    Bm: [11, 0, 2, 4, 6, 7, 9],
    "F#m": [6, 7, 9, 11, 1, 3, 5],
    "C#m": [1, 2, 4, 6, 8, 9, 11],
    "G#m": [8, 9, 11, 1, 3, 5, 7],
    Dm: [2, 3, 5, 7, 9, 10, 0],
    Gm: [7, 8, 10, 0, 2, 3, 5],
    Cm: [0, 1, 3, 5, 7, 8, 10],
    Fm: [5, 6, 8, 10, 0, 1, 3]
  };

  const DOM = {};
  const state = {
    project: null,
    lastSuccessfulProject: null,
    source: "",
    fileName: "untitled.ss",
    dirty: false,
    selectedTrack: "main",
    playing: false,
    audioContext: null,
    audioNodes: new Set(),
    timers: new Set(),
    plugins: new Map(),
    errorLines: new Set()
  };

  function $(id) {
    return document.getElementById(id);
  }

  function initDom() {
    [
      "fileInput", "openButton", "saveButton", "compileButton",
      "playButton", "stopButton", "midiButton", "wavButton",
      "ustButton", "pluginButton", "themeToggle",
      "trackList", "trackCount", "addTrackButton",
      "renameTrackButton", "deleteTrackButton", "lineNumbers",
      "editorScroll", "highlightLayer", "highlightCode",
      "codeEditor", "editorFileName", "editorStatusText",
      "editorStatusDot", "tempoValue", "keyValue", "cursorValue",
      "compileStatus", "consoleOutput", "clearConsoleButton",
      "errorPanel", "errorLine", "errorType", "errorMessage",
      "exportWavButton", "exportMidiButton", "exportUstButton",
      "exportSsButton", "pluginModal", "pluginFileInput",
      "loadPluginButton", "pluginList", "pluginModalClose"
    ].forEach(id => {
      DOM[id] = $(id);
    });
  }

  class SWSError extends Error {
    constructor(line, type, message, column = null, token = null) {
      super(message);
      this.name = "SWSError";
      this.line = Number(line) || 1;
      this.type = type || "Error";
      this.message = message || "";
      this.column = column;
      this.token = token;
    }
  }

  class NoteData {
    constructor(pitch, options = {}) {
      this.pitch = pitch;
      this.slur = Boolean(options.slur);
      this.keyBypass = Boolean(options.keyBypass);
      this.lyric = options.lyric ?? null;
      this.key = options.key || "C";
      this.midi = options.midi ?? null;
      this.cents = 0;
    }

    toJSON() {
      return {
        pitch: this.pitch,
        slur: this.slur,
        key_bypass: this.keyBypass,
        lyric: this.lyric,
        key: this.key,
        midi: this.midi,
        cents: 0
      };
    }
  }

  class SoundEvent {
    constructor(instrument, start, duration, notes, line, className, volume) {
      this.type = instrument === "null" ? "rest" : "note";
      this.instrument = instrument;
      this.start = start;
      this.duration = duration;
      this.notes = notes;
      this.line = line;
      this.className = className || "main";
      this.volume = volume;
      this.lyric = notes.find(note => note.lyric)?.lyric || null;
      this.source = "";
      this.sourcePosition = { line, className: this.className };
      this.cntGroup = null;
      this.cntRole = null;
    }

    get end() {
      return this.start + this.duration;
    }

    toJSON() {
      return {
        type: this.type,
        instrument: this.instrument,
        start: this.start,
        duration: this.duration,
        notes: this.notes.map(note => note.toJSON()),
        line: this.line,
        class: this.className,
        lyric: this.lyric,
        volume: this.volume,
        source: this.source,
        source_position: this.sourcePosition
      };
    }
  }

  class Track {
    constructor(name) {
      this.id = makeId();
      this.name = name;
      this.className = name;
      this.sourceClassName = name;
      this.color = colorForTrack(name);
      this.cursor = 0;
      this.events = [];
      this.sourceStatements = [];
      this.order = 0;
    }

    addEvent(event) {
      this.events.push(event);
      this.sourceStatements.push({
        line: event.line,
        source: event.source,
        event
      });
    }
  }

  class TempoMap {
    constructor(tempo = 120) {
      validateTempo(tempo, 1);
      this.segments = [{ beat: 0, tempo: Number(tempo) }];
    }

    setTempo(beat, tempo, line = 1) {
      validateTempo(tempo, line);
      this.segments = this.segments.filter(
        segment => segment.beat !== beat
      );
      this.segments.push({ beat, tempo: Number(tempo) });
      this.segments.sort((a, b) => a.beat - b.beat);
    }

    beatToSeconds(beat) {
      if (beat <= 0) return 0;

      let result = 0;

      for (let i = 0; i < this.segments.length; i++) {
        const current = this.segments[i];
        const next = this.segments[i + 1];
        const end = next ? Math.min(beat, next.beat) : beat;

        if (end <= current.beat) continue;

        result += (end - current.beat) * 60 / current.tempo;
        if (end >= beat) break;
      }

      return result;
    }

    tempoAt(beat) {
      let result = this.segments[0].tempo;
      for (const segment of this.segments) {
        if (segment.beat <= beat) result = segment.tempo;
      }
      return result;
    }
  }

  class Project {
    constructor() {
      this.tempo = 120;
      this.key = "C";
      this.tempoMap = new TempoMap(120);
      this.tracks = [];
      this.events = [];
      this.globalEvents = [];
      this.outputRequests = [];
      this.plugins = [];
      this.source = "";
      this.sourceLines = [];
      this.sourceMetadata = {};
      this.mainTrack = this.ensureTrack("main");
    }

    ensureTrack(name) {
      const trackName = normalizeName(name);
      let track = this.tracks.find(item => item.name === trackName);

      if (!track) {
        track = new Track(trackName);
        track.order = this.tracks.length;
        this.tracks.push(track);
      }

      return track;
    }

    getTrack(name) {
      return this.ensureTrack(name || "main");
    }

    addEvent(event) {
      this.events.push(event);
      this.getTrack(event.className).addEvent(event);
    }

    toPluginData() {
      return {
        sws_version: "0.2",
        api_version: 1,
        type: "song",
        project: {
          tempo: this.tempoMap.segments[0]?.tempo || 120,
          key: this.key
        },
        events: this.events.map(event => event.toJSON())
      };
    }
  }

  function makeId() {
    if (globalThis.crypto?.randomUUID) {
      return globalThis.crypto.randomUUID();
    }
    return `sws-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }

  function normalizeName(value) {
    return String(value ?? "").trim() || "main";
  }

  function colorForTrack(name) {
    return {
      main: "#2196f3",
      melody: "#ffb347",
      bass: "#9c6bff",
      drum: "#00c853",
      synth: "#00bcd4"
    }[name] || "#78909c";
  }

  function formatNumber(value) {
    const number = Number(value);
    if (!Number.isFinite(number)) return "0";
    return Number.isInteger(number)
      ? String(number)
      : String(Number(number.toFixed(6)));
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function escapeString(value) {
    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/"/g, '\\"');
  }

  function clone(value) {
    if (typeof structuredClone === "function") {
      return structuredClone(value);
    }
    return JSON.parse(JSON.stringify(value));
  }

  function validateTempo(value, line) {
    const tempo = Number(value);

    if (!Number.isFinite(tempo) ||
        tempo <= 0 ||
        tempo > TEMPO_MAX) {
      throw new SWSError(
        line,
        "ValueError",
        `tempo must be greater than 0 and no greater than ${TEMPO_MAX}`
      );
    }
  }

  function parseDuration(value, line) {
    const text = String(value).trim();
    const dotted = text.endsWith("+");
    const denominatorText = dotted ? text.slice(0, -1) : text;

    if (!/^\d+$/.test(denominatorText)) {
      throw new SWSError(
        line,
        "ValueError",
        `invalid note length: ${value}`
      );
    }

    const denominator = Number(denominatorText);

    if (denominator <= 0) {
      throw new SWSError(
        line,
        "ValueError",
        "note length must be greater than 0"
      );
    }

    return 4 / denominator * (dotted ? 1.5 : 1);
  }

  function parseQuoted(value, line, label) {
    const text = String(value).trim();

    if (!text.startsWith('"') || !text.endsWith('"')) {
      throw new SWSError(
        line,
        "SyntaxError",
        `${label} must be written as "value"`
      );
    }

    return text.slice(1, -1)
      .replace(/\\"/g, '"')
      .replace(/\\\\/g, "\\");
  }

  function parseAssignment(text, name, line) {
    const match = text.match(
      new RegExp(`^${name}\\s*=\\s*"([^"]*)"\\s*$`, "i")
    );

    if (!match) {
      throw new SWSError(
        line,
        "SyntaxError",
        `${name} requires a quoted value`
      );
    }

    return match[1];
  }

  function findMatching(text, openIndex, openChar, closeChar) {
    if (openIndex < 0) return -1;

    let depth = 0;
    let inString = false;

    for (let i = openIndex; i < text.length; i++) {
      const ch = text[i];

      if (ch === '"' && text[i - 1] !== "\\") {
        inString = !inString;
        continue;
      }

      if (inString) continue;

      if (ch === openChar) depth++;
      if (ch === closeChar) depth--;

      if (depth === 0) return i;
    }

    return -1;
  }

  function splitTopLevel(text, delimiter = ",") {
    const result = [];
    let buffer = "";
    let parentheses = 0;
    let brackets = 0;
    let inString = false;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];

      if (ch === '"' && text[i - 1] !== "\\") {
        inString = !inString;
        buffer += ch;
        continue;
      }

      if (!inString) {
        if (ch === "(") parentheses++;
        if (ch === ")") parentheses--;
        if (ch === "[") brackets++;
        if (ch === "]") brackets--;

        if (
          ch === delimiter &&
          parentheses === 0 &&
          brackets === 0
        ) {
          result.push(buffer.trim());
          buffer = "";
          continue;
        }
      }

      buffer += ch;
    }

    if (buffer.trim()) result.push(buffer.trim());
    return result;
  }

  function splitFirstArguments(text, count) {
    const result = [];
    let buffer = "";
    let parentheses = 0;
    let brackets = 0;
    let inString = false;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];

      if (ch === '"' && text[i - 1] !== "\\") {
        inString = !inString;
        buffer += ch;
        continue;
      }

      if (!inString) {
        if (ch === "(") parentheses++;
        if (ch === ")") parentheses--;
        if (ch === "[") brackets++;
        if (ch === "]") brackets--;

        if (
          ch === "," &&
          parentheses === 0 &&
          brackets === 0 &&
          result.length < count
        ) {
          result.push(buffer.trim());
          buffer = "";
          continue;
        }
      }

      buffer += ch;
    }

    result.push(buffer.trim());
    return result;
  }

  function parseCallArguments(text, name, line) {
    const open = text.indexOf("(");
    const close = findMatching(text, open, "(", ")");

    if (
      open < 0 ||
      close < 0 ||
      text.slice(close + 1).trim()
    ) {
      throw new SWSError(
        line,
        "SyntaxError",
        `invalid ${name} call`
      );
    }

    const body = text.slice(open + 1, close).trim();
    return body ? splitTopLevel(body) : [];
  }

  function removeComments(source) {
    let result = "";
    let inString = false;
    let inComment = false;

    for (let i = 0; i < source.length; i++) {
      const ch = source[i];

      if (ch === '"' && source[i - 1] !== "\\") {
        if (!inComment) inString = !inString;
        result += ch;
        continue;
      }

      if (inString) {
        result += ch;
        continue;
      }

      if (!inComment && ch === "<") {
        inComment = true;
        result += " ";
        continue;
      }

      if (inComment && ch === "<") {
        throw new SWSError(
          source.slice(0, i).split("\n").length,
          "SyntaxError",
          "comment nesting is not allowed"
        );
      }

      if (inComment && ch === ">") {
        inComment = false;
        result += " ";
        continue;
      }

      if (!inComment) {
        result += ch;
      } else if (ch === "\n") {
        result += "\n";
      }
    }

    if (inComment) {
      throw new SWSError(
        source.split("\n").length,
        "SyntaxError",
        "unclosed comment"
      );
    }

    return result;
  }

  function countNewlines(text) {
    return (text.match(/\n/g) || []).length;
  }

  function scanStructure(source) {
    const clean = removeComments(source);
    const statements = [];

    let buffer = "";
    let startLine = 1;
    let line = 1;
    let inString = false;
    let parentheses = 0;
    let brackets = 0;

    for (let i = 0; i < clean.length; i++) {
      const ch = clean[i];

      if (ch === "\n") line++;

      if (ch === '"' && clean[i - 1] !== "\\") {
        inString = !inString;
        buffer += ch;
        continue;
      }

      if (inString) {
        buffer += ch;
        continue;
      }

      if (ch === "(") parentheses++;
      if (ch === ")") parentheses--;
      if (ch === "[") brackets++;
      if (ch === "]") brackets--;

      if (parentheses < 0 || brackets < 0) {
        throw new SWSError(
          line,
          "SyntaxError",
          "unmatched bracket"
        );
      }

      if (
        ch === "{" &&
        parentheses === 0 &&
        brackets === 0
      ) {
        const header = buffer.trim();

        if (!header) {
          throw new SWSError(
            line,
            "SyntaxError",
            "unexpected block opening"
          );
        }

        const close = findMatching(clean, i, "{", "}");

        if (close < 0) {
          throw new SWSError(
            line,
            "SyntaxError",
            "unclosed block"
          );
        }

        statements.push({
          type: "block",
          header,
          body: clean.slice(i + 1, close),
          line: startLine
        });

        line += countNewlines(clean.slice(i, close + 1));
        i = close;
        buffer = "";
        startLine = line + 1;
        continue;
      }

      if (
        ch === ";" &&
        parentheses === 0 &&
        brackets === 0
      ) {
        const text = buffer.trim();

        if (text) {
          statements.push({
            type: "statement",
            text,
            line: startLine,
            terminated: true
          });
        }

        buffer = "";
        startLine = line + 1;
        continue;
      }

      buffer += ch;
    }

    const trailing = buffer.trim();

    if (trailing) {
      statements.push({
        type: "statement",
        text: trailing,
        line: startLine,
        terminated: false
      });
    }

    return statements;
  }

  function splitCnt(text) {
    const result = [];
    let buffer = "";
    let inString = false;
    let parentheses = 0;
    let brackets = 0;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];

      if (ch === '"' && text[i - 1] !== "\\") {
        inString = !inString;
        buffer += ch;
        continue;
      }

      if (!inString) {
        if (ch === "(") parentheses++;
        if (ch === ")") parentheses--;
        if (ch === "[") brackets++;
        if (ch === "]") brackets--;

        if (
          text.slice(i, i + 5) === "-cnt-" &&
          parentheses === 0 &&
          brackets === 0
        ) {
          result.push(buffer.trim());
          buffer = "";
          i += 4;
          continue;
        }
      }

      buffer += ch;
    }

    if (buffer.trim()) result.push(buffer.trim());
    return result;
  }

  // ============================================================
  // Pitch and attributes
  // ============================================================

  function parsePitch(raw, key, line) {
    let text = String(raw).trim();
    let slur = false;
    let keyBypass = false;

    if (text.endsWith("~!")) {
      slur = true;
      keyBypass = true;
      text = text.slice(0, -2);
    } else if (text.endsWith("!~")) {
      slur = true;
      keyBypass = true;
      text = text.slice(0, -2);
    } else if (text.endsWith("~")) {
      slur = true;
      text = text.slice(0, -1);
    } else if (text.endsWith("!")) {
      keyBypass = true;
      text = text.slice(0, -1);
    }

    /*
     * SWS v0.2 does not implement cents or quarter-tone data.
     * Pitch modifiers are not converted into a cents field.
     */
    const match = text.match(/^([A-Ga-g](?:#|b)?)(-?\d+)$/);

    if (!match) {
      throw new SWSError(
        line,
        "ValueError",
        `invalid pitch: ${raw}`
      );
    }

    let name = match[1];
    const octave = Number(match[2]);
    name = name[0].toUpperCase() + name.slice(1);

    if (!(name in NOTE_TABLE)) {
      throw new SWSError(
        line,
        "ValueError",
        `invalid pitch: ${raw}`
      );
    }

    const base = NOTE_TABLE[name];
    let midi = (octave + 1) * 12 + base;

    if (!keyBypass && KEY_SCALES[key]) {
      const pitchClass = midi % 12;
      const scale = KEY_SCALES[key];

      if (!scale.includes(pitchClass)) {
        const nearest = scale.reduce((best, candidate) => {
          const currentDistance = Math.abs(
            ((candidate - pitchClass + 6) % 12) - 6
          );
          const bestDistance = Math.abs(
            ((best - pitchClass + 6) % 12) - 6
          );

          return currentDistance < bestDistance
            ? candidate
            : best;
        }, scale[0]);

        midi = Math.floor(midi / 12) * 12 + nearest;
      }
    }

    if (midi < 0 || midi > 127) {
      throw new SWSError(
        line,
        "ValueError",
        `pitch out of MIDI range: ${raw}`
      );
    }

    return new NoteData(text, {
      slur,
      keyBypass,
      key,
      midi
    });
  }

  function findAttributeStart(text) {
    let inString = false;
    let brackets = 0;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];

      if (ch === '"' && text[i - 1] !== "\\") {
        inString = !inString;
        continue;
      }

      if (inString) continue;

      if (ch === "[") brackets++;
      if (ch === "]") brackets--;

      if (
        brackets === 0 &&
        /\s/.test(ch) &&
        /^\s*(?:class|Lyric|vol)\s*=/.test(text.slice(i))
      ) {
        return i;
      }
    }

    return -1;
  }

  function parseAttributes(text, line) {
    const attributes = {};
    let index = 0;

    while (index < text.length) {
      while (index < text.length && /\s/.test(text[index])) index++;
      if (index >= text.length) break;

      const nameMatch = text.slice(index).match(
        /^([A-Za-z_][A-Za-z0-9_]*)\s*=/
      );

      if (!nameMatch) {
        throw new SWSError(
          line,
          "SyntaxError",
          `invalid snd attribute: ${text.slice(index)}`
        );
      }

      const name = nameMatch[1];
      index += nameMatch[0].length;

      while (index < text.length && /\s/.test(text[index])) index++;

      let value;

      if (text[index] === '"') {
        index++;
        value = "";
        let closed = false;

        while (index < text.length) {
          const ch = text[index];

          if (ch === '"' && text[index - 1] !== "\\") {
            closed = true;
            index++;
            break;
          }

          value += ch;
          index++;
        }

        if (!closed) {
          throw new SWSError(
            line,
            "SyntaxError",
            `unclosed ${name} attribute`
          );
        }

        value = value
          .replace(/\\"/g, '"')
          .replace(/\\\\/g, "\\");
      } else {
        const valueMatch = text.slice(index).match(/^[^\s]+/);

        if (!valueMatch) {
          throw new SWSError(
            line,
            "SyntaxError",
            `missing value for ${name}`
          );
        }

        value = valueMatch[0];
        index += value.length;
      }

      if (!["class", "Lyric", "vol"].includes(name)) {
        throw new SWSError(
          line,
          "SyntaxError",
          `unknown snd attribute: ${name}`
        );
      }

      if (Object.prototype.hasOwnProperty.call(attributes, name)) {
        throw new SWSError(
          line,
          "SyntaxError",
          `duplicate attribute: ${name}`
        );
      }

      attributes[name] = value;
    }

    if (Object.prototype.hasOwnProperty.call(attributes, "vol")) {
      if (!/^\d+$/.test(attributes.vol)) {
        throw new SWSError(
          line,
          "SyntaxError",
          "vol must be an integer from 0 to 200"
        );
      }

      const volume = Number(attributes.vol);

      if (volume < 0 || volume > 200) {
        throw new SWSError(
          line,
          "SyntaxError",
          "vol must be an integer from 0 to 200"
        );
      }

      attributes.vol = volume;
    }

    return attributes;
  }

  function parsePitchAndAttributes(text, key, line) {
    const attributeStart = findAttributeStart(text);
    const pitchText = attributeStart < 0
      ? text.trim()
      : text.slice(0, attributeStart).trim();
    const attributeText = attributeStart < 0
      ? ""
      : text.slice(attributeStart).trim();

    const attributes = parseAttributes(attributeText, line);
    const className = normalizeName(attributes.class || "main");
    const lyric = Object.prototype.hasOwnProperty.call(
      attributes,
      "Lyric"
    )
      ? attributes.Lyric
      : null;
    const volume = Object.prototype.hasOwnProperty.call(
      attributes,
      "vol"
    )
      ? attributes.vol
      : DEFAULT_VOLUME;

    let notes;

    if (pitchText === "null") {
      notes = [
        new NoteData("null", {
          key,
          midi: null,
          lyric
        })
      ];
    } else if (/^fsn\s*=/.test(pitchText)) {
      const match = pitchText.match(
        /^fsn\s*=\s*\[([\s\S]*)\]$/
      );

      if (!match) {
        throw new SWSError(line, "SyntaxError", "invalid fsn");
      }

      const values = splitTopLevel(match[1]);

      if (values.length < 1 || values.length > 128) {
        throw new SWSError(
          line,
          "ValueError",
          "fsn must contain 1 to 128 notes"
        );
      }

      notes = values.map(value => {
        const note = parsePitch(value, key, line);
        note.lyric = lyric;
        return note;
      });
    } else {
      const note = parsePitch(pitchText, key, line);
      note.lyric = lyric;
      notes = [note];
    }

    return {
      notes,
      className,
      lyric,
      volume
    };
  }

  // ============================================================
  // Compiler
  // ============================================================

  class Compiler {
    constructor(source) {
      this.source = source;
      this.project = new Project();
      this.chips = new Map();
      this.chipStack = new Set();
      this.tempoconstSet = false;
      this.mainCursor = 0;
    }

    compile() {
      const statements = scanStructure(this.source);

      for (const statement of statements) {
        this.compileStatement(statement);
      }

      this.validateSlurs();

      this.project.source = this.source;
      this.project.sourceLines = this.source.split(/\r?\n/);

      this.project.events.sort((a, b) => {
        return a.start - b.start || a.line - b.line;
      });

      for (const track of this.project.tracks) {
        track.events.sort((a, b) => {
          return a.start - b.start || a.line - b.line;
        });
      }

      return this.project;
    }

    compileStatement(statement) {
      if (statement.type === "block") {
        this.compileBlock(statement);
        return;
      }

      const text = statement.text.trim();
      const line = statement.line;

      if (!text) return;

      if (!statement.terminated) {
        throw new SWSError(
          line,
          "SyntaxError",
          "missing semicolon"
        );
      }

      if (/^class(?:\s|=)/.test(text)) {
        throw new SWSError(
          line,
          "SyntaxError",
          'Class declaration is not supported. Use class="..." inside snd().'
        );
      }

      if (/^tempoconst\s*=/.test(text)) {
        this.compileTempoConst(text, line);
        return;
      }

      if (/^newtempo\s*=/.test(text)) {
        this.compileNewTempo(text, line);
        return;
      }

      if (/^key\s*=/.test(text)) {
        this.compileKey(text, line);
        return;
      }

      if (/^sleep\s*\(/.test(text)) {
        this.compileSleep(text, line);
        return;
      }

      if (/^snd\s*\(/.test(text)) {
        this.compileSnd(text, line);
        return;
      }

      if (/^chips\s*\(/.test(text)) {
        this.compileChipsCall(text, line);
        return;
      }

      if (/^output\./.test(text)) {
        this.compileOutput(text, line);
        return;
      }

      if (/^plugin\s*\(/.test(text)) {
        this.compilePlugin(text, line);
        return;
      }

      if (/^index\.class\s*\(/.test(text)) {
        this.compileIndexClass(text, line);
        return;
      }

      throw new SWSError(
        line,
        "SyntaxError",
        `unknown statement: ${text.split(/\s|\(/)[0]}`
      );
    }

    compileBlock(statement) {
      const header = statement.header.trim();
      const line = statement.line;

      const chipMatch = header.match(
        /^chips\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(\s*\)\s*$/
      );

      if (chipMatch) {
        const name = chipMatch[1];

        if (this.chips.has(name)) {
          throw new SWSError(
            line,
            "NameError",
            `chips '${name}' is already declared`
          );
        }

        this.chips.set(name, {
          name,
          line,
          statements: scanStructure(statement.body)
        });

        return;
      }

      const loopMatch = header.match(
        /^lp\s*\(\s*(\d+)\s*\)\s*$/
      );

      if (loopMatch) {
        const count = Number(loopMatch[1]);

        if (count <= 0) {
          throw new SWSError(
            line,
            "ValueError",
            "lp count must be greater than 0"
          );
        }

        const body = scanStructure(statement.body);

        for (let i = 0; i < count; i++) {
          for (const child of body) {
            this.compileStatement(child);
          }
        }

        return;
      }

      throw new SWSError(
        line,
        "SyntaxError",
        `unknown block: ${header}`
      );
    }

    compileTempoConst(text, line) {
      if (this.tempoconstSet) {
        throw new SWSError(
          line,
          "ValueError",
          "tempoconst can only be set once"
        );
      }

      const tempo = Number(
        parseAssignment(text, "tempoconst", line)
      );

      validateTempo(tempo, line);

      this.tempoconstSet = true;
      this.project.tempo = tempo;
      this.project.tempoMap = new TempoMap(tempo);
    }

    compileNewTempo(text, line) {
      const tempo = Number(
        parseAssignment(text, "newtempo", line)
      );

      validateTempo(tempo, line);

      this.project.tempoMap.setTempo(
        this.mainCursor,
        tempo,
        line
      );

      this.project.globalEvents.push({
        type: "tempo",
        beat: this.mainCursor,
        tempo,
        line
      });
    }

    compileKey(text, line) {
      const key = parseAssignment(text, "key", line);

      if (!Object.prototype.hasOwnProperty.call(KEY_SCALES, key)) {
        throw new SWSError(
          line,
          "ValueError",
          `invalid key: ${key}`
        );
      }

      this.project.key = key;
      this.project.globalEvents.push({
        type: "key",
        key,
        line
      });
    }

    compileSleep(text, line) {
      const args = parseCallArguments(text, "sleep", line);

      if (args.length !== 1) {
        throw new SWSError(
          line,
          "SyntaxError",
          "sleep requires exactly one length"
        );
      }

      this.mainCursor += parseDuration(args[0], line);
    }

    compileOutput(text, line) {
      const match = text.match(
        /^output\.(wav|midi|ust|ss)\s*\(([\s\S]*)\)$/i
      );

      if (!match) {
        throw new SWSError(
          line,
          "SyntaxError",
          "invalid output statement"
        );
      }

      const args = splitTopLevel(match[2]);

      if (args.length !== 1) {
        throw new SWSError(
          line,
          "SyntaxError",
          "output requires exactly one filename"
        );
      }

      this.project.outputRequests.push({
        type: match[1].toLowerCase(),
        filename: parseQuoted(args[0], line, "output filename"),
        line,
        className: null
      });
    }

    compilePlugin(text, line) {
      const args = parseCallArguments(text, "plugin", line);

      if (args.length !== 1) {
        throw new SWSError(
          line,
          "SyntaxError",
          "plugin requires exactly one name"
        );
      }

      const name = parseQuoted(args[0], line, "plugin name");

      if (!/^[A-Za-z0-9_]+$/.test(name)) {
        throw new SWSError(
          line,
          "ValueError",
          `invalid plugin name: ${name}`
        );
      }

      this.project.plugins.push({ name, line });
    }

    compileIndexClass(text, line) {
      const args = parseCallArguments(
        text,
        "index.class",
        line
      );

      if (args.length !== 1) {
        throw new SWSError(
          line,
          "SyntaxError",
          "index.class requires exactly one class name"
        );
      }

      const name = parseQuoted(args[0], line, "class name");
      this.project.ensureTrack(name);
    }

    compileChipsCall(text, line) {
      const args = parseCallArguments(text, "chips", line);

      if (args.length !== 1) {
        throw new SWSError(
          line,
          "SyntaxError",
          "chips requires exactly one name"
        );
      }

      const name = args[0].trim();

      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
        throw new SWSError(
          line,
          "SyntaxError",
          "invalid chips name"
        );
      }

      if (!this.chips.has(name)) {
        throw new SWSError(
          line,
          "NameError",
          `chips '${name}' is not declared yet`
        );
      }

      if (this.chipStack.has(name)) {
        throw new SWSError(
          line,
          "RecursionError",
          `chips '${name}' has circular dependency`
        );
      }

      this.chipStack.add(name);

      try {
        for (const child of this.chips.get(name).statements) {
          this.compileStatement(child);
        }
      } finally {
        this.chipStack.delete(name);
      }
    }

    compileSnd(text, line) {
      const parts = splitCnt(text);

      if (parts.length > 1) {
        this.compileCnt(parts, line);
      } else {
        this.compileSingleSnd(text, line);
      }
    }

    parseSnd(text, line) {
      const open = text.indexOf("(");
      const close = findMatching(text, open, "(", ")");

      if (
        open < 0 ||
        close < 0 ||
        text.slice(close + 1).trim()
      ) {
        throw new SWSError(
          line,
          "SyntaxError",
          "invalid snd call"
        );
      }

      const parts = splitFirstArguments(
        text.slice(open + 1, close),
        2
      );

      if (parts.length < 3) {
        throw new SWSError(
          line,
          "SyntaxError",
          "snd requires instrument, length and pitch"
        );
      }

      const instrument = parseQuoted(
        parts[0],
        line,
        "instrument"
      ).toLowerCase();

      if (!VALID_INSTRUMENTS.has(instrument)) {
        throw new SWSError(
          line,
          "ValueError",
          `unknown instrument: ${instrument}`
        );
      }

      const duration = parseDuration(parts[1], line);
      const parsed = parsePitchAndAttributes(
        parts[2],
        this.project.key,
        line
      );

      return {
        instrument,
        duration,
        notes: parsed.notes,
        className: parsed.className,
        volume: parsed.volume,
        source: text
      };
    }

    compileSingleSnd(text, line, options = {}) {
      const parsed = this.parseSnd(text, line);
      const track = this.project.getTrack(parsed.className);
      const start = options.start ?? track.cursor;

      const event = new SoundEvent(
        parsed.instrument,
        start,
        parsed.duration,
        parsed.notes,
        line,
        parsed.className,
        parsed.volume
      );

      event.source = parsed.source;
      event.cntGroup = options.cntGroup || null;
      event.cntRole = options.cntRole || null;

      this.project.addEvent(event);

      if (options.updateCursor !== false) {
        track.cursor = Math.max(track.cursor, event.end);

        if (track.name === "main") {
          this.mainCursor = track.cursor;
        }
      }

      return event;
    }

    compileCnt(parts, line) {
      const groupId = `cnt-${line}-${this.project.events.length}`;
      const left = this.compileSingleSnd(parts[0], line, {
        cntGroup: groupId,
        cntRole: "left"
      });

      const leftTrack = this.project.getTrack(left.className);
      const anchorPitches = eventPitchKeys(left);
      const created = [left];

      for (let i = 1; i < parts.length; i++) {
        const parsed = this.parseSnd(parts[i], line);
        const track = this.project.getTrack(parsed.className);
        let start = track.cursor;

        if (track.name === leftTrack.name) {
          const previous = this.findRelevantSamePitchNode(
            track,
            anchorPitches,
            left
          );

          start = previous
            ? Math.max(left.start, previous.start)
            : left.start;
        }

        const event = new SoundEvent(
          parsed.instrument,
          start,
          parsed.duration,
          parsed.notes,
          line,
          parsed.className,
          parsed.volume
        );

        event.source = parsed.source;
        event.cntGroup = groupId;
        event.cntRole = "right";

        this.project.addEvent(event);
        created.push(event);
      }

      const affectedTracks = new Map();

      for (const event of created) {
        affectedTracks.set(
          event.className,
          this.project.getTrack(event.className)
        );
      }

      for (const track of affectedTracks.values()) {
        const groupEvents = created.filter(
          event => event.className === track.name
        );

        if (!groupEvents.length) continue;

        track.cursor = Math.max(
          track.cursor,
          ...groupEvents.map(event => event.end)
        );

        if (track.name === "main") {
          this.mainCursor = track.cursor;
        }
      }
    }

    findRelevantSamePitchNode(track, pitchKeys, currentEvent) {
      const candidates = track.events
        .filter(event => event !== currentEvent)
        .filter(event => event.start <= currentEvent.start)
        .filter(event => {
          return eventPitchKeys(event).some(
            pitch => pitchKeys.includes(pitch)
          );
        })
        .sort((a, b) => {
          return b.start - a.start || b.line - a.line;
        });

      return candidates[0] || null;
    }

    validateSlurs() {
      for (const event of this.project.events) {
        for (const note of event.notes) {
          if (!note.slur || note.midi === null) continue;

          const target = this.project.events.find(candidate => {
            if (candidate === event) return false;
            if (candidate.className !== event.className) return false;
            if (Math.abs(candidate.start - event.end) > 1e-9) {
              return false;
            }

            return candidate.notes.some(other => {
              return (
                other.midi === note.midi &&
                other.pitch !== "null"
              );
            });
          });

          if (!target) {
            throw new SWSError(
              event.line,
              "SlurError",
              `slur target not found for ${note.pitch}`
            );
          }
        }
      }
    }
  }

  function eventPitchKeys(event) {
    return event.notes
      .filter(note => note.midi !== null)
      .map(note => String(note.midi));
  }

  // ============================================================
  // Syntax highlighting
  // ============================================================

  function removeCommentsForHighlight(source) {
    return removeComments(source);
  }

  function isBlockHeader(text) {
    return (
      /^lp\s*\(\s*\d+\s*\)\s*$/.test(text) ||
      /^chips\s+[A-Za-z_][A-Za-z0-9_]*\s*\(\s*\)\s*$/.test(text)
    );
  }

  function findMissingSemicolonLines(source) {
    const clean = removeCommentsForHighlight(source);
    const lines = clean.split(/\r?\n/);
    const errors = new Set();

    for (let i = 0; i < lines.length; i++) {
      const text = lines[i].trim();

      if (!text) continue;
      if (text === "{" || text === "}") continue;
      if (isBlockHeader(text)) continue;
      if (text.endsWith("{")) continue;
      if (text.endsWith(";")) continue;

      if (
        text.startsWith("snd(") ||
        text.startsWith("sleep(") ||
        text.startsWith("tempoconst") ||
        text.startsWith("newtempo") ||
        text.startsWith("key") ||
        text.startsWith("output.") ||
        text.startsWith("plugin(") ||
        text.startsWith("chips(") ||
        text.startsWith("index.class")
      ) {
        errors.add(i + 1);
      }

      if (/^class(?:\s|=)/.test(text)) {
        errors.add(i + 1);
      }
    }

    return errors;
  }

  function tokenizeHighlightLine(line) {
    const tokens = [];
    let index = 0;

    while (index < line.length) {
      const ch = line[index];

      if (ch === "<") {
        const end = line.indexOf(">", index + 1);

        if (end >= 0) {
          tokens.push({
            className: "syn-comment",
            value: line.slice(index, end + 1)
          });
          index = end + 1;
          continue;
        }
      }

      if (ch === '"') {
        let end = index + 1;

        while (end < line.length) {
          if (line[end] === '"' && line[end - 1] !== "\\") {
            end++;
            break;
          }
          end++;
        }

        tokens.push({
          className: "syn-string",
          value: line.slice(index, end)
        });

        index = end;
        continue;
      }

      const match = line.slice(index).match(
        /^(?:[A-Za-z_][A-Za-z0-9_]*|[A-Ga-g](?:#|b)?-?\d+(?:~!?|!~?)?|\d+(?:\.\d+)?|[=(),[\]{}.;~!])/
      );

      if (!match) {
        tokens.push({ className: "syn-text", value: ch });
        index++;
        continue;
      }

      const value = match[0];
      const lower = value.toLowerCase();
      let className = "syn-text";

      if ([
        "snd", "sleep", "lp", "chips", "tempoconst",
        "newtempo", "key", "output", "plugin", "index"
      ].includes(lower)) {
        className = "syn-command";
      } else if ([
        "class", "lyric", "vol", "fsn", "null"
      ].includes(lower)) {
        className = "syn-keyword";
      } else if (
        /^[A-Ga-g](?:#|b)?-?\d+(?:~!?|!~?)?$/.test(value)
      ) {
        className = "syn-pitch";
      } else if (/^\d/.test(value)) {
        className = "syn-number";
      } else if (/^[=(),[\]{}.;~!]$/.test(value)) {
        className = "syn-operator";
      }

      tokens.push({ className, value });
      index += value.length;
    }

    return tokens;
  }

  function updateLineNumbers() {
    if (!DOM.lineNumbers || !DOM.codeEditor) return;

    const count = Math.max(
      1,
      DOM.codeEditor.value.split("\n").length
    );

    const fragment = document.createDocumentFragment();

    for (let i = 1; i <= count; i++) {
      const span = document.createElement("span");
      span.className = "line-number";
      span.textContent = String(i);
      fragment.appendChild(span);
    }

    DOM.lineNumbers.replaceChildren(fragment);
  }

  function updateHighlight() {
    if (!DOM.codeEditor || !DOM.highlightCode) return;

    const lines = DOM.codeEditor.value.split(/\r?\n/);
    const missing = findMissingSemicolonLines(
      DOM.codeEditor.value
    );

    DOM.highlightCode.innerHTML = lines.map((line, index) => {
      const content = tokenizeHighlightLine(line)
        .map(token => {
          return `<span class="${token.className}">${escapeHtml(token.value)}</span>`;
        })
        .join("") || " ";

      return missing.has(index + 1)
        ? `<span class="syn-error">${content}</span>`
        : content;
    }).join("\n");

    DOM.codeEditor.style.color = "transparent";
    DOM.codeEditor.style.webkitTextFillColor = "transparent";
    DOM.codeEditor.style.caretColor = "var(--text)";
  }

  function syncEditorScroll() {
    if (!DOM.editorScroll) return;

    if (DOM.highlightLayer) {
      DOM.highlightLayer.scrollTop = DOM.editorScroll.scrollTop;
      DOM.highlightLayer.scrollLeft = DOM.editorScroll.scrollLeft;
    }

    if (DOM.codeEditor) {
      DOM.codeEditor.scrollTop = DOM.editorScroll.scrollTop;
      DOM.codeEditor.scrollLeft = DOM.editorScroll.scrollLeft;
    }

    if (DOM.lineNumbers) {
      DOM.lineNumbers.scrollTop = DOM.editorScroll.scrollTop;
    }
  }

  function refreshEditor() {
    updateLineNumbers();
    updateHighlight();
    syncEditorScroll();
  }

  // ============================================================
  // Compile, track UI and files
  // ============================================================

  function compileSource(source, commit = true) {
    clearError();

    try {
      const compiler = new Compiler(source);
      const project = compiler.compile();

      if (commit) {
        state.lastSuccessfulProject = project;
        state.project = project;
        state.source = source;
        state.dirty = false;

        updateProjectInfo(project);
        renderTracks(project);
        setStatus("Compiled", false);
      }

      return project;
    } catch (error) {
      reportError(error);
      if (DOM.compileStatus) DOM.compileStatus.textContent = "Compile failed";
      setStatus("Error", false);
      return null;
    }
  }

  function compileCurrent() {
    if (!DOM.codeEditor) return null;

    const project = compileSource(
      DOM.codeEditor.value,
      true
    );

    if (!project) return null;

    if (DOM.compileStatus) {
      DOM.compileStatus.textContent = "Compile success";
    }

    log(
      `Compile success: Found ${project.events.length} events`,
      "success"
    );

    for (const event of project.events) {
      const pitch = event.notes.length > 1
        ? `[${event.notes.map(note => note.pitch).join(", ")}]`
        : event.notes[0]?.pitch || "null";

      log(
        `sound success:${event.line},${pitch},${formatNumber(event.duration)} beat`,
        "success"
      );
    }

    runPlugins(project);
    return project;
  }

  function updateProjectInfo(project) {
    const main = project.tracks.find(
      track => track.name === "main"
    );

    if (DOM.tempo) {
      DOM.tempo.textContent = String(
        project.tempoMap.segments[0].tempo
      );
    }

    if (DOM.key) DOM.key.textContent = project.key;

    if (DOM.cursor) {
      DOM.cursor.textContent =
        `${formatNumber(main?.cursor || 0)} beat`;
    }
  }

  function renderTracks(project) {
    if (!DOM.trackList || !project) return;

    DOM.trackList.replaceChildren();

    for (const track of project.tracks) {
      const item = document.createElement("div");
      item.className = "track-item";
      item.dataset.trackName = track.name;
      item.dataset.className = track.className;
      item.setAttribute("role", "option");
      item.setAttribute(
        "aria-selected",
        state.selectedTrack === track.name
          ? "true"
          : "false"
      );

      if (state.selectedTrack === track.name) {
        item.classList.add("selected");
      }

      const dot = document.createElement("span");
      dot.className = "track-dot";
      dot.style.background = track.color;

      const info = document.createElement("span");
      info.className = "track-info";

      const name = document.createElement("span");
      name.className = "track-name";
      name.textContent = track.name;

      const meta = document.createElement("span");
      meta.className = "track-meta";
      meta.textContent =
        `class: ${track.className} · cursor: ${formatNumber(track.cursor)} beat`;

      const status = document.createElement("span");
      status.className = "track-state";
      status.dataset.trackState = track.name;
      status.textContent = "idle";

      info.append(name, meta);
      item.append(dot, info, status);
      DOM.trackList.appendChild(item);

      item.addEventListener("click", () => {
        state.selectedTrack = track.name;
        renderTracks(project);
        showTrackSource(project, track.name);
      });
    }

    if (DOM.trackCount) {
      DOM.trackCount.textContent =
        `${project.tracks.length} track${project.tracks.length === 1 ? "" : "s"}`;
    }
  }

  function showTrackSource(project, name) {
    const track = project.tracks.find(item => item.name === name);

    if (!track || !track.sourceStatements.length) return;

    const globals = project.source
      .split(/\r?\n/)
      .filter(line => {
        const text = line.trim();

        return (
          text.startsWith("tempoconst") ||
          text.startsWith("newtempo") ||
          text.startsWith("key") ||
          text.startsWith("output.") ||
          text.startsWith("plugin") ||
          text.startsWith("index.class")
        );
      });

    DOM.codeEditor.value = [
      ...globals,
      ...track.sourceStatements
        .sort((a, b) => a.line - b.line)
        .map(item => item.source)
    ].join("\n");

    refreshEditor();
  }

  function openFile(file) {
    const reader = new FileReader();

    reader.onload = () => {
      try {
        const text = String(reader.result || "");

        if (file.name.toLowerCase().endsWith(".ust")) {
          DOM.codeEditor.value = ustToSs(text);
          log("UST translated to SS", "success");
        } else {
          DOM.codeEditor.value = text;
          log("Loaded .ss", "success");
        }

        state.fileName = file.name;
        state.source = DOM.codeEditor.value;
        state.dirty = false;

        if (DOM.editorFileName) {
          DOM.editorFileName.textContent = file.name;
        }

        refreshEditor();
        compileCurrent();
      } catch (error) {
        reportError(error);
      }
    };

    reader.onerror = () => {
      reportError(new SWSError(
        1,
        "FileError",
        "failed to read file"
      ));
    };

    reader.readAsText(file);
  }

  function saveSs() {
    const source = DOM.codeEditor?.value || state.source;
    const filename = ensureExtension(
      state.fileName || "song",
      ".ss"
    );

    downloadBlob(
      new Blob([source], {
        type: "text/plain;charset=utf-8"
      }),
      filename
    );

    log(`output success:ss,${filename}`, "success");
  }

  // ============================================================
  // UST
