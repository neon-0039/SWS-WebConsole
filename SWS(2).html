      if (this.expansionSourceRange) {
        event.expansionSourceStart = this.expansionSourceRange.start;
        event.expansionSourceEnd = this.expansionSourceRange.end;
      }
      event.cntGroup = options.cntGroup || null;
      event.cntRole = options.cntRole || null;

      this.project.addEvent(event);
      this.currentTrackName = track.name;

      if (options.updateCursor !== false) {
        track.cursor = Math.max(track.cursor, event.end);
        this.mainCursor = track.cursor;
      }

      return event;
    }

    compileCnt(parts, line, sourceText) {
      const statementRange = this.findSourceRange(sourceText, line);
      const expressionId = `cnt-expression-${line}-${this.project.events.length}`;
      const tagExpression = events => {
        events.forEach((event, index) => {
          event.cntExpressionId = expressionId;
          event.cntExpressionStart = statementRange.start;
          event.cntExpressionEnd = statementRange.end;
          event.cntPartIndex = index;
        });
      };
      const parsedParts = parts.map(part => this.parseSnd(part, line));
      const tracks = new Set(
        parsedParts.map(parsed => parsed.className)
      );
      if (tracks.size > 1) {
        let sourceSearchFrom = statementRange.start;
        const created = [];
        for (const part of parts) {
          const sourceRange = this.findSourceRange(
            part,
            line,
            sourceSearchFrom
          );
          created.push(this.compileSingleSnd(part, line, { sourceRange }));
          sourceSearchFrom = sourceRange.end;
        }
        tagExpression(created);
        return;
      }

      const groupId = `cnt-${line}-${this.project.events.length}`;
      let sourceSearchFrom = statementRange.start;
      const leftRange = this.findSourceRange(
        parts[0],
        line,
        sourceSearchFrom
      );
      sourceSearchFrom = leftRange.end;
      const left = this.compileSingleSnd(parts[0], line, {
        sourceRange: leftRange,
        cntGroup: groupId,
        cntRole: "left"
      });

      const leftTrack = this.project.getTrack(left.className);
      const anchorPitches = eventPitchKeys(left);
      const created = [left];

      for (let i = 1; i < parts.length; i++) {
        const parsed = this.parseSnd(parts[i], line);
        const track = this.project.getTrack(parsed.className);
        let start = track.cursor;

        if (track.name === leftTrack.name) {
          const previous = this.findRelevantSamePitchNode(
            track,
            anchorPitches,
            left
          );

          start = previous
            ? Math.max(left.start, previous.start)
            : left.start;
        }

        const event = new SoundEvent(
          parsed.instrument,
          start,
          parsed.duration,
          parsed.notes,
          line,
          parsed.className,
          parsed.volume
        );

        event.source = parsed.source;
        event.classExplicit = parsed.classExplicit;
        event.classImplicit =
          !parsed.classExplicit && !this.expansionTrackName;
        const range = this.findSourceRange(
          parts[i],
          line,
          sourceSearchFrom
        );
        sourceSearchFrom = range.end;
        event.sourceStart = range.start;
        event.sourceEnd = range.end;
        event.sourceId =
          `${line}:${range.start ?? "generated"}:${this.project.events.length}`;
        event.sourceOrder =
          this.expansionSourceRange?.start ?? range.start ??
          this.project.events.length;
        if (this.expansionSourceRange) {
          event.expansionSourceStart = this.expansionSourceRange.start;
          event.expansionSourceEnd = this.expansionSourceRange.end;
        }
        event.cntGroup = groupId;
        event.cntRole = "right";

        this.project.addEvent(event);
        this.currentTrackName = track.name;
        created.push(event);
      }

      const affectedTracks = new Map();

      for (const event of created) {
        affectedTracks.set(
          event.className,
          this.project.getTrack(event.className)
        );
      }

      for (const track of affectedTracks.values()) {
        const groupEvents = created.filter(
          event => event.className === track.name
        );

        if (!groupEvents.length) continue;

        track.cursor = Math.max(
          track.cursor,
          ...groupEvents.map(event => event.end)
        );

        this.mainCursor = track.cursor;
      }
      for (const event of created) {
        event.cntGroupSize = created.length;
      }
      tagExpression(created);
    }

    findRelevantSamePitchNode(track, pitchKeys, currentEvent) {
      const candidates = track.events
        .filter(event => event !== currentEvent)
        .filter(event => event.start <= currentEvent.start)
        .filter(event => {
          return eventPitchKeys(event).some(
            pitch => pitchKeys.includes(pitch)
          );
        })
        .sort((a, b) => {
          return b.start - a.start || b.line - a.line;
        });

      return candidates[0] || null;
    }

    validateSlurs() {
      for (const event of this.project.events) {
        for (const note of event.notes) {
          if (!note.slur || note.midi === null) continue;

          const target = this.project.events.find(candidate => {
            if (candidate === event) return false;
            if (candidate.className !== event.className) return false;
            if (Math.abs(candidate.start - event.end) > 1e-9) {
              return false;
            }

            return candidate.notes.some(other => {
              return (
                other.midi === note.midi &&
                other.pitch !== "null"
              );
            });
          });

          if (!target) {
            throw new SWSError(
              event.line,
              "SlurError",
              `slur target not found for ${note.pitch}`
            );
          }
        }
      }
    }
  }

  function eventPitchKeys(event) {
    return event.notes
      .filter(note => note.midi !== null)
      .map(note => String(note.midi));
  }

  // ============================================================
  // Syntax highlighting
  // ============================================================

  function removeCommentsForHighlight(source) {
    return removeComments(source);
  }

  function isBlockHeader(text) {
    return (
      /^lp\s*\(\s*\d+\s*\)\s*$/.test(text) ||
      /^chips\s+[A-Za-z_][A-Za-z0-9_]*\s*\(\s*\)\s*$/.test(text)
    );
  }

  function findMissingSemicolonLines(source) {
    const clean = removeCommentsForHighlight(source);
    const lines = clean.split(/\r?\n/);
    const errors = new Set();

    for (let i = 0; i < lines.length; i++) {
      const text = lines[i].trim();

      if (!text) continue;
      if (text === "{" || text === "}") continue;
      if (isBlockHeader(text)) continue;
      if (text.endsWith("{")) continue;
      if (text.endsWith(";")) continue;

      if (
        text.startsWith("snd(") ||
        /^sleep\s*\(/.test(text) ||
        /^sleepTicks\s*\(/.test(text) ||
        text.startsWith("tempoconst") ||
        text.startsWith("newtempo") ||
        text.startsWith("key") ||
        text.startsWith("output.") ||
        text.startsWith("plugin(") ||
        text.startsWith("chips(")
      ) {
        errors.add(i + 1);
      }

      if (/^class(?:\s|=)/.test(text)) {
        errors.add(i + 1);
      }
    }

    return errors;
  }

  function tokenizeHighlightLine(line) {
    const tokens = [];
    let index = 0;

    while (index < line.length) {
      const ch = line[index];

      if (ch === "<") {
        const end = line.indexOf(">", index + 1);

        if (end >= 0) {
          tokens.push({
            className: "syn-comment",
            value: line.slice(index, end + 1)
          });
          index = end + 1;
          continue;
        }
      }

      if (ch === '"') {
        let end = index + 1;

        while (end < line.length) {
          if (line[end] === '"' && line[end - 1] !== "\\") {
            end++;
            break;
          }
          end++;
        }

        tokens.push({
          className: "syn-string",
          value: line.slice(index, end)
        });

        index = end;
        continue;
      }

      const match = line.slice(index).match(
        /^(?:[A-Za-z_][A-Za-z0-9_]*|[A-Ga-g](?:#|b)?-?\d+(?:~!?|!~?)?|\d+(?:\.\d+)?|[=(),[\]{}.;~!])/
      );

      if (!match) {
        tokens.push({ className: "syn-text", value: ch });
        index++;
        continue;
      }

      const value = match[0];
      const lower = value.toLowerCase();
      let className = "syn-text";

      if ([
        "snd", "sleep", "sleepticks", "lp", "chips", "tempoconst",
        "newtempo", "key", "output", "plugin"
      ].includes(lower)) {
        className = "syn-command";
      } else if ([
        "class", "lyric", "vol", "fsn", "null"
      ].includes(lower)) {
        className = "syn-keyword";
      } else if (
        /^[A-Ga-g](?:#|b)?-?\d+(?:~!?|!~?)?$/.test(value)
      ) {
        className = "syn-pitch";
      } else if (/^\d/.test(value)) {
        className = "syn-number";
      } else if (/^[=(),[\]{}.;~!]$/.test(value)) {
        className = "syn-operator";
      }

      tokens.push({ className, value });
      index += value.length;
    }

    return tokens;
  }

  function updateLineNumbers() {
    if (!DOM.lineNumbers || !DOM.codeEditor) return;

    const count = Math.max(
      1,
      DOM.codeEditor.value.split("\n").length
    );

    const fragment = document.createDocumentFragment();

    for (let i = 1; i <= count; i++) {
      const span = document.createElement("span");
      span.className = "line-number";
      span.textContent = String(i);
      fragment.appendChild(span);
    }

    DOM.lineNumbers.replaceChildren(fragment);
  }

  function updateHighlight() {
    if (!DOM.codeEditor || !DOM.highlightCode) return;

    const lines = DOM.codeEditor.value.split(/\r?\n/);
    const missing = findMissingSemicolonLines(
      DOM.codeEditor.value
    );

    DOM.highlightCode.innerHTML = lines.map((line, index) => {
      const content = tokenizeHighlightLine(line)
        .map(token => {
          return `<span class="${token.className}">${escapeHtml(token.value)}</span>`;
        })
        .join("") || " ";

      return missing.has(index + 1)
        ? `<span class="syn-error">${content}</span>`
        : content;
    }).join("\n");

    DOM.codeEditor.style.color = "transparent";
    DOM.codeEditor.style.webkitTextFillColor = "transparent";
    DOM.codeEditor.style.caretColor = "var(--text)";
  }

  function syncEditorScroll() {
    if (!DOM.editorScroll) return;

    if (DOM.lineNumbers) {
      DOM.lineNumbers.scrollTop = DOM.editorScroll.scrollTop;
    }
  }

  function updateEditorSize() {
    if (
      !DOM.codeEditor ||
      !DOM.highlightCode ||
      !DOM.highlightLayer ||
      !DOM.editorScroll ||
      !DOM.editorContent
    ) {
      return;
    }

    DOM.codeEditor.style.height = "auto";
    const height = Math.max(
      DOM.codeEditor.scrollHeight,
      DOM.highlightCode.scrollHeight,
      DOM.editorScroll.clientHeight
    );

    DOM.editorContent.style.height = `${height}px`;
    DOM.highlightLayer.style.height = `${height}px`;
    DOM.codeEditor.style.height = `${height}px`;
  }

  function refreshEditor() {
    updateLineNumbers();
    updateHighlight();
    updateEditorSize();
    syncEditorScroll();
  }

  // ============================================================
  // Compile, track UI and files
  // ============================================================

  function saveCurrentTrackEditorState() {
    const track = state.project?.tracks.find(
      item => item.name === state.selectedTrack
    );
    if (!track || !DOM.codeEditor) return;

    track.code = DOM.codeEditor.value;
    track.editorState = {
      selectionStart: DOM.codeEditor.selectionStart,
      selectionEnd: DOM.codeEditor.selectionEnd,
      scrollTop: DOM.editorScroll?.scrollTop || 0,
      scrollLeft: DOM.editorScroll?.scrollLeft || 0
    };
  }

  function composeProjectSource(project = state.project) {
    if (!project) return DOM.codeEditor?.value || state.source;
    if (!project.sourceSegments.length) {
      return project.tracks.map(track => track.code)
        .filter(Boolean)
        .join("\n");
    }

    const insertedTracks = new Set();
    const output = [];
    const appendTrack = name => {
      if (insertedTracks.has(name)) return;
      insertedTracks.add(name);
      const track = project.tracks.find(item => item.name === name);
      if (track?.code) output.push(track.code);
    };

    for (const segment of project.sourceSegments) {
      if (segment.type === "shared") {
        output.push(segment.code);
      } else if (segment.type === "track") {
        appendTrack(segment.trackName);
      } else if (segment.type === "split") {
        for (const part of segment.parts) appendTrack(part.trackName);
      }
    }

    for (const track of project.tracks) appendTrack(track.name);
    return output.join("");
  }

  function loadTrackIntoEditor(trackName, focus = false) {
    const track = state.project?.tracks.find(
      item => item.name === trackName
    );
    if (!DOM.codeEditor) return false;
    if (!track) {
      DOM.codeEditor.value = "";
      refreshEditor();
      return false;
    }

    DOM.codeEditor.value = track.code;
    refreshEditor();
    const editorState = track.editorState;
    DOM.codeEditor.setSelectionRange(
      Math.min(editorState.selectionStart, track.code.length),
      Math.min(editorState.selectionEnd, track.code.length)
    );
    if (DOM.editorScroll) {
      DOM.editorScroll.scrollTop = editorState.scrollTop;
      DOM.editorScroll.scrollLeft = editorState.scrollLeft;
    }
    syncEditorScroll();
    if (focus) DOM.codeEditor.focus();
    updateProjectInfo(state.project);
    return true;
  }

  function compileSource(source, commit = true) {
    clearError();

    try {
      const compiler = new Compiler(source);
      const project = compiler.compile();

      if (commit) {
        for (const trackName of state.pendingTrackNames) {
          if (!project.tracks.some(track => track.name === trackName)) {
            project.ensureTrack(trackName);
          }
        }
        state.lastSuccessfulProject = project;
        state.project = project;
        state.source = source;
        state.dirty = false;

        updateProjectInfo(project);
        renderTracks(project);
        setStatus("Compiled", false);
      }

      return project;
    } catch (error) {
      reportError(error);
      if (DOM.compileStatus) DOM.compileStatus.textContent = "Compile failed";
      setStatus("Error", false);
      return null;
    }
  }

  function compileCurrent(processOutputs = true) {
    if (!DOM.codeEditor) return null;

    saveCurrentTrackEditorState();
    const editorStates = new Map(
      (state.project?.tracks || []).map(track => [
        track.name,
        { ...track.editorState }
      ])
    );
    const source = state.project
      ? composeProjectSource(state.project)
      : DOM.codeEditor.value;
    const project = compileSource(
      source,
      true
    );

    if (!project) return null;

    // Compilation recreates Track objects; preserve their editor positions.
    for (const track of project.tracks) {
      const editorState = editorStates.get(track.name);
      if (editorState) track.editorState = editorState;
    }
    loadTrackIntoEditor(state.selectedTrack);

    if (DOM.compileStatus) {
      DOM.compileStatus.textContent = "Compile success";
    }

    log(
      `Compile success: Found ${project.events.length} events`,
      "success"
    );

    for (const event of project.events) {
      const pitch = event.notes.length > 1
        ? `[${event.notes.map(note => note.pitch).join(", ")}]`
        : event.notes[0]?.pitch || "null";

      log(
        `sound success:${event.line},${pitch},${formatNumber(event.duration)} beat`,
          "success",
          event.className
        );
    }

    try {
      runPlugins(project);
      if (processOutputs) processOutputRequests(project);
    } catch (error) {
      reportError(error);
      if (DOM.compileStatus) DOM.compileStatus.textContent = "Compile failed";
      setStatus("Error", false);
      return null;
    }
    return project;
  }

  function getCurrentProject() {
    return state.dirty || !state.project
      ? compileCurrent(false)
      : state.project;
  }

  function processOutputRequests(project) {
    for (const type of ["ss", "wav", "midi", "ust"]) {
      const requests = project.outputRequests.filter(
        request => request.type === type
      );
      for (const request of requests) {
        try {
          if (type === "ss") saveSs(request, project);
          if (type === "wav") exportWav(project, request);
          if (type === "midi") exportMidi(project, request);
          if (type === "ust") exportUst(project, request);
        } catch (error) {
          throw new SWSError(
            request.line,
            "OutputError",
            `${type.toUpperCase()} output failed: ${error.message || error}`
          );
        }
      }
    }
  }

  function updateProjectInfo(project) {
    const selected = project.tracks.find(
      track => track.name === state.selectedTrack
    ) || project.tracks[0];

    if (DOM.tempo) {
      DOM.tempo.textContent = String(
        project.tempoMap.segments[0].tempo
      );
    }

    if (DOM.key) DOM.key.textContent = project.key;

    if (DOM.cursor) {
      DOM.cursor.textContent =
        `${formatNumber(selected?.cursor || 0)} beat`;
    }
  }

  function renderTracks(project) {
    if (!DOM.trackList || !project) return;

    if (!project.tracks.some(track => track.name === state.selectedTrack)) {
      state.selectedTrack = project.tracks[0]?.name || "default";
    }

    DOM.trackList.replaceChildren();

    for (const track of project.tracks) {
      const item = document.createElement("div");
      item.className = "track-item";
      item.dataset.trackName = track.name;
      item.dataset.className = track.className;
      item.setAttribute("role", "option");
      item.tabIndex = 0;
      item.setAttribute(
        "aria-selected",
        state.selectedTrack === track.name
          ? "true"
          : "false"
      );

      if (state.selectedTrack === track.name) {
        item.classList.add("selected");
      }

      const dot = document.createElement("span");
      dot.className = "track-dot";
      dot.style.background = track.color;

      const info = document.createElement("span");
      info.className = "track-info";

      const name = document.createElement("span");
      name.className = "track-name";
      name.textContent = track.name;

      const meta = document.createElement("span");
      meta.className = "track-meta";
      meta.textContent =
        `class: ${track.className} · cursor: ${formatNumber(track.cursor)} beat`;

      const status = document.createElement("span");
      status.className = "track-state";
      status.dataset.trackState = track.name;
      status.textContent = "idle";

      info.append(name, meta);
      item.append(dot, info, status);
      DOM.trackList.appendChild(item);

      const selectTrack = () => {
        saveCurrentTrackEditorState();
        state.selectedTrack = track.name;
        renderTracks(project);
        loadTrackIntoEditor(track.name, true);
      };

      item.addEventListener("click", selectTrack);
      item.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        selectTrack();
      });
    }

    if (DOM.addNoteButton) {
      DOM.addNoteButton.disabled =
        state.selectedTrack !== "default" &&
        !project.tracks.some(track => track.name === state.selectedTrack);
    }
    if (DOM.renameTrackButton) {
      DOM.renameTrackButton.disabled =
        Boolean(project.tracks.find(
          track => track.name === state.selectedTrack
        )?.hasImplicitSource) ||
        !project.tracks.some(track => track.name === state.selectedTrack);
    }
    if (DOM.deleteTrackButton) {
      DOM.deleteTrackButton.disabled =
        !project.tracks.some(track => track.name === state.selectedTrack);
    }

    if (DOM.trackCount) {
      DOM.trackCount.textContent =
        `${project.tracks.length} track${project.tracks.length === 1 ? "" : "s"}`;
    }
    updateProjectInfo(project);
    renderConsole();
  }

  function addNoteToSelectedTrack() {
    saveCurrentTrackEditorState();
    const project = state.project;
    if (!project) return;

    const trackName = state.selectedTrack;
    const track = project.tracks.find(item => item.name === trackName);
    if (!track) {
      reportError(new SWSError(
        1,
        "ValueError",
        `track '${trackName}' no longer exists`
      ));
      return;
    }

    const source = track.code;
    const newline = source.includes("\r\n") ? "\r\n" : "\n";
    const separator = source && !/[\r\n]$/.test(source) ? newline : "";
    const insertion = `snd("piano","#480",C4 class="${escapeString(trackName)}");`;
    const insertAt = source.length + separator.length;
    DOM.codeEditor.value = `${source}${separator}${insertion}`;
    track.code = DOM.codeEditor.value;
    track.editorState.selectionStart = insertAt + insertion.indexOf("C4");
    track.editorState.selectionEnd = track.editorState.selectionStart + 2;
    state.source = composeProjectSource(project);
    const pitchStart = insertAt + insertion.indexOf("C4");
    DOM.codeEditor.setSelectionRange(pitchStart, pitchStart + 2);
    DOM.codeEditor.dispatchEvent(new Event("input", { bubbles: true }));
    DOM.codeEditor.focus();
    log(`Added a note to track: ${trackName}. Replace the selected C4 pitch as needed.`, "success", trackName);
  }

  function replaceTrackReferences(source, oldName, newName) {
    let result = "";
    let code = "";

    for (let index = 0; index < source.length; index++) {
      const ch = source[index];

      if (ch === "<") {
        const end = source.indexOf(">", index + 1);
        if (end < 0) {
          result += source.slice(index);
          break;
        }

        const comment = source.slice(index, end + 1);
        result += comment;
        code += " ".repeat(comment.length);
        index = end;
        continue;
      }

      if (ch === '"') {
        let end = index + 1;
        while (end < source.length) {
          if (source[end] === '"' && source[end - 1] !== "\\") {
            end++;
            break;
          }
          end++;
        }

        const literal = source.slice(index, end);
        const isTrackReference = /\bclass\s*=\s*$/.test(code);
        const value = literal.slice(1, -1)
          .replace(/\\"/g, '"')
          .replace(/\\\\/g, "\\");

        if (isTrackReference && value === oldName) {
          const replacement = `"${escapeString(newName)}"`;
          result += replacement;
          code += replacement;
        } else {
          result += literal;
          code += literal;
        }

        index = end - 1;
        continue;
      }

      result += ch;
      code += ch;
      if (ch === ";" || ch === "\n") code = "";
    }

    return result;
  }

  function removeTrackSource(source, project, track) {
    const ranges = [];
    const cntExpressions = new Map();

    for (const event of project.events) {
      if (
        !Number.isInteger(event.cntExpressionStart) ||
        !Number.isInteger(event.cntExpressionEnd)
      ) {
        continue;
      }
      const key = `${event.cntExpressionStart}:${event.cntExpressionEnd}`;
      if (!cntExpressions.has(key)) {
        cntExpressions.set(key, {
          start: event.cntExpressionStart,
          end: event.cntExpressionEnd,
          events: []
        });
      }
      cntExpressions.get(key).events.push(event);
    }

    const targetEvents = new Set(track.events);
    for (const expression of cntExpressions.values()) {
      if (!expression.events.some(event => targetEvents.has(event))) continue;
      const remainingParts = new Map();
      for (const event of expression.events) {
        if (
          !targetEvents.has(event) &&
          !remainingParts.has(event.cntPartIndex)
        ) {
          remainingParts.set(event.cntPartIndex, event.source);
        }
      }
      const comments = source
        .slice(expression.start, expression.end)
        .match(/<[\s\S]*?>/g) || [];
      const replacement = [
        ...Array.from(remainingParts.entries())
          .sort((a, b) => a[0] - b[0])
          .map(([, statement]) => `${statement};`),
        ...comments
      ].join("\n");
      ranges.push({
        start: expression.start,
        end: expression.end,
        replacement
      });
    }

    for (const statement of track.sourceStatements) {
      let start = statement.start;
      let end = statement.end;
      const event = statement.event;
      if (
        event &&
        Number.isInteger(event.cntExpressionStart) &&
        Number.isInteger(event.cntExpressionEnd)
      ) {
        continue;
      }

      if (
        statement.expansionStart !== undefined &&
        (statement.kind === "sleep" || !event?.classExplicit)
      ) {
        start = statement.expansionStart;
        end = statement.expansionEnd;
      } else if (event?.cntGroup && event.cntGroupSize) {
        const group = track.events.filter(
          item => item.cntGroup === event.cntGroup
        );
        if (group.length === event.cntGroupSize) {
          start = Math.min(...group.map(item => item.sourceStart));
          end = Math.max(...group.map(item => item.sourceEnd));
        }
      }

      if (Number.isInteger(start) && Number.isInteger(end) && end > start) {
        ranges.push(adjustCntRemovalRange(source, start, end));
      }
    }

    for (const declaration of project.trackDeclarations) {
      if (
        declaration.name === track.name &&
        Number.isInteger(declaration.start) &&
        Number.isInteger(declaration.end)
      ) {
        ranges.push({ start: declaration.start, end: declaration.end });
      }
    }

    const ordered = ranges
      .filter(range => range.start >= 0 && range.end <= source.length)
      .sort((a, b) => a.start - b.start || a.end - b.end);
    const merged = [];
    for (const range of ordered) {
      const previous = merged[merged.length - 1];
      if (previous && range.start <= previous.end) {
        previous.end = Math.max(previous.end, range.end);
      } else {
        merged.push({ ...range });
      }
    }

    let result = source;
    for (const range of merged.reverse()) {
      result =
        result.slice(0, range.start) +
        (range.replacement || "") +
        result.slice(range.end);
    }
    return result;
  }

  function adjustCntRemovalRange(source, start, end) {
    const nextMarker = source.indexOf("-cnt-", end);
    if (
      nextMarker >= 0 &&
      /^\s*$/.test(source.slice(end, nextMarker))
    ) {
      let expandedEnd = nextMarker + 5;
      while (/\s/.test(source[expandedEnd] || "")) expandedEnd++;
      return { start, end: expandedEnd };
    }

    const previousMarker = source.lastIndexOf("-cnt-", start);
    if (
      previousMarker >= 0 &&
      /^\s*$/.test(source.slice(previousMarker + 5, start))
    ) {
      return { start: previousMarker, end };
    }

    return { start, end };
  }

  function applyTrackSourceEdit(source, selectedTrack, message) {
    try {
      new Compiler(source).compile();
    } catch (error) {
      reportError(error);
      return false;
    }

    const previousSource = DOM.codeEditor.value;
    const previousSelection = state.selectedTrack;
    DOM.codeEditor.value = source;
    state.selectedTrack = selectedTrack;
    refreshEditor();

    if (!compileSource(source, true)) {
      DOM.codeEditor.value = previousSource;
      state.selectedTrack = previousSelection;
      refreshEditor();
      setStatus(state.dirty ? "Modified" : "Compiled", state.dirty);
      return false;
    }

    log(message, "success", selectedTrack);
    return true;
  }

  function getEditableProject() {
    saveCurrentTrackEditorState();
    if (state.dirty || !state.project) return compileCurrent(false);
    return state.project;
  }

  function openTrackModal(mode, name = "") {
    if (!DOM.trackModal) return;

    state.trackModalMode = mode;
    DOM.trackModalTitle.textContent = {
      add: "Add Track",
      rename: "Rename Track",
      delete: "Delete Track"
    }[mode];

    const deleting = mode === "delete";
    DOM.trackModalMessage.textContent = deleting
      ? `Delete "${name}"? Its events will be removed from the project.`
      : "";
    DOM.trackModalMessage.hidden = !deleting;
    DOM.trackNameLabel.hidden = deleting;
    DOM.trackNameInput.hidden = deleting;
    DOM.trackNameInput.value = name;
    DOM.trackModalOk.textContent = deleting ? "Delete" : "OK";
    DOM.trackModalOk.classList.toggle("danger", deleting);
    DOM.trackModalOk.classList.toggle("primary", !deleting);
    DOM.trackModal.classList.add("active");
    DOM.trackModal.setAttribute("aria-hidden", "false");

    if (deleting) {
      DOM.trackModalOk.focus();
    } else {
      DOM.trackNameInput.focus();
      DOM.trackNameInput.select();
    }
  }

  function closeTrackModal() {
    DOM.trackModal?.classList.remove("active");
    DOM.trackModal?.setAttribute("aria-hidden", "true");
    state.trackModalMode = null;
  }

  function validateTrackName(name, project, currentName = null) {
    const trackName = String(name);
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(trackName)) {
      reportError(new SWSError(
        1,
        "ValueError",
        "track name must start with a letter or underscore and contain only letters, numbers, and underscores"
      ));
      return null;
    }
    if (
      trackName !== currentName &&
      project.tracks.some(track => track.name === trackName)
    ) {
      reportError(new SWSError(
        1,
        "ValueError",
        `track '${trackName}' already exists`
      ));
      return null;
    }
    return trackName;
  }

  function addTrack(name) {
    const project = getEditableProject();
    if (!project) return false;

    const trackName = validateTrackName(name, project);
    if (!trackName) return false;

    project.ensureTrack(trackName);
    state.pendingTrackNames.add(trackName);
    state.selectedTrack = trackName;
    state.project = project;
    state.source = composeProjectSource(project);
    state.dirty = true;
    renderTracks(project);
    loadTrackIntoEditor(trackName, true);
    setStatus("Modified", true);
    log(`Added track: ${trackName}`, "success", trackName);
    return true;
  }

  function renameSelectedTrack(newName) {
    const project = getEditableProject();
    if (!project) return false;

    const currentName = state.selectedTrack;
    const track = project.tracks.find(item => item.name === currentName);
    if (!track || track.hasImplicitSource) return false;

    const validatedName = validateTrackName(
      newName,
      project,
      currentName
    );
    if (!validatedName) return false;

    track.code = replaceTrackReferences(
      track.code,
      currentName,
      validatedName
    );
    project.renameTrack(currentName, validatedName);
    if (state.pendingTrackNames.delete(currentName)) {
      state.pendingTrackNames.add(validatedName);
    }
    state.selectedTrack = validatedName;
    state.source = composeProjectSource(project);
    state.dirty = true;
    renderTracks(project);
    loadTrackIntoEditor(validatedName, true);
    setStatus("Modified", true);
    log(`Renamed track: ${currentName} -> ${validatedName}`,
      "success",
      validatedName);
    return true;
  }

  function deleteSelectedTrack() {
    const project = getEditableProject();
    if (!project) return false;

    const currentName = state.selectedTrack;
    const track = project.tracks.find(item => item.name === currentName);
    if (!track) {
      return false;
    }

    project.removeTrack(currentName);
    state.pendingTrackNames.delete(currentName);
    state.selectedTrack = project.tracks[0]?.name || "default";
    state.project = project;
    state.source = composeProjectSource(project);
    state.dirty = true;
    renderTracks(project);
    loadTrackIntoEditor(state.selectedTrack, true);
    setStatus("Modified", true);
    log(`Deleted track: ${currentName}; its events were removed`,
      "success",
      state.selectedTrack);
    return true;
  }

  function beginAddTrack() {
    const project = getEditableProject();
    if (!project) return;

    let suffix = project.tracks.length + 1;
    let suggestedName = `track${suffix}`;
    while (project.tracks.some(track => track.name === suggestedName)) {
      suggestedName = `track${++suffix}`;
    }
    openTrackModal("add", suggestedName);
  }

  function beginRenameTrack() {
    const project = getEditableProject();
    if (!project) return;
    const track = project.tracks.find(
      item => item.name === state.selectedTrack
    );
    if (track && !track.hasImplicitSource) {
      openTrackModal("rename", track.name);
    }
  }

  function beginDeleteTrack() {
    const project = getEditableProject();
    if (!project) return;
    const track = project.tracks.find(
      item => item.name === state.selectedTrack
    );
    if (track) {
      openTrackModal("delete", track.name);
    }
  }

  function submitTrackModal() {
    let succeeded = false;
    if (state.trackModalMode === "add") {
      succeeded = addTrack(DOM.trackNameInput.value);
    } else if (state.trackModalMode === "rename") {
      succeeded = renameSelectedTrack(DOM.trackNameInput.value);
    } else if (state.trackModalMode === "delete") {
      succeeded = deleteSelectedTrack();
    }

    if (succeeded) closeTrackModal();
  }

  function openFile(file) {
    const isUst = file.name.toLowerCase().endsWith(".ust");
    const decodeUst = async () => {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const hasUtf16Bom =
        (bytes[0] === 0xff && bytes[1] === 0xfe) ||
        (bytes[0] === 0xfe && bytes[1] === 0xff);
      const encodings = hasUtf16Bom
        ? ["utf-16", "utf-8", "shift_jis"]
        : ["utf-8", "shift_jis", "utf-16"];

      for (const encoding of encodings) {
        try {
          return {
            text: new TextDecoder(encoding, { fatal: true }).decode(bytes),
            encoding
          };
        } catch (_) {}
      }

      log(
        "UST text encoding could not be detected; decoding with UTF-8 replacement characters.",
        "warning"
      );
      return {
        text: new TextDecoder("utf-8").decode(bytes),
        encoding: "utf-8 (replacement)"
      };
    };

    (async () => {
      try {
        const decoded = isUst
          ? await decodeUst()
          : {
              text: await file.text(),
              encoding: "utf-8"
            };
        const text = isUst ? ustToSs(decoded.text) : decoded.text;
        DOM.codeEditor.value = text;
        state.project = null;
        state.lastSuccessfulProject = null;
        state.pendingTrackNames.clear();
        state.selectedTrack = "default";

        if (isUst) {
          const baseName = file.name.replace(/\.ust$/i, "");
          state.fileName = `${baseName}.ss`;
          log(`UST translated to SS (${decoded.encoding})`, "success");
        } else {
          state.fileName = file.name;
          log("Loaded .ss", "success");
        }

        state.source = text;
        state.dirty = false;
        if (DOM.editorFileName) {
          DOM.editorFileName.textContent = state.fileName;
        }

        refreshEditor();
        state.pendingTrackNames.clear();
        const project = compileSource(text, true);
        if (project) {
          state.selectedTrack = project.tracks[0]?.name || "default";
          renderTracks(project);
          loadTrackIntoEditor(state.selectedTrack);
        }
      } catch (error) {
        reportError(error instanceof SWSError
          ? error
          : new SWSError(1, "FileError", `failed to read file: ${error.message || error}`));
      }
    })();
  }

  function saveSs(request = null, project = state.project) {
    saveCurrentTrackEditorState();
    const source = request && project
      ? project.source
      : project
        ? composeProjectSource(project)
        : DOM.codeEditor?.value || state.source;
    const filename = outputFilename(
      request?.filename || state.fileName || "song",
      "ss"
    );

    downloadBlob(
      new Blob([source], {
        type: "text/plain;charset=utf-8"
      }),
      filename
    );

    log(`output success:ss,${filename}`, "success");
  }

  // ============================================================
  // UST
  // ============================================================

  function midiToPitch(midi) {
    const names = [
      "C", "C#", "D", "D#", "E", "F",
      "F#", "G", "G#", "A", "A#", "B"
    ];

    return `${names[midi % 12]}${Math.floor(midi / 12) - 1}`;
  }

  function ustToSs(text) {
    const lines = String(text).replace(/^\uFEFF/, "").split(/\r?\n/);
    const notes = [];
    let current = null;
    let currentNoteLine = 1;
    let section = "";
    let tempo = 120;
    let lineNumber = 0;

    const finishNote = () => {
      if (!current) return;
      const rawLength = current.Length ?? "480";
      const rawNoteNumber = current.NoteNum ?? "60";
      if (!/^\d+$/.test(rawLength)) {
        throw new SWSError(currentNoteLine, "ValueError", `invalid Length: ${rawLength}`);
      }
      if (!/^-?\d+$/.test(rawNoteNumber)) {
        throw new SWSError(currentNoteLine, "ValueError", `invalid NoteNum: ${rawNoteNumber}`);
      }
      const length = Number(rawLength);
      const noteNumber = Number(rawNoteNumber);
      if (length <= 0) {
        throw new SWSError(currentNoteLine, "ValueError", "Length must be greater than 0");
      }
      if (noteNumber < 0 || noteNumber > 127) {
        throw new SWSError(currentNoteLine, "ValueError", `NoteNum out of range: ${noteNumber}`);
      }
      notes.push({
        length,
        noteNumber,
        lyric: String(current.Lyric || "").trim()
      });
      current = null;
    };

    for (const raw of lines) {
      lineNumber++;
      const line = raw.trim();
      if (!line) continue;

      const header = line.match(/^\[#([^\]]+)\]$/);
      if (header) {
        finishNote();
        const name = header[1];
        if (name === "TRACKEND") break;
        if (name === "SETTING" || name === "VERSION") {
          section = name;
        } else if (/^\d+$/.test(name)) {
          section = "NOTE";
          current = {};
          currentNoteLine = lineNumber;
        } else {
          throw new SWSError(
            lineNumber,
            "SyntaxError",
            `unsupported UST section: [${name}]`
          );
        }
        continue;
      }

      const separator = line.indexOf("=");
      if (separator < 0) continue;
      const name = line.slice(0, separator).trim();
      const value = line.slice(separator + 1).trim();

      if (section === "SETTING" && name === "Tempo") {
        const parsedTempo = Number(value);
        if (!Number.isFinite(parsedTempo) || parsedTempo <= 0 || parsedTempo > 500) {
          throw new SWSError(
            lineNumber,
            "ValueError",
            `invalid Tempo value: ${value}`
          );
        }
        tempo = parsedTempo;
      } else if (section === "NOTE" && current) {
        current[name] = value;
      }
    }
    finishNote();

    const result = [
      `tempoconst="${tempo.toFixed(2)}";`,
      'key="null";',
      ""
    ];
    for (const note of notes) {
      if (note.lyric.toUpperCase() === "R") {
        result.push(`sleepTicks(${note.length});`);
        continue;
      }

      const lyric = note.lyric
        ? ` Lyric="${escapeString(note.lyric)}"`
        : "";
      result.push(
        `snd("synth","#${note.length}",${midiToPitch(note.noteNumber)}${lyric});`
      );
    }
    return result.join("\n");
  }

  function exportUst(
    project = getCurrentProject(),
    request = null
  ) {
    if (!project) return;

    request ||= project.outputRequests.find(
      item => item.type === "ust"
    );

    const className = request?.className || null;
    const events = project.events
      .filter(event => !className || event.className === className)
      .slice()
      .sort((a, b) => a.start - b.start || a.line - b.line);
    if (className && !events.length) {
      throw new SWSError(
        request.line,
        "ValueError",
        `UST class '${className}' not found`
      );
    }

    const lines = [
      "[#VERSION]",
      "UST Version1.2",
      "",
      "[#SETTING]",
      `Tempo=${project.tempoMap.segments[0].tempo.toFixed(2)}`,
      "Tracks=1",
      "ProjectName=SoundWavScript",
      "VoiceDir=%VOICE%uta",
      "OutFile=",
      "CacheDir=sample.cache",
      "Tool1=wavtool.exe",
      "Tool2=resampler.exe",
      "Mode2=True",
      ""
    ];

    let index = 0;
    let cursor = 0;

    for (const event of events) {
      if (event.start > cursor) {
        appendUstRest(
          lines,
          index++,
          event.start - cursor
        );
      }

      const notes = event.notes.filter(
        note => note.midi !== null
      );

      if (!notes.length) {
        appendUstRest(lines, index++, event.duration);
        cursor = event.end;
        continue;
      }

      const lowest = Math.min(
        ...notes.map(note => note.midi)
      );

      const lyric = notes.length > 1
        ? notes
          .slice()
          .sort((a, b) => a.midi - b.midi)
          .map(note => midiToPitch(note.midi))
          .join("")
        : notes[0].lyric || "R";

      lines.push(
        `[#${String(index++).padStart(4, "0")}]`,
        `Length=${Math.round(event.duration * 480)}`,
        `Lyric=${lyric}`,
        `NoteNum=${lowest}`,
        "Intensity=100",
        "Modulation=0",
        ""
      );

      cursor = event.end;
    }

    lines.push("[#TRACKEND]", "");

    const filename = outputFilename(request?.filename || "song", "ust");

    downloadBlob(
      new Blob([lines.join("\n")], {
        type: "text/plain;charset=utf-8"
      }),
      filename
    );

    log(`output success:ust,${filename}`, "success");
  }

  function appendUstRest(lines, index, beats) {
    lines.push(
      `[#${String(index).padStart(4, "0")}]`,
      `Length=${Math.round(beats * 480)}`,
      "Lyric=R",
      "Intensity=100",
      "Modulation=0",
      ""
    );
  }

  // ============================================================
  // MIDI
  // ============================================================

  function writeVariableLength(value) {
    let buffer = value & 0x7f;
    const result = [];

    while ((value >>= 7)) {
      buffer <<= 8;
      buffer |= (value & 0x7f) | 0x80;
    }

    while (true) {
      result.push(buffer & 0xff);

      if (buffer & 0x80) {
        buffer >>= 8;
      } else {
        break;
      }
    }

    return result;
  }

  function exportMidi(
    project = getCurrentProject(),
    request = null
  ) {
    if (!project) return;
    request ||= project.outputRequests.find(
      item => item.type === "midi"
    );

    const queue = [];

    for (const segment of project.tempoMap.segments) {
      const tick = Math.round(segment.beat * PPQ);
      const micros = Math.round(60000000 / segment.tempo);

      queue.push({
        tick,
        priority: 0,
        bytes: [
          0xff,
          0x51,
          0x03,
          (micros >> 16) & 0xff,
          (micros >> 8) & 0xff,
          micros & 0xff
        ]
      });
    }

    for (const event of project.events) {
      const start = Math.round(event.start * PPQ);
      const end = Math.round(event.end * PPQ);
      const velocity = Math.max(
        0,
        Math.min(127, Math.round(event.volume * 1.27))
      );

      for (const note of event.notes) {
        if (note.midi === null) continue;

        queue.push({
          tick: end,
          priority: 1,
          bytes: [0x80, note.midi, 0]
        });

        queue.push({
          tick: start,
          priority: 2,
          bytes: [0x90, note.midi, velocity]
        });
      }
    }

    queue.sort((a, b) => {
      return a.tick - b.tick || a.priority - b.priority;
    });

    const track = [];
    let current = 0;

    for (const item of queue) {
      track.push(
        ...writeVariableLength(item.tick - current),
        ...item.bytes
      );
      current = item.tick;
    }

    track.push(0, 0xff, 0x2f, 0);

    const header = [
      0x4d, 0x54, 0x68, 0x64,
      0, 0, 0, 6,
      0, 0,
      0, 1,
      1, 0xe0
    ];

    const trackHeader = [
      0x4d, 0x54, 0x72, 0x6b,
      (track.length >> 24) & 0xff,
      (track.length >> 16) & 0xff,
      (track.length >> 8) & 0xff,
      track.length & 0xff
    ];

    downloadBlob(
      new Blob([
        new Uint8Array([
          ...header,
          ...trackHeader,
          ...track
        ])
      ], { type: "audio/midi" }),
      outputFilename(request?.filename || "song", "midi")
    );

    log(
      `output success:midi,${outputFilename(request?.filename || "song", "midi")}`,
      "success"
    );
  }

  // ============================================================
  // WAV and Web Audio
  // ============================================================

  function softClip(value) {
    return Math.tanh(value * 1.15);
  }

  function noiseWhite(seed, index) {
    let value = (seed + Math.imul(index + 1, 0x6d2b79f5)) | 0;
    value = Math.imul(value ^ value >>> 15, value | 1);
    value ^= value + Math.imul(value ^ value >>> 7, value | 61);
    return ((value ^ value >>> 14) >>> 0) / 2147483648 - 1;
  }

  function noisePink(seed, index) {
    return (
      noiseWhite(seed, index) * 0.45 +
      noiseWhite(seed ^ 0x51ed270b, index >> 2) * 0.3 +
      noiseWhite(seed ^ 0x2c1b3c6d, index >> 5) * 0.17 +
      noiseWhite(seed ^ 0x297a2d39, index >> 8) * 0.08
    );
  }

  function lowpassFilter(input, cutoff, sampleRate, state) {
    const alpha = 1 - Math.exp(
      -2 * Math.PI * Math.min(cutoff, sampleRate * 0.45) / sampleRate
    );
    state.low += alpha * (input - state.low);
    return state.low;
  }

  function highpassFilter(input, cutoff, sampleRate, state) {
    const alpha = Math.exp(
      -2 * Math.PI * Math.min(cutoff, sampleRate * 0.45) / sampleRate
    );
    const output = alpha * (state.high + input - state.previousInput);
    state.previousInput = input;
    state.high = output;
    return output;
  }

  function bandpassFilter(input, lowCutoff, highCutoff, sampleRate, state) {
    const high = highpassFilter(
      input,
      lowCutoff,
      sampleRate,
      state.highpass
    );
    return lowpassFilter(
      high,
      highCutoff,
      sampleRate,
      state.lowpass
    );
  }

  function oscSaw(phase) {
    const cycles = phase / (2 * Math.PI);
    return 2 * (cycles - Math.floor(cycles + 0.5));
  }

  function oscSquare(phase) {
    return Math.sin(phase) >= 0 ? 1 : -1;
  }

  function oscTriangle(phase) {
    return 2 / Math.PI * Math.asin(Math.sin(phase));
  }

  function generatePiano(frequency, time, params) {
    const phase = 2 * Math.PI * frequency * time;
    const brightness = 0.7 + params.velocity * 0.3;
    const body =
      Math.sin(phase) * Math.exp(-1.5 * time) +
      Math.sin(phase * 2.01) * 0.48 * Math.exp(-2.4 * time) +
      Math.sin(phase * 3.02) * 0.25 * Math.exp(-3.2 * time) +
      Math.sin(phase * 4.05) * 0.13 * brightness * Math.exp(-4 * time) +
      Math.sin(phase * 5.09) * 0.07 * brightness * Math.exp(-5 * time) +
      Math.sin(phase * 6.14) * 0.035 * brightness * Math.exp(-6 * time);
    const hammer = Math.exp(-70 * time) * (
      noiseWhite(params.seed, params.sampleIndex) *
        (0.08 + params.velocity * 0.1) +
      Math.sin(phase * 2) * 0.15 +
      Math.sin(phase * 5) * 0.06
    );
    return softClip((body + hammer) * (1 + params.velocity * 0.08));
  }

  function generateBass(frequency, time, params) {
    const phase = 2 * Math.PI * frequency * time;
    const subAmount = frequency < 110 ? 0.38 : 0.24;
    const upperAmount = frequency > 180 ? 0.23 : 0.13;
    const transient = Math.exp(-16 * time) *
      Math.sin(phase * 2) * (0.04 + params.velocity * 0.05);
    return softClip(
      Math.sin(phase) * 0.58 +
      Math.sin(phase * 0.5) * subAmount +
      Math.sin(phase * 2) * upperAmount +
      Math.sin(phase * 3) * 0.06 +
      transient
    );
  }

  function generateGuitar(frequency, time, params) {
    const phase = 2 * Math.PI * frequency * time;
    const brightness = 0.65 + params.velocity * 0.35;
    const pluck =
      Math.sin(phase) * Math.exp(-2.2 * time) +
      Math.sin(phase * 2.01) * 0.38 * Math.exp(-3.4 * time) +
      Math.sin(phase * 3.02) * 0.18 * brightness * Math.exp(-5.2 * time) +
      Math.sin(phase * 4.04) * 0.08 * brightness * Math.exp(-7.5 * time);
    const pick = Math.exp(-75 * time) * (
      noiseWhite(params.seed, params.sampleIndex) * 0.08 +
      Math.sin(phase * 5) * 0.1
    );
    return softClip((pluck + pick) * (0.9 + params.velocity * 0.1));
  }

  function generateKick(frequency, time, params) {
    const pitch = frequency +
      Math.max(70, frequency * 7) * Math.exp(-35 * time);
    const body = Math.sin(2 * Math.PI * pitch * time) *
      Math.exp(-8.5 * time);
    const sub = Math.sin(
      2 * Math.PI * frequency * 0.5 * time
    ) * Math.exp(-6 * time);
    const click = highpassFilter(
      noiseWhite(params.seed, params.sampleIndex),
      1800,
      params.sampleRate,
      params.filterState.noiseHighpass
    ) * Math.exp(-90 * time);
    return softClip(body * 0.78 + sub * 0.2 + click * 0.12);
  }

  function generateSnare(frequency, time, params) {
    const bodyFrequency = Math.max(130, Math.min(240, frequency));
    const body =
      Math.sin(2 * Math.PI * bodyFrequency * time) +
      0.55 * Math.sin(2 * Math.PI * bodyFrequency * 1.34 * time) +
      0.25 * Math.sin(2 * Math.PI * bodyFrequency * 1.83 * time);
    const noise = bandpassFilter(
      noisePink(params.seed, params.sampleIndex),
      700,
      9000,
      params.sampleRate,
      params.filterState
    );
    const transient = Math.exp(-110 * time) *
      noiseWhite(params.seed ^ 0x4f1bbcdc, params.sampleIndex);
    return softClip(
      body * Math.exp(-14 * time) * 0.25 +
      noise * Math.exp(-22 * time) * (0.55 + params.velocity * 0.12) +
      transient * 0.35
    );
  }

  function generateHiHat(time, params, open = false) {
    const metallic =
      Math.sin(2 * Math.PI * 6800 * time) +
      Math.sin(2 * Math.PI * 8200 * time) +
      Math.sin(2 * Math.PI * 9100 * time) +
      Math.sin(2 * Math.PI * 10100 * time) +
      Math.sin(2 * Math.PI * 11300 * time) +
      Math.sin(2 * Math.PI * 12700 * time) +
      Math.sin(2 * Math.PI * 13700 * time);
    const highNoise = highpassFilter(
      noiseWhite(params.seed, params.sampleIndex),
      6500,
      params.sampleRate,
      params.filterState.noiseHighpass
    );
    const decay = open ? 10 : 38;
    return softClip(
      (highNoise * 0.72 + metallic * 0.045) *
      Math.exp(-decay * time)
    );
  }

  function generateSynthLead(frequency, time, params) {
    const phase = 2 * Math.PI * frequency * time;
    const brightness = Math.exp(-4 * time);
    const detuned =
      Math.sin(phase * 0.997) * 0.34 +
      Math.sin(phase) * 0.34 +
      Math.sin(phase * 1.003) * 0.34;
    const saw = oscSaw(phase) * (0.22 + brightness * 0.16);
    const square = oscSquare(phase) * 0.08;
    const upper = Math.sin(phase * 2) *
      (0.08 + brightness * 0.12) *
      (0.7 + params.velocity * 0.3);
    const filtered = lowpassFilter(
      detuned + saw + square + upper,
      900 + brightness * 6500,
      params.sampleRate,
      params.filterState.lowpass
    );
    return softClip(filtered);
  }

  function generateDrum(frequency, time, params) {
    const pitch = frequency * (1 + 4 * Math.exp(-25 * time));
    const body = Math.sin(2 * Math.PI * pitch * time) *
      Math.exp(-8 * time);
    const click = highpassFilter(
      noiseWhite(params.seed, params.sampleIndex),
      2200,
      params.sampleRate,
      params.filterState.noiseHighpass
    ) * Math.exp(-65 * time);
    return softClip(body * 0.9 + click * 0.08);
  }

  function synthWave(instrument, frequency, time, params = {}) {
    const phase = 2 * Math.PI * frequency * time;
    const name = String(instrument).toLowerCase();
    const sampleRate = params.sampleRate || SAMPLE_RATE;
    const sampleIndex = params.sampleIndex || 0;
    const velocity = Math.max(
      0,
      Math.min(2, params.velocity ?? 1)
    );
    params.sampleRate = sampleRate;
    params.sampleIndex = sampleIndex;
    params.velocity = velocity;
    params.seed = params.seed || 1;

    if (name === "square") {
      return softClip(
        oscSquare(phase) * (0.75 + velocity * 0.05) +
        Math.sin(phase * 3) * 0.12 * velocity +
        Math.sin(phase * 5) * 0.06 * velocity
      );
    }

    if (name === "triangle") {
      return (
        oscTriangle(phase) * 0.92 +
        Math.sin(phase * 2) * 0.04 +
        Math.sin(phase * 3) * 0.04
      );
    }

    if (name === "saw" || name === "sawtooth") {
      return softClip(
        oscSaw(phase) * (0.7 + velocity * 0.05) +
        Math.sin(phase * 2) * 0.18 * velocity +
        Math.sin(phase * 3) * 0.08 * velocity +
        Math.sin(phase * 4) * 0.04 * velocity
      );
    }

    if (name === "synth" || name === "synth_lead") {
      return generateSynthLead(frequency, time, params);
    }

    if (name === "bass" || name === "synth_bass") {
      return generateBass(frequency, time, params);
    }

    if (name === "guitar") {
      return generateGuitar(frequency, time, params);
    }

    if (name === "piano" || name === "grand_piano") {
      return generatePiano(frequency, time, params);
    }

    if (name === "kick") {
      return generateKick(frequency, time, params);
    }

    if (name === "snare") {
      return generateSnare(frequency, time, params);
    }

    if (
      name === "hihat" ||
      name === "hi_hat" ||
      name === "open_hihat"
    ) {
      return generateHiHat(
        time,
        params,
        name === "open_hihat"
      );
    }

    if (name === "drum" || name === "drums") {
      return generateDrum(frequency, time, params);
    }

    return Math.sin(phase);
  }

  function envelope(time, duration, instrument = "") {
    if (duration <= 0 || time < 0 || time >= duration) {
      return 0;
    }

    const name = String(instrument).toLowerCase();
    const isPercussion = [
      "kick", "snare", "hihat", "hi_hat", "open_hihat", "drum", "drums"
    ].includes(name);
    const attack = Math.min(
      isPercussion ? 0.002 : 0.015,
      duration * (isPercussion ? 0.02 : 0.08)
    );
    const decay = Math.min(
      isPercussion ? 0.025 : 0.08,
      duration * 0.2
    );
    const release = Math.min(
      isPercussion ? 0.03 : 0.12,
      duration * 0.25
    );
    const sustain = isPercussion ? 0.82 : 0.9;

    if (time < attack) {
      const progress = time / attack;
      return progress * progress * (3 - 2 * progress);
    }
    if (time < attack + decay) {
      const progress = (time - attack) / decay;
      return 1 - progress * (1 - sustain);
    }
    if (time > duration - release) {
      const progress = (duration - time) / release;
      return sustain * progress * progress * (3 - 2 * progress);
    }

    return sustain;
  }

  function noteFrequency(note) {
    return 440 * Math.pow(2, (note.midi - 69) / 12);
  }

  function createFilterState() {
    return {
      highpass: { high: 0, previousInput: 0 },
      lowpass: { low: 0 },
      noiseHighpass: { high: 0, previousInput: 0 },
      noiseLowpass: { low: 0 }
    };
  }

  function panFor(instrument, note) {
    const name = String(instrument).toLowerCase();
    if (name === "piano" || name === "grand_piano") {
      return Math.max(-0.28, Math.min(0.28, (note.midi - 60) / 48));
    }
    if (name === "guitar") {
      return Math.max(-0.12, Math.min(0.12, (note.midi - 60) / 72));
    }
    if (name === "hihat" || name === "hi_hat" || name === "open_hihat") {
      return 0.16;
    }
    if (name === "snare") return -0.04;
    return 0;
  }

  // Share one seeded stereo render path between live playback and WAV export.
  function renderAudio(project, sampleRate = SAMPLE_RATE) {
    const totalBeat = Math.max(
      ...project.events.map(event => event.end)
    );
    const totalSeconds = project.tempoMap.beatToSeconds(totalBeat);
    const dryLength = Math.max(1, Math.ceil(totalSeconds * sampleRate));
    const tailLength = Math.ceil(0.12 * sampleRate);
    const left = new Float32Array(dryLength + tailLength);
    const right = new Float32Array(dryLength + tailLength);
    const reverbLeft = new Float32Array(dryLength);
    const reverbRight = new Float32Array(dryLength);

    for (const event of project.events) {
      const start = project.tempoMap.beatToSeconds(event.start);
      const end = project.tempoMap.beatToSeconds(event.end);
      const duration = end - start;
      const offset = Math.floor(start * sampleRate);
      const count = Math.min(
        left.length - offset,
        Math.ceil(duration * sampleRate)
      );
      const baseVolume = Math.max(
        0,
        Math.min(2, event.volume / 100)
      );
      const isDryInstrument = [
        "bass", "synth_bass", "kick"
      ].includes(event.instrument);

      for (const note of event.notes) {
        if (note.midi === null) continue;

        const pan = panFor(event.instrument, note);
        const leftGain = Math.sqrt((1 - pan) * 0.5);
        const rightGain = Math.sqrt((1 + pan) * 0.5);
        const voiceParams = {
          sampleRate,
          sampleIndex: 0,
          velocity: baseVolume,
          seed: (
            Math.imul(event.line + 1, 0x45d9f3b) ^
            Math.imul(note.midi + 1, 0x119de1f3) ^
            Math.floor(event.start * PPQ)
          ) | 0,
          filterState: createFilterState()
        };
        const frequency = noteFrequency(note);

        for (let index = 0; index < count; index++) {
          const outputIndex = offset + index;
          const time = index / sampleRate;
          voiceParams.sampleIndex = index;
          const sample = synthWave(
            event.instrument,
            frequency,
            time,
            voiceParams
          ) * envelope(time, duration, event.instrument);
          const value = sample * 0.18 * baseVolume;

          left[outputIndex] += value * leftGain;
          right[outputIndex] += value * rightGain;

          if (!isDryInstrument && outputIndex < dryLength) {
            reverbLeft[outputIndex] += value * leftGain * 0.12;
            reverbRight[outputIndex] += value * rightGain * 0.12;
          }
        }
      }
    }

    const taps = [
      [0.031, 0.22],
      [0.047, 0.16],
      [0.071, 0.12],
      [0.113, 0.08]
    ];
    for (let index = 0; index < dryLength; index++) {
      for (const [delay, amount] of taps) {
        const delayedIndex = index + Math.round(delay * sampleRate);
        if (delayedIndex >= left.length) continue;
        left[delayedIndex] += reverbRight[index] * amount;
        right[delayedIndex] += reverbLeft[index] * amount;
      }
    }

    let peak = 0;
    let detector = 0;
    const attackCoefficient = Math.exp(-1 / (0.005 * sampleRate));
    const releaseCoefficient = Math.exp(-1 / (0.08 * sampleRate));
    for (let index = 0; index < left.length; index++) {
      const inputPeak = Math.max(
        Math.abs(left[index]),
        Math.abs(right[index])
      );
      const coefficient = inputPeak > detector
        ? attackCoefficient
        : releaseCoefficient;
      detector = coefficient * detector +
        (1 - coefficient) * inputPeak;
      const compressionGain = detector > 0.65
        ? (0.65 + (detector - 0.65) / 3) / detector
        : 1;
      left[index] = softClip(left[index] * compressionGain * 1.08);
      right[index] = softClip(right[index] * compressionGain * 1.08);
      peak = Math.max(
        peak,
        Math.abs(left[index]),
        Math.abs(right[index])
      );
    }

    const limiter = peak > 0.891 ? 0.891 / peak : 1;
    if (limiter < 1) {
      for (let index = 0; index < left.length; index++) {
        left[index] *= limiter;
        right[index] *= limiter;
      }
    }

    return { left, right };
  }

  function exportWav(
    project = getCurrentProject(),
    request = null
  ) {
    if (!project) return;
    request ||= project.outputRequests.find(
      item => item.type === "wav"
    );
    if (!project.events.length) {
      throw new SWSError(1, "ValueError", "no sound events");
    }

    const totalBeat = project.events.length
      ? Math.max(...project.events.map(event => event.end))
      : 0;
    if (totalBeat <= 0) {
      throw new SWSError(1, "ValueError", "total duration is zero");
    }
    const stereoSamples = renderAudio(project, SAMPLE_RATE);

    downloadBlob(
      makeWavBlob(
        [stereoSamples.left, stereoSamples.right],
        SAMPLE_RATE
      ),
      outputFilename(request?.filename || "song", "wav")
    );

    log(
      `output success:wav,${outputFilename(request?.filename || "song", "wav")}`,
      "success"
    );
  }

  function makeWavBlob(samples, sampleRate) {
    const channels = Array.isArray(samples) ? samples : [samples];
    const channelCount = channels.length;
    if (
      !channelCount ||
      channels.some(channel => channel.length !== channels[0].length)
    ) {
      throw new TypeError("WAV channels must have equal sample lengths");
    }

    const frameCount = channels[0].length;
    const blockAlign = channelCount * 2;
    const dataSize = frameCount * blockAlign;
    const buffer = new ArrayBuffer(44 + dataSize);
    const view = new DataView(buffer);

    function writeText(offset, text) {
      for (let i = 0; i < text.length; i++) {
        view.setUint8(offset + i, text.charCodeAt(i));
      }
    }

    writeText(0, "RIFF");
    view.setUint32(4, 36 + dataSize, true);
    writeText(8, "WAVE");
    writeText(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, channelCount, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, 16, true);
    writeText(36, "data");
    view.setUint32(40, dataSize, true);

    let offset = 44;
    for (let frame = 0; frame < frameCount; frame++) {
      for (const channel of channels) {
        const sample = channel instanceof Int16Array
          ? channel[frame] / 32768
          : channel[frame];
        const value = Math.max(-1, Math.min(1, sample));
        view.setInt16(
          offset,
          Math.round(value * (value < 0 ? 32768 : 32767)),
          true
        );
        offset += 2;
      }
    }

    return new Blob([buffer], { type: "audio/wav" });
  }

  async function playProject(project = getCurrentProject()) {
    if (!project) return;

    stopPlayback();

    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
      reportError(new SWSError(
        1,
        "AudioError",
        "Web Audio API is not supported"
      ));
      return;
    }

    state.audioContext = new AudioContextClass();
    await state.audioContext.resume();

    state.playing = true;

    if (DOM.playButton) DOM.playButton.disabled = true;
    if (DOM.stopButton) DOM.stopButton.disabled = false;

    setStatus("Playing", false);
    log("Playing...", "success");

    const base = state.audioContext.currentTime + 0.05;
    const audio = renderAudio(project, state.audioContext.sampleRate);
    const audioBuffer = state.audioContext.createBuffer(
      2,
      audio.left.length,
      state.audioContext.sampleRate
    );
    audioBuffer.copyToChannel(audio.left, 0);
    audioBuffer.copyToChannel(audio.right, 1);
    const source = state.audioContext.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(state.audioContext.destination);
    source.start(base);
    state.audioNodes.add(source);
    source.addEventListener("ended", () => {
      state.audioNodes.delete(source);
    });

    for (const event of project.events) {
      const start = project.tempoMap.beatToSeconds(event.start);
      const timer = setTimeout(() => {
        updatePlaybackTrack(event.className, event.line);
      }, start * 1000);

      state.timers.add(timer);
    }

    const totalBeat = project.events.length
      ? Math.max(...project.events.map(event => event.end))
      : 0;

    const finish = setTimeout(() => {
      stopPlayback();
    }, audio.left.length / state.audioContext.sampleRate * 1000 + 300);

    state.timers.add(finish);
  }

  function updatePlaybackTrack(trackName, line) {
    document.querySelectorAll("[data-track-state]").forEach(element => {
      const active = element.dataset.trackState === trackName;
      element.classList.toggle("playing", active);
      element.textContent = active ? `▶ line ${line}` : "idle";
    });
  }

  function stopPlayback() {
    for (const timer of state.timers) {
      clearTimeout(timer);
    }

    state.timers.clear();

    for (const node of state.audioNodes) {
      try {
        node.stop();
      } catch (_) {
        // The node may already be stopped.
      }
    }

    state.audioNodes.clear();

    if (state.audioContext) {
      state.audioContext.close().catch(() => {});
      state.audioContext = null;
    }

    state.playing = false;

    if (DOM.playButton) DOM.playButton.disabled = false;
    if (DOM.stopButton) DOM.stopButton.disabled = true;

    document.querySelectorAll("[data-track-state]").forEach(element => {
      element.classList.remove("playing");
      element.textContent = "idle";
    });

    setStatus("Ready", state.dirty);
    log("Stopped", "info");
  }

  // ============================================================
  // Plugins
  // ============================================================

  function loadPluginFile(file) {
    const reader = new FileReader();

    reader.onload = () => {
      const name = file.name.replace(/\.js$/i, "");

      if (!/^[A-Za-z0-9_]+$/.test(name)) {
        reportError(new SWSError(
          1,
          "ValueError",
          `invalid plugin name: ${name}`
        ));
        return;
      }

      state.plugins.set(name, String(reader.result || ""));

      if (DOM.pluginList) {
        const item = document.createElement("div");
        item.textContent = `${name} loaded`;
        DOM.pluginList.appendChild(item);
      }

      log(`Plugin loaded: ${name}`, "success");
    };

    reader.onerror = () => {
      reportError(new SWSError(
        1,
        "FileError",
        "failed to read plugin"
      ));
    };

    reader.readAsText(file);
  }

  function runPlugins(project) {
    for (const request of project.plugins) {
      const source = state.plugins.get(request.name);
      if (source === undefined) {
        throw new SWSError(
          request.line,
          "FileNotFoundError",
          `plugin '${request.name}' has not been loaded`
        );
      }

      try {
        const plugin = new Function(
          "SWS",
          `"use strict";\n${source}`
        );

        plugin(clone(project.toPluginData()));
        log(`Plugin executed: ${request.name}`, "success");
      } catch (error) {
        throw new SWSError(
          request.line,
          "RuntimeError",
          `plugin '${request.name}' failed: ${error.message || error}`
        );
      }
    }
  }

  // ============================================================
  // Events and initialization
  // ============================================================

  function bindEditorEvents() {
    if (!DOM.codeEditor) return;

    DOM.codeEditor.addEventListener("input", () => {
      saveCurrentTrackEditorState();
      state.source = composeProjectSource(state.project);
      state.dirty = true;
      setStatus("Modified", true);
      refreshEditor();
    });

    DOM.codeEditor.addEventListener("keydown", event => {
      if (event.key !== "Tab") return;

      event.preventDefault();

      const start = DOM.codeEditor.selectionStart;
      const end = DOM.codeEditor.selectionEnd;
      const value = DOM.codeEditor.value;

      DOM.codeEditor.value =
        value.slice(0, start) +
        "  " +
        value.slice(end);

      DOM.codeEditor.selectionStart = start + 2;
      DOM.codeEditor.selectionEnd = start + 2;

      saveCurrentTrackEditorState();
      state.source = composeProjectSource(state.project);
      state.dirty = true;
      setStatus("Modified", true);
      refreshEditor();
    });

    DOM.editorScroll?.addEventListener(
      "scroll",
      syncEditorScroll
    );
  }

  function bindToolbarEvents() {
    DOM.addTrackButton?.addEventListener("click", beginAddTrack);
    DOM.addNoteButton?.addEventListener("click", addNoteToSelectedTrack);
    DOM.renameTrackButton?.addEventListener(
      "click",
      beginRenameTrack
    );
    DOM.deleteTrackButton?.addEventListener(
      "click",
      beginDeleteTrack
    );
    DOM.trackModalCancel?.addEventListener("click", closeTrackModal);
    DOM.trackModalOk?.addEventListener("click", submitTrackModal);
    DOM.trackNameInput?.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        submitTrackModal();
      }
    });
    DOM.trackModal?.addEventListener("click", event => {
      if (event.target === DOM.trackModal) closeTrackModal();
    });
    DOM.trackModal?.addEventListener("keydown", event => {
      if (event.key === "Escape") closeTrackModal();
    });

    DOM.openButton?.addEventListener("click", () => {
      DOM.fileInput?.click();
    });

    DOM.fileInput?.addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (file) openFile(file);
      event.target.value = "";
    });

    DOM.saveButton?.addEventListener("click", () => saveSs());
    DOM.compileButton?.addEventListener("click", compileCurrent);

    DOM.playButton?.addEventListener("click", () => {
      playProject(getCurrentProject());
    });

    DOM.stopButton?.addEventListener("click", stopPlayback);

    DOM.midiButton?.addEventListener("click", () => {
      exportMidi(getCurrentProject());
    });

    DOM.wavButton?.addEventListener("click", () => {
      exportWav(getCurrentProject());
    });

    DOM.ustButton?.addEventListener("click", () => {
      exportUst(getCurrentProject());
    });

    DOM.exportMidiButton?.addEventListener("click", () => {
      exportMidi(getCurrentProject());
    });

    DOM.exportWavButton?.addEventListener("click", () => {
      exportWav(getCurrentProject());
    });

    DOM.exportUstButton?.addEventListener("click", () => {
      exportUst(getCurrentProject());
    });

    DOM.exportSsButton?.addEventListener("click", () => saveSs());

    DOM.clearConsoleButton?.addEventListener("click", () => {
      state.consoleEntries = [];
      renderConsole();
      clearError();
    });

    DOM.themeToggle?.addEventListener("click", event => {
      document.body.classList.toggle("light");
      event.currentTarget.textContent =
        document.body.classList.contains("light")
          ? "☾ Dark"
          : "☀ Light";
    });

    DOM.pluginButton?.addEventListener("click", () => {
      DOM.pluginModal?.classList.add("active");
    });

    DOM.pluginModalClose?.addEventListener("click", () => {
      DOM.pluginModal?.classList.remove("active");
    });

    DOM.loadPluginButton?.addEventListener("click", () => {
      DOM.pluginFileInput?.click();
    });

    DOM.pluginFileInput?.addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (file) loadPluginFile(file);
      event.target.value = "";
    });
  }

  function initializeEditor() {
    if (!DOM.codeEditor) return;

    if (!DOM.codeEditor.value.trim()) {
      DOM.codeEditor.value = [
        'tempoconst="120";',
        'key="C";',
        "",
        'snd("piano",4,C4);',
        'snd("piano",4,E4);',
        'snd("piano",4,G4);'
      ].join("\n");
    }

    refreshEditor();
  }

  function initialize() {
    initDom();
    initializeEditor();
    bindEditorEvents();
    bindToolbarEvents();

    state.project = null;
    const project = compileSource(
      DOM.codeEditor?.value || "",
      true
    );

    if (project) {
      state.selectedTrack = project.tracks[0]?.name || "default";
      renderTracks(project);
      loadTrackIntoEditor(state.selectedTrack);
      log("SWS Web Console ready", "info");
    }
  }

  globalThis.SWSJS = {
    SWSError,
    NoteData,
    SoundEvent,
    Track,
    TempoMap,
    Project,
    Compiler,
    scanStructure,
    compileCurrent,
    exportMidi,
    exportWav,
    exportUst,
    saveSs,
    playProject,
    stopPlayback,
    ustToSs,
    state
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialize, {
      once: true
    });
  } else {
    initialize();
  }
})();
</script>

</body>
