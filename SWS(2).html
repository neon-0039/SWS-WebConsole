<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イオン結合パズルシミュレーター</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      user-select: none;
    }
    /* イオンブロックの凹凸デザイン */
    .ion-block {
      position: absolute;
      overflow: visible;
      touch-action: none;
      /* Position is driven directly by pointer coordinates; transitions make ports lag behind it. */
      transition: filter 0.15s ease, box-shadow 0.15s ease;
    }

    .metal-block {
      position: absolute;
      z-index: 4;
      width: 76px;
      height: 48px;
      touch-action: none;
      user-select: none;
      cursor: grab;
      transition: filter 0.15s ease, box-shadow 0.15s ease;
    }

    .metal-block.is-dragging {
      z-index: 20 !important;
      cursor: grabbing;
      filter: brightness(1.15);
    }

    .ion-list-card {
      cursor: grab;
    }

    .ion-list-card:active {
      cursor: grabbing;
    }

    #ion-search-controls:not(.hidden) {
      flex: 0 0 auto;
    }

    #ion-search-input {
      min-height: 44px;
      font-size: 16px;
    }

    .ion-search-empty {
      padding: .75rem .25rem;
      color: #94a3b8;
      font-size: .8rem;
      text-align: center;
    }

    .palette-drag-handle {
      display: inline-flex;
      flex: 0 0 36px;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      color: #94a3b8;
      cursor: grab;
      touch-action: none;
    }

    #ion-list {
      flex: 1 1 auto;
      min-height: 0;
      max-height: min(45vh, 400px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #475569 transparent;
    }

    @media (min-width: 768px) {
      #ion-list {
        max-height: calc(100vh - 260px);
      }

      #view-lab {
        min-width: 0;
      }

      #ion-sidebar {
        flex: 0 0 20rem;
        min-width: 0;
        width: 20rem;
      }

      #view-lab > section {
        min-width: 0;
      }

      #workspace {
        min-width: 0;
      }
    }

    @media (min-width: 1024px) {
      #lab-and-beaker {
        grid-template-columns: minmax(0, 1fr) 260px;
      }
    }

    .ion-shape-mark {
      position: absolute;
      z-index: 2;
      top: 50%;
      width: 14px;
      height: 24px;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .ion-tooth {
      right: -14px;
      background: inherit;
      border: 2px solid currentColor;
      border-left: 0;
      border-radius: 0 7px 7px 0;
      box-shadow: 3px 0 5px rgba(0, 0, 0, 0.22);
    }

    .ion-socket {
      left: -2px;
      background: #020617;
      border-radius: 0 7px 7px 0;
      box-shadow: inset 3px 0 5px rgba(0, 0, 0, 0.7);
    }

    /* パルス光効果 */
    #ion-sidebar.menu-collapsed {
      width: 3.5rem;
      flex: none;
      gap: 0;
    }

    #ion-menu-panel {
      max-height: 1000px;
      overflow: hidden;
      transition: max-height 0.28s ease, opacity 0.2s ease, transform 0.28s ease, padding 0.28s ease;
    }

    #ion-sidebar.menu-collapsed #ion-menu-panel {
      max-height: 0;
      flex: 0 0 0;
      opacity: 0;
      transform: scaleY(0.96);
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      pointer-events: none;
    }

    #workspace {
      display: block;
      overflow: hidden;
      touch-action: none;
    }

    #workspace.dragging-out {
      overflow: visible;
      z-index: 30;
    }

    #workspace.hydrogen-flash {
      animation: hydrogenFlash .55s ease-out;
    }

    .workspace-molecule {
      position: absolute;
      z-index: 6;
      min-width: 84px;
      height: 38px;
      cursor: grab;
      touch-action: none;
    }

    .workspace-molecule.is-dragging { cursor: grabbing; z-index: 30 !important; }

    .workspace-molecule.is-gas {
      animation: gasMoleculeRise .75s ease-in-out infinite alternate;
    }

    @keyframes gasMoleculeRise {
      to { transform: translateY(-5px); }
    }

    #workspace #empty-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #workspace #empty-hint.hidden {
      display: none;
    }

    #palette-toast {
      position: absolute;
      z-index: 25;
      bottom: 10px;
      left: 50%;
      padding: 5px 10px;
      border: 1px solid rgba(103, 232, 249, .35);
      border-radius: 999px;
      background: rgba(15, 23, 42, .92);
      color: #cffafe;
      font-size: 11px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 6px);
      transition: opacity .16s ease, transform .16s ease;
    }

    #palette-toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .ion-block.tap-added,
    .element-block.tap-added {
      animation: paletteTapAdded .5s ease-out;
    }

    @keyframes paletteTapAdded {
      0% { filter: brightness(1.65); }
      100% { filter: brightness(1); }
    }

    .ion-block {
      position: absolute;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    .ion-block.is-dragging {
      z-index: 20 !important;
      cursor: grabbing;
      filter: brightness(1.15);
    }

    .connection-layer {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .alloy-connection-layer {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #beaker-drop.beaker-ready {
      border-color: rgba(34, 211, 238, 0.8);
      background: rgba(8, 145, 178, 0.12);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.16);
    }

    .beaker-vessel {
      position: relative;
      min-height: 132px;
      overflow: hidden;
      border: 3px solid rgba(148, 163, 184, 0.55);
      border-top: 0;
      border-radius: 0 0 28px 28px;
      background: linear-gradient(90deg, rgba(255,255,255,.08), transparent 18%, transparent 82%, rgba(255,255,255,.08));
    }

    .beaker-liquid {
      position: absolute;
      inset: 28% 0 0;
      overflow: hidden;
      border-radius: 0 0 22px 22px;
      background: linear-gradient(180deg, rgba(56,189,248,.18), rgba(14,165,233,.34));
      transition: background .25s ease;
    }

    .beaker-liquid.is-aqua-regia {
      background: linear-gradient(180deg, rgba(253, 224, 71, .42), rgba(234, 88, 12, .52));
    }

    .beaker-vessel.is-alkali-reacting {
      animation: beakerHeatPulse .38s ease-in-out infinite alternate;
    }

    .beaker-vessel.is-chemical-heating {
      box-shadow: 0 0 15px rgba(251, 191, 36, .35);
    }

    .beaker-vessel.reaction-complete {
      animation: reactionFlash .42s ease-out;
    }

    .beaker-vessel.is-hydrogen-burning {
      animation: hydrogenFlash .55s ease-out;
    }

    @keyframes hydrogenFlash {
      25% { box-shadow: 0 0 28px rgba(125, 211, 252, .95); filter: brightness(1.6); }
      100% { box-shadow: none; filter: brightness(1); }
    }

    @keyframes reactionFlash {
      45% { filter: brightness(1.7); }
      100% { filter: brightness(1); }
    }

    @keyframes beakerHeatPulse {
      from { box-shadow: 0 0 8px rgba(251, 191, 36, .18); }
      to { box-shadow: 0 0 25px var(--reaction-glow, rgba(251, 191, 36, .55)); }
    }

    .beaker-reaction-indicator {
      position: absolute;
      z-index: 3;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .86);
      color: #fff7ed;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      pointer-events: none;
    }

    .beaker-reaction-flame {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 14px;
      width: 23px;
      height: 38px;
      transform: translateX(-50%);
      border-radius: 55% 45% 50% 50%;
      background: radial-gradient(ellipse at 50% 72%, #fff7ad 0 16%, var(--reaction-color) 38%, transparent 74%);
      filter: drop-shadow(0 0 8px var(--reaction-color));
      animation: alkaliFlame .2s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .beaker-vessel.is-violent-reaction .beaker-reaction-flame {
      width: 32px;
      height: 52px;
      filter: drop-shadow(0 0 14px var(--reaction-color));
    }

    @keyframes alkaliFlame {
      from { margin-left: -2px; scale: .94 .96; }
      to { margin-left: 2px; scale: 1.08 1.04; }
    }

    .beaker-reaction-bubble {
      position: absolute;
      z-index: 2;
      bottom: 2px;
      width: 6px;
      height: 6px;
      border: 1px solid rgba(224, 242, 254, .8);
      border-radius: 50%;
      background: rgba(186, 230, 253, .35);
      animation: beakerBubble 1s ease-out forwards;
      pointer-events: none;
    }

    @keyframes beakerBubble {
      to { transform: translateY(-68px) translateX(var(--bubble-drift)); opacity: 0; }
    }

    .beaker-precipitate-bed {
      position: absolute;
      bottom: 6px;
      left: 12%;
      width: 76%;
      min-height: 7px;
      border-radius: 50%;
      filter: blur(1px);
      opacity: .95;
    }

    .dissolution-particle {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      animation: dissolutionDrift 1.2s ease-out forwards;
      pointer-events: none;
    }

    @keyframes dissolutionDrift {
      0% { transform: translateY(-26px) scale(1.25); opacity: 0; }
      18% { opacity: .95; }
      100% { transform: translate(var(--drift-x), 36px) scale(.7); opacity: 0; }
    }

    @media (max-width: 767px) and (orientation: portrait) {
      body {
        justify-content: flex-start;
      }

      main {
        gap: .75rem !important;
        padding: .75rem !important;
      }

      #view-lab {
        gap: .75rem !important;
      }

      #ion-sidebar {
        width: 100%;
      }

      #ion-menu-panel {
        min-height: 0;
      }

      #ion-list {
        max-height: min(32vh, 300px) !important;
      }

      #ion-tabs {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      #ion-tabs button {
        min-width: 0;
        padding-right: .1rem !important;
        padding-left: .1rem !important;
        font-size: .65rem !important;
        line-height: 1.25;
        white-space: normal;
      }

      #ion-sidebar.is-searching #ion-list {
        max-height: min(42dvh, 360px) !important;
      }

      #view-lab > section > .bg-slate-900 {
        min-height: 0 !important;
        padding: 1rem !important;
      }

      #lab-and-beaker {
        min-height: 0 !important;
      }

      #workspace {
        min-height: clamp(220px, 36vh, 340px) !important;
      }

      #ion-sidebar.menu-collapsed {
        width: 100%;
        height: 3.5rem;
        gap: 0;
      }

      #ion-sidebar.menu-collapsed #ion-menu-toggle {
        width: 100%;
      }
    }

    @media (max-width: 900px) and (orientation: landscape) {
      body {
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
      }

      header {
        flex: 0 0 auto;
        padding: .4rem !important;
      }

      header h1 {
        font-size: 1.1rem !important;
      }

      header button {
        padding: .4rem .55rem !important;
        font-size: .7rem !important;
      }

      main {
        flex: 1 1 0 !important;
        min-height: 0;
        gap: .5rem !important;
        overflow: hidden;
        padding: .5rem !important;
      }

      #view-lab {
        display: grid !important;
        flex: 1 1 auto !important;
        grid-template-columns: minmax(132px, 25%) minmax(0, 1fr);
        gap: .5rem !important;
        min-height: 0;
        min-width: 0;
        width: 100%;
      }

      #ion-sidebar {
        width: auto !important;
        min-width: 0;
        min-height: 0;
        height: 100%;
        gap: .35rem !important;
      }

      #ion-menu-toggle {
        flex: 0 0 auto;
        padding: .45rem .55rem !important;
        font-size: .7rem !important;
      }

      #ion-tabs {
        display: grid;
        flex: 0 0 auto;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      #ion-tabs button {
        min-width: 0;
        padding: .35rem .1rem !important;
        font-size: .62rem !important;
        line-height: 1.2;
        white-space: normal;
      }

      #ion-sidebar.is-searching #ion-list {
        max-height: none !important;
      }

      #ion-menu-panel {
        min-height: 0;
        padding: .5rem !important;
      }

      #ion-menu-panel h2 {
        margin-bottom: .35rem !important;
        font-size: .75rem !important;
      }

      #ion-menu-panel > .flex.bg-slate-950 {
        flex: 0 0 auto;
        margin-bottom: .4rem !important;
      }

      #ion-list {
        max-height: none !important;
        min-height: 0;
        gap: .4rem !important;
        padding-right: .2rem;
      }

      .ion-list-card {
        flex: 0 0 auto;
        min-height: 52px;
        padding: .45rem !important;
      }

      .ion-list-color {
        width: 2.25rem !important;
        height: 2.25rem !important;
      }

      #view-lab > section {
        min-width: 0;
        min-height: 0;
      }

      #view-lab > section > .bg-slate-900 {
        min-height: 0 !important;
        gap: .35rem !important;
        padding: .55rem !important;
      }

      #view-lab > section > .bg-slate-900 > .flex.justify-between.items-center {
        flex: 0 0 auto;
        margin-bottom: .35rem !important;
      }

      #lab-and-beaker {
        grid-template-columns: minmax(0, 2fr) minmax(150px, 1fr) !important;
        min-height: 0 !important;
        gap: .45rem !important;
      }

      #workspace {
        min-height: 0 !important;
        padding: .5rem !important;
      }

      #empty-hint {
        font-size: .7rem !important;
      }

      #beaker-drop {
        min-width: 0;
        gap: .35rem !important;
        overflow-y: auto;
        padding: .45rem !important;
      }

      .beaker-vessel {
        flex: 0 0 auto;
        min-height: 90px;
      }

      #beaker-solids {
        min-height: 0;
        flex: 0 0 auto;
      }

      #beaker-result-log {
        max-height: 3.25rem !important;
        padding: .4rem !important;
      }

      #result-panel {
        flex: 0 0 auto;
        min-height: 0;
        gap: .4rem !important;
        margin-top: .35rem !important;
        padding: .45rem !important;
      }

      #result-icon {
        width: 2rem !important;
        height: 2rem !important;
        font-size: 1rem !important;
      }

      #result-formula {
        font-size: 1.1rem !important;
      }

      #result-desc,
      footer {
        display: none !important;
      }
    }

    #view-dex,
    #view-dex > div,
    #dex-grid {
      min-width: 0;
      max-width: 100%;
    }

    .dex-card {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    .dex-card-content {
      flex: 1 1 auto;
      min-width: 0;
    }

    .dex-card-formula,
    .dex-card-name,
    .dex-card-desc {
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .dex-card-desc {
      line-height: 1.6;
    }

    @media (max-width: 767px) {
      #view-dex > div {
        padding: .75rem !important;
      }

      #dex-tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
      }

      #dex-tabs button {
        width: 100%;
        min-width: 0;
        padding-right: .5rem;
        padding-left: .5rem;
        white-space: normal;
      }

      #dex-grid {
        width: 100%;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: .75rem !important;
      }

      .dex-card {
        gap: .65rem !important;
        padding: .75rem !important;
      }
    }

    @media (max-width: 900px) and (orientation: landscape) {
      #view-dex {
        flex: 1 1 auto;
        height: 100%;
        min-height: 0;
        overflow-y: auto;
        padding-bottom: .5rem;
      }

      #dex-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: .75rem !important;
      }

      .dex-card {
        gap: .55rem !important;
        padding: .65rem !important;
      }
    }

    @media (max-width: 480px) and (orientation: landscape) {
      #dex-grid {
        grid-template-columns: minmax(0, 1fr) !important;
      }
    }

    .glow-effect {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
    }

    .success-glow {
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.8);
    }

    #lighter-tool {
      position: fixed;
      z-index: 100;
      display: none;
      width: 56px;
      height: 86px;
      pointer-events: none;
      transform: none;
    }

    #lighter-tool.visible {
      display: block;
    }

    .lighter-body {
      position: absolute;
      right: 5px;
      bottom: 0;
      width: 38px;
      height: 60px;
      border: 2px solid #94a3b8;
      border-radius: 9px 9px 12px 12px;
      background: linear-gradient(135deg, #475569, #0f172a 68%);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.18);
    }

    .lighter-body::before {
      position: absolute;
      top: -9px;
      right: 3px;
      width: 27px;
      height: 10px;
      border: 2px solid #cbd5e1;
      border-bottom: 0;
      border-radius: 5px 5px 0 0;
      background: #334155;
      content: '';
    }

    .lighter-body::after {
      position: absolute;
      right: 8px;
      bottom: 12px;
      left: 8px;
      height: 5px;
      border-radius: 5px;
      background: #38bdf8;
      content: '';
      opacity: 0.8;
    }

    .lighter-flame {
      position: absolute;
      top: -16px;
      right: 15px;
      display: none;
      width: 17px;
      height: 25px;
      border-radius: 65% 35% 55% 45%;
      background: radial-gradient(
        ellipse at 55% 70%,
        #fff7ae 0 18%,
        color-mix(in srgb, var(--flame-color, #f97316) 72%, white) 40%,
        var(--flame-color, #f97316) 72%,
        color-mix(in srgb, var(--flame-color, #f97316) 70%, #7c2d12) 100%
      );
      filter: drop-shadow(0 0 7px var(--flame-color, rgba(251, 146, 60, 0.72)));
      transform-origin: 50% 100%;
      transition: background 200ms ease, filter 200ms ease;
    }

    .lighter-flame-label {
      position: absolute;
      top: -39px;
      right: -5px;
      display: none;
      padding: 2px 6px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      color: white;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    #lighter-tool.has-flame-test .lighter-flame-label {
      display: block;
    }

    #lighter-tool.lit .lighter-flame {
      display: block;
      animation: lighterFlame 0.32s ease-in-out infinite;
    }

    @keyframes lighterFlame {
      0%, 100% { transform: scale(1) rotate(-2deg); }
      50% { transform: scale(1.08) rotate(2deg); }
    }

    .ion-block.is-heating {
      animation: ionHeating 0.7s ease-in-out infinite alternate;
    }

    .ion-block.is-heating-copper-hydroxide {
      animation: copperHydroxideDarkening 1.5s ease-in forwards;
    }

    @keyframes copperHydroxideDarkening {
      from { filter: brightness(1) saturate(1); }
      to { filter: brightness(.42) saturate(.6); }
    }

    @keyframes ionHeating {
      from { filter: brightness(1) drop-shadow(0 0 2px rgba(251, 146, 60, 0.25)); }
      to { filter: brightness(1.12) drop-shadow(0 0 9px rgba(251, 146, 60, 0.7)); }
    }

    /* ドロップエリアの破線アニメーション */
    @keyframes dash {
      to {
        stroke-dashoffset: -20;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- ヘッダー -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-xl shadow-lg">
          <i class="fa-solid fa-flask-vial"></i>
        </div>
        <h1 class="text-xl md:text-2xl font-extrabold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">
          イオンパズル Lab
        </h1>
      </div>
      <div class="flex gap-2">
        <button id="tab-lab" onclick="switchTab('lab')" class="px-4 py-2 rounded-xl text-sm font-bold bg-cyan-500 text-slate-950 transition hover:bg-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-atom"></i> 実験室
        </button>

      'F-', 'Cl-', 'OH-', 'O2-', 'S2-', 'H-', 'SO4-2', 'NO3-1', 'PO4-3', 'AsO4-3', 'CrO4-2', 
      'Cr2O7-2', 'CO3-2', 'HCO3-1', 'BO3-3', 'SiO4-4', 'IO3-1', 'MnO4-1', 'CN-1', 'CNO-1', 'UO22+', 'I-', 'Br-'
    ];
    const SUBSCRIPT_DIGITS = { 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉' };

    function greatestCommonDivisor(first, second) {
      return second === 0 ? first : greatestCommonDivisor(second, first % second);
    }

    function normalizeComposition(cations, anions) {
      const allCounts = [...Object.values(cations), ...Object.values(anions)];
      const divisor = allCounts.reduce((current, count) => greatestCommonDivisor(current, count), 0) || 1;

      return AUTO_ION_ORDER
        .filter((ionId) => (cations[ionId] || anions[ionId] || 0) > 0)
        .map((ionId) => `${ionId}:${Math.floor((cations[ionId] || anions[ionId]) / divisor)}`)
        .join('|');
    }

    function getCompoundCompositionKey(compound) {
      return normalizeComposition(compound.cations, compound.anions);
    }

    function makeAutoCompound(cations, anions, compositionKey) {
      const cationIds = AUTO_ION_ORDER.filter((ionId) => cations[ionId]);
      const anionIds = AUTO_ION_ORDER.filter((ionId) => anions[ionId]);
      const formulaPart = (ionId, count) => {
        const ion = IONS[ionId];
        const rawFormula = ion.formula || ionId.replace(/(?:\d+[+-]|[+-])$/, '');
        const symbol = rawFormula.replace(/[0-9]/g, (digit) => SUBSCRIPT_DIGITS[digit]);
        const unit = ion.polyatomic && count > 1 ? `(${symbol})` : symbol;
        return `${unit}${count > 1 ? String(count).replace(/[0-9]/g, (digit) => SUBSCRIPT_DIGITS[digit]) : ''}`;
      };
      const formula = [
        ...cationIds.map((ionId) => formulaPart(ionId, cations[ionId])),
        ...anionIds.map((ionId) => formulaPart(ionId, anions[ionId])),
      ].join('');
      const cationNames = cationIds.map((ionId) => IONS[ionId].name.replace(/イオン$/, ''));
      const anionPrefixes = {
        'F-': 'フッ化',
        'Cl-': '塩化',
        'OH-': '水酸化',
        'O2-': '酸化',
        'S2-': '硫化',
        'H-': '水素化',
        'SO4-2': '硫酸',
        'NO3-1': '硝酸',
        'PO4-3': 'リン酸',
        'AsO4-3': 'ヒ素酸',
        'CrO4-2': 'クロム酸',
        'Cr2O7-2': '二クロム酸',
        'CO3-2': '炭酸',
        'HCO3-1': '炭酸水素',
        'BO3-3': 'ホウ酸',
        'MnO4-1': '過マンガン酸',
        'I-': 'ヨウ化',
        'Br-': '臭化'
      };
      const cationName = cationNames.join('・');
      const name = anionIds.length === 1
        ? `${anionPrefixes[anionIds[0]]}${cationName}`
        : `${cationName}（${anionIds.map((ionId) => anionPrefixes[ionId]).join('・')}混合陰イオン化合物）`;
      return {
        key: `AUTO_${compositionKey}`,
        formula,
        name,
        cations,
        anions,
        flameTest: getCombinedFlameTest(cationIds.concat(anionIds)),
        generated: true,
        compositionKey,
      };
    }

    const COMPOUND_BY_COMPOSITION = new Map();

      [H2CO3_CANONICAL_COMPOSITION_KEY, H2CO3_CANONICAL_COMPOUND],

    function parseCompositionKey(compositionKey) {
      const cations = {};
      const anions = {};
      if (typeof compositionKey !== 'string' || !compositionKey) return null;

      for (const part of compositionKey.split('|')) {
        const separator = part.lastIndexOf(':');
        if (separator <= 0) return null;
        const ionId = part.slice(0, separator);
        const count = Number(part.slice(separator + 1));
        const ion = IONS[ionId];
        if (!ion || !Number.isInteger(count) || count < 1) return null;
        (ion.type === 'cation' ? cations : anions)[ionId] = count;
      }

      const normalized = normalizeComposition(cations, anions);
      const totalCharge = Object.entries(cations).reduce(
        (total, [ionId, count]) => total + IONS[ionId].charge * count,
        0,
      ) + Object.entries(anions).reduce(
        (total, [ionId, count]) => total + IONS[ionId].charge * count,
        0,
      );
      if (normalized !== compositionKey || !Object.keys(cations).length ||
          !Object.keys(anions).length || totalCharge !== 0) return null;

      return { cations, anions };
    }

        .reduce((total, [ionId, count]) => total + (IONS[ionId]?.charge || 0) * count, 0);
      if (totalCount < 2 || totalCharge !== 0) return null;

      const compositionKey = normalizeComposition(cations, anions);
      const manualCompound = COMPOUND_BY_COMPOSITION.get(compositionKey);
      if (manualCompound) return manualCompound;

      const parsed = parseCompositionKey(compositionKey);
      if (!parsed) return null;
      const alias = SPECIAL_COMPOSITION_ALIASES.get(compositionKey);
      if (alias) {
        return {
          ...alias,
          cations: parsed.cations,
          anions: parsed.anions,
          compositionKey,
        };
      }
      return makeAutoCompound(parsed.cations, parsed.anions, compositionKey);
    }

      if (!compositionKey) return null;
      const parsed = parseCompositionKey(compositionKey);
      if (!parsed || COMPOUND_BY_COMPOSITION.has(compositionKey)) return null;
      const alias = SPECIAL_COMPOSITION_ALIASES.get(compositionKey);
      if (alias) {

        return {

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;
      oscillator.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'add') {
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(440, now);
        oscillator.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        oscillator.start(now);
        oscillator.stop(now + 0.1);
        return;
      }

      if (type === 'remove') {
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(330, now);
        oscillator.frequency.exponentialRampToValueAtTime(220, now + 0.08);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        oscillator.start(now);
        oscillator.stop(now + 0.08);
        return;
      }

      if (type === 'success') {
        [523, 659, 784, 1047].forEach((frequency, index) => {
          const note = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          const startAt = now + index * 0.08;

          note.type = 'triangle';
          note.frequency.value = frequency;
          note.connect(noteGain);
          noteGain.connect(audioCtx.destination);
          noteGain.gain.setValueAtTime(0.1, startAt);
          noteGain.gain.exponentialRampToValueAtTime(0.001, startAt + 0.3);
          note.start(startAt);
          note.stop(startAt + 0.3);
        });
      }
    }

        'px-4 py-2 rounded-xl text-sm font-bold bg-cyan-500 text-slate-950 transition hover:bg-cyan-400 flex items-center gap-2';
      const inactiveClass =
        'px-4 py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-300 transition hover:bg-slate-700 flex items-center gap-2';

      labButton.className = tab === 'lab' ? activeClass : inactiveClass;
      dexButton.className = tab === 'dex' ? activeClass : inactiveClass;

      if (tab === 'dex') renderDex();
    }

    function toggleLighterMode() {
      setLighterMode(!lighterModeSelected);
    }

    function setLighterMode(enabled) {
      lighterModeSelected = enabled;
      const tool = document.getElementById('lighter-tool');
      const button = document.getElementById('lighter-toggle');

      tool.classList.toggle('visible', enabled);
      button.setAttribute('aria-pressed', String(enabled));
      button.classList.toggle('bg-amber-500/30', enabled);
      button.classList.toggle('ring-2', enabled);
      button.classList.toggle('ring-amber-300/60', enabled);

      if (!enabled) {
        stopLighting();
        tool.style.left = '-100px';
        tool.style.top = '-100px';
      }
    }

    function moveLighter(event) {
      lighterPointer = { x: event.clientX, y: event.clientY };
      const tool = document.getElementById('lighter-tool');
      tool.style.left = `${event.clientX - 32}px`;
      tool.style.top = `${event.clientY - 6}px`;
    }

    function startLighting(event) {
      lighterIsLit = true;
      lighterPointerId = event.pointerId;
      previousHeatingFrameTime = 0;
      document.getElementById('lighter-tool').classList.add('lit');

      if (event.target?.setPointerCapture && event.pointerId !== undefined) {
        try {
          event.target.setPointerCapture(event.pointerId);
        } catch {
          // Pointer capture can fail for elements that are no longer active.
        }
      }

      if (heatingFrame === null) heatingFrame = requestAnimationFrame(updateHeating);
    }

    function stopLighting() {
      lighterIsLit = false;
      lighterPointerId = null;
      previousHeatingFrameTime = 0;
      heatingProgress.clear();
      beakerState.heatingProgress = {};
      beakerState.heatingReactantKey = null;
      renderAlkaliReactionState();

      if (heatingFrame !== null) cancelAnimationFrame(heatingFrame);
      heatingFrame = null;
      document.getElementById('lighter-tool')?.classList.remove('lit');
      setLighterFlameTest(null);
      document.querySelectorAll('#workspace .ion-block.is-heating').forEach((block) => {
        block.classList.remove('is-heating');
        block.classList.remove('is-heating-copper-hydroxide');
      });
    }

    function setLighterFlameTest(flameTest) {
      const tool = document.getElementById('lighter-tool');
      const label = tool.querySelector('.lighter-flame-label');
      const active = flameTest?.enabled === true;

      tool.classList.toggle('has-flame-test', active);
      if (active) {
        tool.querySelector('.lighter-flame').style.setProperty('--flame-color', flameTest.color);
        label.textContent = flameTest.label;
      } else {
        tool.querySelector('.lighter-flame').style.removeProperty('--flame-color');
        label.textContent = '';
      }
    }

    function getCompoundGroupKey(group) {
      return group.ions
        .map((ion) => String(ion.instanceId))
        .sort()
        .join('|');
    }

    function isFlameTouchingGroup(flameRect, group) {
      return group.ions.some((ion) => {
        const block = document.querySelector(
          `.ion-block[data-instance-id="${ion.instanceId}"]`,
        );
        if (!block) return false;

        const rect = block.getBoundingClientRect();
        return (
          flameRect.left <= rect.right &&
          flameRect.right >= rect.left &&
          flameRect.top <= rect.bottom &&
          flameRect.bottom >= rect.top
        );
      });
    }

    function isFlameTouchingWorkspaceMolecule(flameRect, molecule) {
      const block = document.querySelector(`.workspace-molecule[data-instance-id="${molecule.instanceId}"]`);
      if (!block) return false;
      const rect = block.getBoundingClientRect();
      return flameRect.left <= rect.right && flameRect.right >= rect.left &&
        flameRect.top <= rect.bottom && flameRect.bottom >= rect.top;
    }

    function addWorkspaceMolecule(key, x, y, amount = 1) {
      const registered = COMPOUNDS.find((compound) => compound.key === key);
      const molecule = REACTION_ONLY_COMPOUNDS[key] || registered;
      if (!molecule) return null;
      const bounds = getWorkspaceBounds();
      const item = {
        instanceId: `molecule-${Date.now()}-${Math.random()}`,
        key: molecule.key,
        formula: molecule.formula,
        name: molecule.name,
        color: molecule.color || '#cbd5e1',
        charge: 0,
        type: 'molecule',
        specialType: molecule.specialType,
        reactionOnly: Boolean(molecule.reactionOnly),
        amount,
        x: Math.max(4, Math.min(bounds.width - 100, x)),
        y: Math.max(28, Math.min(bounds.height - 52, y)),
      };
      workspaceMolecules.push(item);
      return item;
    }

    function burnWorkspaceHydrogenGroup(group) {
      const ids = new Set(group.ions.map((ion) => ion.instanceId));
      const center = group.ions.reduce((point, ion) => ({ x: point.x + ion.x, y: point.y + ion.y }), { x: 0, y: 0 });
      const x = center.x / group.ions.length;
      const y = center.y / group.ions.length;
      workspaceIons = workspaceIons.filter((ion) => !ids.has(ion.instanceId));
      connections = connections.filter((connection) => !ids.has(connection.from) || !ids.has(connection.to));
      const groupKey = getCompoundGroupKey(group);
      completedGroupKeys.delete(groupKey);
      heatedGroupResults.delete(groupKey);
      heatingProgress.delete(groupKey);
      addWorkspaceMolecule('H1OH1', x, y);
      playSound('success');
      confetti({ particleCount: 24, spread: 38, origin: { y: 0.75 } });
    }

    function burnWorkspaceHydrogenMolecule(instanceId) {
      const molecule = workspaceMolecules.find((item) => item.instanceId === instanceId);
      if (!molecule) return;
      workspaceMolecules = workspaceMolecules.filter((item) => item.instanceId !== instanceId);
      addWorkspaceMolecule('H1OH1', molecule.x, molecule.y, molecule.amount || 1);
      const workspace = document.getElementById('workspace');
      workspace.classList.add('hydrogen-flash');
      window.setTimeout(() => workspace.classList.remove('hydrogen-flash'), 560);
      playSound('success');
      confetti({ particleCount: 24, spread: 38, origin: { y: 0.75 } });
    }

    function getHeatingProduct(key) {
      return REACTION_ONLY_COMPOUNDS[key] || COMPOUNDS.find((compound) => compound.key === key) || null;
    }

    function isHeatingReactionAvailable(reactantKey) {
      const reaction = HEATING_REACTIONS[reactantKey];
      return Boolean(reaction && COMPOUNDS.some((compound) => compound.key === reactantKey) &&
        Object.keys(reaction.products).every((key) => getHeatingProduct(key)));
    }

    function getHeatingEquation(reaction) {
      const side = (terms) => Object.entries(terms).map(([key, count]) => {
        const product = getHeatingProduct(key);
        return `${count > 1 ? `${count} ` : ''}${product?.formula || key}`;
      }).join(' + ');
      return `${side(reaction.reactants)} → ${side(reaction.products)}`;
    }

    function getWorkspaceHeatingBatchCount(groups, reaction) {
      const amounts = {};
      groups.forEach((group) => {
        const compound = findCompoundForGroup(group);
        if (compound) amounts[compound.key] = (amounts[compound.key] || 0) + 1;
      });
      return Math.floor(Math.min(...Object.entries(reaction.reactants).map(([key, count]) => (amounts[key] || 0) / count)));
    }

    function getBeakerHeatingBatchCount(reaction) {
      return Math.floor(Math.min(...Object.entries(reaction.reactants).map(([key, count]) => {
        const amount = [...beakerState.dissolvedCompounds, ...beakerState.undissolvedSolids]
          .filter((item) => item.key === key)
          .reduce((sum, item) => sum + item.amount, 0);
        return amount / count;
      })));
    }

    function executeWorkspaceHeatingReaction(reactantKey, groups, reaction, batches = 1) {
      const selectedGroups = [];
      Object.entries(reaction.reactants).forEach(([key, count]) => {
        selectedGroups.push(...groups.filter((group) => findCompoundForGroup(group)?.key === key).slice(0, count * batches));
      });
      const requiredCount = Object.values(reaction.reactants).reduce((sum, count) => sum + count * batches, 0);
      if (selectedGroups.length !== requiredCount) return false;
      const ions = selectedGroups.flatMap((group) => group.ions);
      const centerX = ions.reduce((sum, ion) => sum + ion.x, 0) / ions.length;
      const centerY = ions.reduce((sum, ion) => sum + ion.y, 0) / ions.length;
      const consumedIds = new Set(ions.map((ion) => ion.instanceId));
      selectedGroups.forEach((group) => {
        const groupKey = getCompoundGroupKey(group);
        completedGroupKeys.delete(groupKey);
        heatedGroupResults.delete(groupKey);
        heatingProgress.delete(groupKey);
      });
      workspaceIons = workspaceIons.filter((ion) => !consumedIds.has(ion.instanceId));
      connections = connections.filter((connection) => !consumedIds.has(connection.from) || !consumedIds.has(connection.to));
      const products = Object.entries(reaction.products);
      products.forEach(([key, amount], index) => {
        addWorkspaceMolecule(key, centerX + (index - (products.length - 1) / 2) * 124, centerY, amount * batches);
      });
      playSound('success');
      confetti({ particleCount: 36, spread: 48, origin: { y: 0.75 } });
      return true;
    }

    function consumeBeakerHeatingReactant(key, amount) {
      let remaining = amount;
      let dissolvedConsumed = 0;
      for (const item of beakerState.dissolvedCompounds.filter((entry) => entry.key === key)) {
        const consumed = Math.min(item.amount, remaining);
        item.amount -= consumed;
        remaining -= consumed;
        dissolvedConsumed += consumed;
        if (remaining <= 1e-9) break;
      }
      beakerState.dissolvedCompounds = beakerState.dissolvedCompounds.filter((item) => item.amount > 1e-9);
      for (const item of beakerState.undissolvedSolids.filter((entry) => entry.key === key)) {
        if (remaining <= 1e-9) break;
        const consumed = Math.min(item.amount, remaining);
        item.amount -= consumed;
        remaining -= consumed;
      }
      beakerState.undissolvedSolids = beakerState.undissolvedSolids.filter((item) => item.amount > 1e-9);
      const reactant = COMPOUNDS.find((compound) => compound.key === key);
      if (reactant && dissolvedConsumed > 0) {
        [...Object.entries(reactant.cations || {}), ...Object.entries(reactant.anions || {})].forEach(([ionId, count]) => {
          beakerState.solutionIons[ionId] = Math.max(0, (beakerState.solutionIons[ionId] || 0) - count * dissolvedConsumed);
        });
      }
      return amount - remaining;
    }

    function addBeakerHeatingProduct(key, amount) {
      const product = getHeatingProduct(key);
      if (!product || amount <= 0) return;
      if (beakerState.waterMl > 0 && (key === 'MgO' || key === 'CaO')) {
        const hydroxideKey = key === 'MgO' ? 'MgOH2' : 'CaOH2';
        addBeakerHeatingProduct(hydroxideKey, amount);
        appendBeakerLog(`${product.formula} + H₂O → ${getHeatingProduct(hydroxideKey)?.formula || hydroxideKey}：水溶液がアルカリ性側に変化しました。`);
        return;
      }
      if (REACTION_ONLY_COMPOUNDS[key]) {
        beakerState.gases[key] = (beakerState.gases[key] || 0) + amount;
        if (beakerState.waterMl > 0) applyReactionGasToWater(key, amount);
        for (let index = 0; index < Math.min(10, Math.ceil(amount * 6)); index += 1) createBeakerReactionBubbles();
        return;
      }
      if (key === 'H1OH1' || key === 'H2O1') {
        beakerState.molecules[product.key] = (beakerState.molecules[product.key] || 0) + amount;
        beakerState.waterMl += amount * BEAKER_WATER_PER_METAL_UNIT_ML;
        return;
      }
      const solubility = getCompoundSolubility(product);
      const fraction = solubility === 'insoluble' ? 0 : solubility === 'slightlySoluble' ? 0.1 : 1;
      const dissolved = amount * fraction;
      if (dissolved > 0) {
        [...Object.entries(product.cations || {}), ...Object.entries(product.anions || {})].forEach(([ionId, count]) => {
          beakerState.solutionIons[ionId] = (beakerState.solutionIons[ionId] || 0) + count * dissolved;
        });
        const item = beakerState.dissolvedCompounds.find((entry) => entry.key === key);
        if (item) item.amount += dissolved;
        else beakerState.dissolvedCompounds.push({ key, formula: product.formula, amount: dissolved });
        animateDissolution(product.color);
      }
      if (amount > dissolved) beakerState.undissolvedSolids.push({
        key, formula: product.formula, name: product.name, color: product.color, amount: amount - dissolved,
      });
      applyAqueousCompoundEffect(key, amount);
    }

    function applyAqueousCompoundEffect(key, amount = 1) {
      if (beakerState.waterMl <= 0 || amount <= 0) return;
      if (key === 'Na2CO3') {
        // Carbonate hydrolysis is simplified as a small OH⁻ contribution.
        beakerState.solutionIons['OH-'] = (beakerState.solutionIons['OH-'] || 0) + amount * 0.04;
        appendBeakerLog('Na₂CO₃ が水に溶け、水溶液がアルカリ性になりました。');
      } else if (key === 'MgOH2' || key === 'CaOH2') {
        // Keep the simplified pH model visibly on the basic side even when
        // the solubility model leaves most of the hydroxide undissolved.
        beakerState.solutionIons['OH-'] = (beakerState.solutionIons['OH-'] || 0) + amount * 0.01;
        appendBeakerLog(`${getHeatingProduct(key)?.formula || key} により水溶液がアルカリ性側に変化しました。`);
      }
    }

    function addTransferredCompoundToBeaker(compound, amount = 1) {
      if (beakerState.waterMl > 0 && (compound.key === 'MgO' || compound.key === 'CaO')) {
        const hydroxideKey = compound.key === 'MgO' ? 'MgOH2' : 'CaOH2';
        const hydroxide = COMPOUNDS.find((item) => item.key === hydroxideKey);
        if (hydroxide) {
          for (let index = 0; index < amount; index += 1) addBeakerHeatingProduct(hydroxideKey, 1);
          appendBeakerLog(`${compound.formula} + H₂O → ${hydroxide.formula}：水溶液がアルカリ性側に変化しました。`);
          return;
        }
      }
      for (let index = 0; index < amount; index += 1) {
        addCompoundToBeaker(compound);
        applyAqueousCompoundEffect(compound.key, 1);
      }
    }

    function executeBeakerHeatingReaction(reaction, batches) {
      Object.entries(reaction.reactants).forEach(([key, count]) => consumeBeakerHeatingReactant(key, count * batches));
      Object.entries(reaction.products).forEach(([key, count]) => addBeakerHeatingProduct(key, count * batches));
      appendBeakerLog(`${getHeatingEquation(reaction)}（加熱分解）`);
      processBeakerReactions();
      playSound('success');
      confetti({ particleCount: 34, spread: 46, origin: { y: 0.8 } });
    }

    function heatBeakerThermalReactions(flameRect, elapsed) {
      const vesselRect = document.querySelector('.beaker-vessel').getBoundingClientRect();
      const touchesVessel = flameRect.left <= vesselRect.right && flameRect.right >= vesselRect.left &&
        flameRect.top <= vesselRect.bottom && flameRect.bottom >= vesselRect.top;
      let activeKey = null;
      Object.entries(HEATING_REACTIONS).forEach(([key, reaction]) => {
        if (!isHeatingReactionAvailable(key) || getBeakerHeatingBatchCount(reaction) < 1 || !touchesVessel) {
          beakerState.heatingProgress[key] = 0;
          return;
        }
        activeKey = key;
        beakerState.heatingProgress[key] = (beakerState.heatingProgress[key] || 0) + elapsed;
        if (beakerState.heatingProgress[key] < reaction.heatTime) return;
        executeBeakerHeatingReaction(reaction, getBeakerHeatingBatchCount(reaction));
        beakerState.heatingProgress[key] = 0;
      });
      beakerState.heatingReactantKey = activeKey;
      renderAlkaliReactionState();
    }

    function updateHeating(timestamp) {
      heatingFrame = null;
      if (!lighterModeSelected || !lighterIsLit) return;

      const elapsed = previousHeatingFrameTime
        ? Math.min(timestamp - previousHeatingFrameTime, 50)
        : 0;
      previousHeatingFrameTime = timestamp;
      const flame = document.querySelector('.lighter-flame');
      const flameRect = flame.getBoundingClientRect();
      igniteBeakerHydrogen(flameRect);
      heatBeakerThermalReactions(flameRect, elapsed);

      const groups = buildCompoundGroups();
      const heatingIonIds = new Set();
      const touchedGroups = new Set();
      const hydrogenGroupsToBurn = [];
      const hydrogenMoleculesToBurn = [];
      let activeFlameTest = null;
      let workspaceChanged = false;

      groups.forEach((group) => {
        const compound = findCompoundForGroup(group);
        if (!compound || !isFlameTouchingGroup(flameRect, group)) return;
        if (compound.specialType === 'hydrogen_molecule') {
          hydrogenGroupsToBurn.push(group);
          return;
        }
        const groupKey = getCompoundGroupKey(group);
        const flameTest = compound.flameTest;
        if (flameTest?.enabled && (!activeFlameTest || flameTest.priority > activeFlameTest.priority)) {
          activeFlameTest = flameTest;
        }
        if (compound.key === 'NaHCO3' || HEATING_REACTIONS[compound.key]) {
          touchedGroups.add(compound.key);
          group.ions.forEach((ion) => heatingIonIds.add(String(ion.instanceId)));
          return;
        }
        const reaction = compound.heatReaction;
        if (!reaction?.enabled || heatedGroupResults.has(groupKey)) return;
        touchedGroups.add(groupKey);
        group.ions.forEach((ion) => heatingIonIds.add(String(ion.instanceId)));
        const progress = (heatingProgress.get(groupKey) || 0) + elapsed;
        if (progress >= reaction.heatTime) {
          heatingProgress.delete(groupKey);
          heatedGroupResults.set(groupKey, reaction);
          confetti({ particleCount: 35, spread: 45, origin: { y: 0.8 } });
          playSound('success');
          checkReaction();
        } else {
          heatingProgress.set(groupKey, progress);
        }
      });

      workspaceMolecules.forEach((molecule) => {
        if (molecule.specialType === 'hydrogen_molecule' && isFlameTouchingWorkspaceMolecule(flameRect, molecule)) {
          hydrogenMoleculesToBurn.push(molecule.instanceId);
        }
      });
      hydrogenGroupsToBurn.forEach((group) => {
        burnWorkspaceHydrogenGroup(group);
        workspaceChanged = true;
      });
      hydrogenMoleculesToBurn.forEach((id) => {
        burnWorkspaceHydrogenMolecule(id);
        workspaceChanged = true;
      });

      Object.entries(HEATING_REACTIONS).forEach(([reactantKey, reaction]) => {
        if (!isHeatingReactionAvailable(reactantKey)) {
          heatingProgress.delete(`thermal:${reactantKey}`);
          return;
        }
        const batches = getWorkspaceHeatingBatchCount(groups, reaction);
        if (batches < 1 || !touchedGroups.has(reactantKey)) {
          heatingProgress.set(`thermal:${reactantKey}`, 0);
          return;
        }
        const progressKey = `thermal:${reactantKey}`;
        const progress = (heatingProgress.get(progressKey) || 0) + elapsed;
        if (progress < reaction.heatTime) {
          heatingProgress.set(progressKey, progress);
          return;
        }
        if (executeWorkspaceHeatingReaction(reactantKey, groups, reaction, batches)) workspaceChanged = true;
        heatingProgress.delete(progressKey);
      });

      setLighterFlameTest(activeFlameTest);
      for (const groupKey of heatingProgress.keys()) {
        if (groupKey.startsWith('thermal:') && !touchedGroups.has(groupKey.slice('thermal:'.length))) {
          heatingProgress.set(groupKey, 0);
        } else if (!groupKey.startsWith('thermal:') && !touchedGroups.has(groupKey)) {
          heatingProgress.set(groupKey, 0);
        }
      }
      document.querySelectorAll('#workspace .ion-block').forEach((block) => {
        block.classList.toggle('is-heating', heatingIonIds.has(block.dataset.instanceId));
        block.classList.toggle('is-heating-copper-hydroxide',
          heatingIonIds.has(block.dataset.instanceId) && groups.some((group) =>
            findCompoundForGroup(group)?.key === 'CuOH2' && group.ions.some((ion) => String(ion.instanceId) === block.dataset.instanceId),
          ),
        );
      });
      if (workspaceChanged) updateWorkspace();
      heatingFrame = requestAnimationFrame(updateHeating);
    }
    function initializeLighter() {
      window.addEventListener('pointermove', (event) => {
        if (lighterModeSelected) moveLighter(event);
      });

      window.addEventListener('pointerdown', (event) => {
        if (!lighterModeSelected || event.target.closest('#lighter-toggle')) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        if (event.button === 0) startLighting(event);
      }, true);

      window.addEventListener('pointerup', () => stopLighting(), true);
      window.addEventListener('pointercancel', () => stopLighting(), true);
      window.addEventListener('blur', stopLighting);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopLighting();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && lighterModeSelected) setLighterMode(false);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key.toLowerCase() !== 'c' || event.repeat ||
            event.ctrlKey || event.altKey || event.metaKey) return;
        if (event.target instanceof Element &&
            event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
        revealAllDexCompounds();
      });
    }

    function switchIonTab(type) {
      currentIonTab = type;
      const activeClass = 'flex-1 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white';
      const inactiveClass = 'flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition';
      const searchActiveClass = 'flex-1 py-1.5 text-xs font-bold rounded-lg bg-cyan-500 text-slate-950';
      document.getElementById('ion-tab-cation').className =
        type === 'cation' ? activeClass : inactiveClass;
      document.getElementById('ion-tab-anion').className =
        type === 'anion' ? 'flex-1 py-1.5 text-xs font-bold rounded-lg bg-emerald-600 text-white' : inactiveClass;
      document.getElementById('ion-tab-element').className =
        type === 'element' ? 'flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-950' : inactiveClass;
      document.getElementById('ion-tab-search').className =
        type === 'search' ? searchActiveClass : inactiveClass;
      document.getElementById('ion-search-controls').classList.toggle('hidden', type !== 'search');
      document.getElementById('ion-sidebar').classList.toggle('is-searching', type === 'search');

      renderIonList();
      if (type === 'search') {
        document.getElementById('ion-search-input').focus({ preventScroll: true });
      }
    }

    function handleIonSearchInput(event) {
      paletteSearchQuery = event.target.value;
      renderIonList();
    }

    function getIonSearchResults(query) {
      const normalizedQuery = query.trim().toLocaleLowerCase();
      if (!normalizedQuery) return [];

      const matches = (values) => values.some((value) =>
        typeof value === 'string' && value.toLocaleLowerCase().includes(normalizedQuery),
      );
      const ionResults = Object.values(IONS)
        .filter((ion) => matches([ion.id, ion.name, ion.symbol, ion.formula]))
        .map((item) => ({ kind: 'ion', item }));
      const elementResults = Object.values(ELEMENTS)
        .filter((element) => matches([element.id, element.name]))
        .map((item) => ({ kind: 'element', item }));

      return [...ionResults, ...elementResults];
    }

    function attachPaletteCardEvents(card, kind, id) {
      card.draggable = true;
      card.style.touchAction = 'pan-y';
      card.onpointerdown = (event) => beginPalettePointerAction(event, kind, id, card);
      card.ondragstart = (event) => {
        if (palettePointerAction?.pointerType === 'touch') {
          event.preventDefault();
          return;
        }
        if (palettePointerAction?.card === card) palettePointerAction.moved = true;
        event.dataTransfer.setData('text/plain', id);
        event.dataTransfer.setData('application/x-ion-puzzle-kind', kind);
        if (kind === 'element') {
          event.dataTransfer.setData('application/x-ion-puzzle-element', id);
        }
        event.dataTransfer.effectAllowed = 'copy';
        card.classList.add('opacity-50', 'scale-95');
      };
      card.ondragend = () => {
        card.classList.remove('opacity-50', 'scale-95');
        if (palettePointerAction?.card === card) palettePointerAction = null;
      };
    }

    function createElementPaletteCard(element, showType = false) {
      const card = document.createElement('div');
      card.className = 'ion-list-card p-3 rounded-xl bg-slate-950 border border-slate-800 hover:border-amber-400 transition flex items-center justify-between';
      card.innerHTML = `
        <div class="flex min-w-0 items-center gap-3">
          <div class="w-10 h-10 shrink-0 rounded-lg bg-gradient-to-br ${element.color} flex items-center justify-center ${element.textColor} font-black">${element.id}</div>
          <div class="min-w-0 text-sm text-white">${element.name}<div class="text-xs text-slate-500">${showType ? '単体' : '単体元素'}</div></div>
        </div>
        <i class="fa-solid fa-hand-pointer palette-drag-handle" title="ここをドラッグして配置" aria-label="ドラッグして配置"></i>
      `;
      attachPaletteCardEvents(card, 'element', element.id);
      return card;
    }

    function createIonPaletteCard(ion, showType = false) {
      const chargeLabel = ion.charge > 0 ? `+${ion.charge}` : ion.charge;
      const colorClasses = getIonColorClasses(ion);
      const typeLabel = ion.type === 'cation' ? '陽イオン' : '陰イオン';
      const card = document.createElement('div');
      card.className = 'ion-list-card p-3 rounded-xl bg-slate-950 border border-slate-800 hover:border-cyan-500 transition flex items-center justify-between';
      card.innerHTML = `
        <div class="flex min-w-0 items-center gap-3">
          <div class="ion-list-color w-10 h-10 shrink-0 rounded-lg ${colorClasses} flex items-center justify-center ${ion.textColor}">
            ${formatIonFormula(ion.id)}
          </div>
          <div class="min-w-0 text-sm text-white">
            ${ion.name}
            <div class="text-xs text-slate-500">${showType ? `${typeLabel} ・ ` : ''}価数: ${chargeLabel}</div>
          </div>
        </div>
        <i class="fa-solid fa-hand-pointer palette-drag-handle" title="ここをドラッグして配置" aria-label="ドラッグして配置"></i>
      `;
      applyIonColor(card.querySelector('.ion-list-color'), ion);
      attachPaletteCardEvents(card, 'ion', ion.id);
      return card;
    }

    function beginPalettePointerAction(event, kind, id, card) {
      if (event.button !== undefined && event.button !== 0) return;
      if (event.pointerType === 'touch') {
        if (event.target.closest('.palette-drag-handle')) event.preventDefault();
        card.classList.add('opacity-50', 'scale-95');
      }
      palettePointerAction = {
        kind,
        id,
        card,
        pointerId: event.pointerId,
        pointerType: event.pointerType,
        startX: event.clientX,
        startY: event.clientY,
        moved: false,
      };
    }

    function getPaletteTapPosition(kind, id) {
      const bounds = getWorkspaceBounds();
      const isIon = kind === 'ion';
      const width = isIon ? ION_WIDTH : ELEMENT_BLOCK_WIDTH;
      const height = isIon ? getIonFootprintHeight(IONS[id]) : ELEMENT_BLOCK_HEIGHT;
      const [offsetX, offsetY] = PALETTE_TAP_OFFSETS[
        paletteTapPlacementIndex++ % PALETTE_TAP_OFFSETS.length
      ];
      const maxX = Math.max(2, bounds.width - width - 2);
      const maxY = Math.max(0, bounds.height - height);

      return {
        x: Math.max(2, Math.min(maxX, (bounds.width - width) / 2 + offsetX)),
        y: Math.max(0, Math.min(maxY, (bounds.height - height) / 2 + offsetY)),
      };
    }

    function showPaletteAddedFeedback(kind, id, instanceId) {
      const toast = document.getElementById('palette-toast');
      if (!toast) return;
      toast.textContent = `${kind === 'ion' ? formatIonFormula(id) : id} を追加しました`;
      toast.classList.add('is-visible');
      const selector = kind === 'ion' ? '.ion-block' : '.element-block';
      const block = [...document.querySelectorAll(`#workspace ${selector}`)]
        .find((item) => item.dataset.instanceId === String(instanceId));
      block?.classList.add('tap-added');
      window.setTimeout(() => block?.classList.remove('tap-added'), 550);
      window.clearTimeout(paletteToastTimeout);
      paletteToastTimeout = window.setTimeout(() => toast.classList.remove('is-visible'), 900);
    }

    function addPaletteItemFromTap(action) {
      const position = getPaletteTapPosition(action.kind, action.id);
      const instanceId = action.kind === 'ion'
        ? addIonToWorkspace(action.id, position.x, position.y)
        : addElementToWorkspace(action.id, position.x, position.y);
      if (instanceId !== null) showPaletteAddedFeedback(action.kind, action.id, instanceId);
    }

    function renderIonList() {
      const list = document.getElementById('ion-list');
      list.innerHTML = '';

      if (currentIonTab === 'search') {
        const count = document.getElementById('ion-search-count');
        const query = paletteSearchQuery.trim();
        const emptyMessage = document.createElement('p');
        emptyMessage.className = 'ion-search-empty';

        if (!query) {
          count.textContent = '検索結果 0件';
          emptyMessage.textContent = 'イオン・単体の名前や元素記号を入力してください';
          list.appendChild(emptyMessage);
          return;
        }

        const results = getIonSearchResults(query);
        count.textContent = `検索結果 ${results.length}件`;
        if (!results.length) {
          emptyMessage.textContent = '該当するイオン・単体がありません';
          list.appendChild(emptyMessage);
          return;
        }

        results.forEach(({ kind, item }) => {
          list.appendChild(kind === 'ion'
            ? createIonPaletteCard(item, true)
            : createElementPaletteCard(item, true));
        });
        return;
      }

      if (currentIonTab === 'element') {
        Object.values(ELEMENTS).forEach((element) => {
          list.appendChild(createElementPaletteCard(element));
        });
        return;
      }

      Object.values(IONS)
        .filter((ion) => ion.type === currentIonTab)
        .forEach((ion) => {
          list.appendChild(createIonPaletteCard(ion));
        });
    }

    function getIonColorClasses(ion) {
      return ion.color.startsWith('#') ? '' : `bg-gradient-to-br ${ion.color}`;
    }

    function applyIonColor(element, ion) {
      if (ion.color.startsWith('#')) {
        element.style.background = ion.gradientColor
          ? `linear-gradient(to bottom right, ${ion.color}, ${ion.gradientColor})`
          : ion.color;
      }
    }

    function formatIonFormula(id) {
      const ion = typeof id === 'string' ? IONS[id] : id;
      if (ion?.symbol) return ion.symbol;

      const ionId = typeof id === 'string' ? id : ion?.id || '';
      return ionId.replace('2+', '²⁺').replace('2-', '²⁻').replace('+', '⁺').replace('-', '⁻');
    }

    function getWorkspaceBounds() {
      const workspace = document.getElementById('workspace');
      return {
        element: workspace,
        width: workspace.clientWidth,
        height: workspace.clientHeight,
      };
    }

    function clampIon(ion) {
      const { width, height } = getWorkspaceBounds();
      const maxX = Math.max(2, width - ION_WIDTH - 14);
      const maxY = Math.max(0, height - getIonFootprintHeight(ion));

      ion.x = Math.max(2, Math.min(maxX, ion.x));
      ion.y = Math.max(0, Math.min(maxY, ion.y));
    }

    function getNextIonPosition(index, ionId) {
      const { width, height } = getWorkspaceBounds();
      const layoutRowHeight = getIonBlockHeight({ charge: 3 });
      const columns = Math.max(1, Math.floor(Math.max(ION_WIDTH, width - 24) / (ION_WIDTH + 26)));
      const x = 12 + (index % columns) * (ION_WIDTH + 26);
      const y = 12 + Math.floor(index / columns) * (layoutRowHeight + 28);

      return {
        x: Math.min(x, Math.max(0, width - ION_WIDTH)),
        y: Math.min(y, Math.max(0, height - getIonFootprintHeight(IONS[ionId]))),
      };
    }

    function addIonToWorkspace(ionId, x, y) {
      if (workspaceIons.length >= 8 || !IONS[ionId]) return null;

      const position = x === undefined
        ? getNextIonPosition(workspaceIons.length, ionId)
        : { x, y };

      const item = {
        instanceId: Date.now() + Math.random(),
        ...IONS[ionId],
        ...position,
      };
      workspaceIons.push(item);
      playSound('add');
      updateWorkspace();
      return item.instanceId;
    }

    function getElementDropPosition(event, rect) {
      return {
        x: Math.max(2, Math.min(rect.width - ELEMENT_BLOCK_WIDTH - 8, event.clientX - rect.left - ELEMENT_BLOCK_WIDTH / 2)),
        y: Math.max(0, Math.min(rect.height - ELEMENT_BLOCK_HEIGHT, event.clientY - rect.top - ELEMENT_BLOCK_HEIGHT / 2)),
      };
    }

    function getNextElementPosition(index) {
      const { width, height } = getWorkspaceBounds();
      const columns = Math.max(1, Math.floor(Math.max(ELEMENT_BLOCK_WIDTH, width - 24) / (ELEMENT_BLOCK_WIDTH + 20)));
      return {
        x: Math.min(12 + (index % columns) * (ELEMENT_BLOCK_WIDTH + 20), Math.max(0, width - ELEMENT_BLOCK_WIDTH)),
        y: Math.min(12 + Math.floor(index / columns) * (ELEMENT_BLOCK_HEIGHT + 24), Math.max(0, height - ELEMENT_BLOCK_HEIGHT)),
      };
    }

    function addElementToWorkspace(elementId, x, y) {
      if (!ELEMENTS[elementId]) return null;
      const item = {
        instanceId: Date.now() + Math.random(),
        ...ELEMENTS[elementId],
        ...(x === undefined ? getNextElementPosition(workspaceElements.length) : { x, y }),
      };
      workspaceElements.push(item);
      playSound('add');
      updateWorkspace();
      return item.instanceId;
    }

    function getConnectedElementGroup(instanceId) {
      const group = new Set([instanceId]);
      let changed = true;
      while (changed) {
        changed = false;
        alloyConnections.forEach((connection) => {
          if (group.has(connection.from) && !group.has(connection.to)) {
            group.add(connection.to);
            changed = true;
          }
          if (group.has(connection.to) && !group.has(connection.from)) {
            group.add(connection.from);
            changed = true;
          }
        });
      }
      return group;
    }

    function findAlloy(metalA, metalB) {
      const getMetalId = (metal) => typeof metal === 'string'
        ? metal
        : metal?.type === 'alloy' ? null : metal?.id;
      const ids = [getMetalId(metalA), getMetalId(metalB)].sort();
      if (ids.some((id) => !id)) return null;
      return ALLOYS.find((alloy) => {
        const metals = Array.isArray(alloy.metals) ? alloy.metals : alloy.elements;
        return Array.isArray(metals) && metals.length === 2 &&
          [...metals].sort().every((metalId, index) => metalId === ids[index]);
      }) || null;
    }

    function createAlloyObject(alloy, firstElement, secondElement) {
      return {
        instanceId: `alloy-${Date.now()}-${Math.random()}`,
        type: 'alloy',
        alloyKey: alloy.key,
        id: alloy.key,
        formula: alloy.formula,
        name: alloy.name,
        metals: [...(alloy.metals || alloy.elements)],
        desc: alloy.desc || '',
        color: alloy.color?.startsWith('from-') ? alloy.color : 'from-amber-500 to-yellow-700',
        surfaceColor: alloy.color?.startsWith('#') ? alloy.color : '',
        textColor: alloy.textColor || 'text-amber-50',
        borderColor: alloy.borderColor || 'border-amber-300',
        x: (firstElement.x + secondElement.x) / 2,
        y: (firstElement.y + secondElement.y) / 2,
      };
    }

    function tryConnectAlloy(instanceId) {
      const dragged = workspaceElements.find((element) => element.instanceId === instanceId);
      if (!dragged || dragged.type === 'alloy') return;
      let closest = null;

      workspaceElements.forEach((other) => {
        if (other.instanceId === dragged.instanceId || other.type === 'alloy') return;
        const alloy = findAlloy(dragged, other);
        if (!alloy) return;
        const distance = Math.hypot(
          dragged.x + ELEMENT_BLOCK_WIDTH / 2 - other.x - ELEMENT_BLOCK_WIDTH / 2,
          dragged.y + ELEMENT_BLOCK_HEIGHT / 2 - other.y - ELEMENT_BLOCK_HEIGHT / 2,
        );
        if (distance <= ALLOY_CONTACT_DISTANCE && (!closest || distance < closest.distance)) {
          closest = { other, alloy, distance };
        }
      });

      if (!closest) return;
      const alloyObject = createAlloyObject(closest.alloy, dragged, closest.other);
      workspaceElements = workspaceElements.filter((element) =>
        element.instanceId !== dragged.instanceId && element.instanceId !== closest.other.instanceId,
      );
      alloyConnections = alloyConnections.filter((connection) =>
        connection.from !== dragged.instanceId && connection.to !== dragged.instanceId &&
        connection.from !== closest.other.instanceId && connection.to !== closest.other.instanceId,
      );
      workspaceElements.push(alloyObject);
    }

    function beginElementDrag(event, element, block) {
      if (event.target.closest('.delete-element')) return;
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault();

      const groupIds = getConnectedElementGroup(element.instanceId);
      const startingPositions = new Map();
      workspaceElements.forEach((item) => {
        if (groupIds.has(item.instanceId)) startingPositions.set(item.instanceId, { x: item.x, y: item.y });
      });
      activeElementDrag = {
        instanceId: element.instanceId,
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        startingPositions,
        block,
      };
      block.classList.add('is-dragging');
      block.setPointerCapture(event.pointerId);
      block.onpointermove = moveElementDrag;
      block.onpointerup = endElementDrag;
      block.onpointercancel = endElementDrag;
    }

    function moveElementDrag(event) {
      if (!activeElementDrag || event.pointerId !== activeElementDrag.pointerId) return;
      const workspace = document.getElementById('workspace');
      const beaker = document.getElementById('beaker-drop');
      const overBeaker = isPointInsideElement(beaker, event.clientX, event.clientY);
      workspace.classList.toggle('dragging-out', overBeaker);
      beaker.classList.toggle('beaker-ready', overBeaker);

      const { width, height } = getWorkspaceBounds();
      let deltaX = event.clientX - activeElementDrag.startX;
      let deltaY = event.clientY - activeElementDrag.startY;
      if (!overBeaker) {
        activeElementDrag.startingPositions.forEach((position) => {
          deltaX = Math.max(-position.x, Math.min(width - ELEMENT_BLOCK_WIDTH - 4 - position.x, deltaX));
          deltaY = Math.max(-position.y, Math.min(height - ELEMENT_BLOCK_HEIGHT - position.y, deltaY));
        });
      }

      workspaceElements.forEach((element) => {
        const start = activeElementDrag.startingPositions.get(element.instanceId);
        if (!start) return;
        element.x = start.x + deltaX;
        element.y = start.y + deltaY;
      });
      workspace.querySelectorAll('.element-block').forEach((block) => {
        const element = workspaceElements.find((item) => String(item.instanceId) === block.dataset.instanceId);
        if (!element) return;
        block.style.left = `${element.x}px`;
        block.style.top = `${element.y}px`;
      });
      renderAlloyConnections();
    }

    function endElementDrag(event) {
      if (!activeElementDrag || event.pointerId !== activeElementDrag.pointerId) return;
      const drag = activeElementDrag;
      const overBeaker = event.type === 'pointerup' &&
        isPointInsideElement(document.getElementById('beaker-drop'), event.clientX, event.clientY);
      drag.block.classList.remove('is-dragging');
      drag.block.onpointermove = null;
      drag.block.onpointerup = null;
      drag.block.onpointercancel = null;
      activeElementDrag = null;
      document.getElementById('workspace').classList.remove('dragging-out');
      document.getElementById('beaker-drop').classList.remove('beaker-ready');

      const draggedElement = workspaceElements.find((element) => element.instanceId === drag.instanceId);
      if (overBeaker && draggedElement?.type === 'alloy') {
        const { width, height } = getWorkspaceBounds();
        draggedElement.x = Math.max(2, Math.min(width - ELEMENT_BLOCK_WIDTH - 4, draggedElement.x));
        draggedElement.y = Math.max(0, Math.min(height - ELEMENT_BLOCK_HEIGHT, draggedElement.y));
        updateWorkspace();
      } else if (overBeaker) transferElementGroupToBeaker(drag.instanceId);
      else {
        tryConnectAlloy(drag.instanceId);
        updateWorkspace();
      }
    }

    function getDropPosition(event, rect, ionId) {
      return {
        x: Math.max(2, Math.min(rect.width - ION_WIDTH - 14, event.clientX - rect.left - ION_WIDTH / 2)),
        y: Math.max(0, Math.min(
          rect.height - getIonFootprintHeight(IONS[ionId]),
          event.clientY - rect.top - getIonFootprintHeight(IONS[ionId]) / 2,
        )),
      };
    }

    function setupDragAndDrop() {
      const workspace = document.getElementById('workspace');
      const beaker = document.getElementById('beaker-drop');
      const highlightDropTarget = (enabled) => {
        workspace.classList.toggle('border-cyan-500', enabled);
        workspace.classList.toggle('bg-cyan-500/5', enabled);
      };

      workspace.ondragenter = (event) => {
        event.preventDefault();
        highlightDropTarget(true);
      };
      workspace.ondragover = (event) => {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'copy';
        highlightDropTarget(true);
      };
      workspace.ondragleave = (event) => {
        if (!workspace.contains(event.relatedTarget)) highlightDropTarget(false);
      };
      workspace.ondrop = (event) => {
        event.preventDefault();
        highlightDropTarget(false);

        const id = event.dataTransfer.getData('text/plain');
        const kind = event.dataTransfer.getData('application/x-ion-puzzle-kind') || 'ion';
        if (kind === 'element' && ELEMENTS[id]) {
          const position = getElementDropPosition(event, workspace.getBoundingClientRect());
          addElementToWorkspace(id, position.x, position.y);
        } else if (kind === 'ion' && IONS[id]) {
          const position = getDropPosition(event, workspace.getBoundingClientRect(), id);
          addIonToWorkspace(id, position.x, position.y);
        }
      };

      beaker.ondragover = (event) => {
        event.preventDefault();
        if (Array.from(event.dataTransfer.types).includes('application/x-ion-puzzle-element')) {
          event.dataTransfer.dropEffect = 'copy';
          beaker.classList.add('beaker-ready');
        }
      };
      beaker.ondragleave = (event) => {
        if (!beaker.contains(event.relatedTarget)) beaker.classList.remove('beaker-ready');
      };
      beaker.ondrop = (event) => {
        event.preventDefault();
        beaker.classList.remove('beaker-ready');
        const id = event.dataTransfer.getData('text/plain');
        const kind = event.dataTransfer.getData('application/x-ion-puzzle-kind');
        if (kind === 'element' && ELEMENTS[id]) addMetalToBeaker(id);
      };

      window.addEventListener('pointermove', (event) => {
        if (!palettePointerAction || event.pointerId !== palettePointerAction.pointerId) return;

        if (!palettePointerAction.moved && Math.hypot(
          event.clientX - palettePointerAction.startX,
          event.clientY - palettePointerAction.startY,
        ) >= PALETTE_DRAG_THRESHOLD) {
          palettePointerAction.moved = true;
        }
        if (palettePointerAction.pointerType !== 'touch' || !palettePointerAction.moved) return;

        const rect = workspace.getBoundingClientRect();
        const inside =
          event.clientX >= rect.left &&
          event.clientX <= rect.right &&
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom;
        const beakerRect = beaker.getBoundingClientRect();
        const overBeaker = palettePointerAction.kind === 'element' &&
          event.clientX >= beakerRect.left && event.clientX <= beakerRect.right &&
          event.clientY >= beakerRect.top && event.clientY <= beakerRect.bottom;
        highlightDropTarget(inside);
        beaker.classList.toggle('beaker-ready', overBeaker);
      });

      window.addEventListener('pointerup', (event) => {
        if (!palettePointerAction || event.pointerId !== palettePointerAction.pointerId) return;

        const drag = palettePointerAction;
        if (!drag.moved && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) >= PALETTE_DRAG_THRESHOLD) {
          drag.moved = true;
        }
        const rect = workspace.getBoundingClientRect();
        const inside =
          event.clientX >= rect.left &&
          event.clientX <= rect.right &&
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom;

        const beakerRect = beaker.getBoundingClientRect();
        const overBeaker = event.clientX >= beakerRect.left && event.clientX <= beakerRect.right &&
          event.clientY >= beakerRect.top && event.clientY <= beakerRect.bottom;
        if (!drag.moved) {
          addPaletteItemFromTap(drag);
        } else if (drag.pointerType === 'touch' && inside && drag.kind === 'element') {
          const position = getElementDropPosition(event, rect);
          addElementToWorkspace(drag.id, position.x, position.y);
        } else if (drag.pointerType === 'touch' && inside && drag.kind === 'ion') {
          const position = getDropPosition(event, rect, drag.id);
          addIonToWorkspace(drag.id, position.x, position.y);
        } else if (drag.pointerType === 'touch' && overBeaker && drag.kind === 'element') {
          addMetalToBeaker(drag.id);
        }

        drag.card.classList.remove('opacity-50', 'scale-95');
        highlightDropTarget(false);
        beaker.classList.remove('beaker-ready');
        palettePointerAction = null;
      });

      window.addEventListener('pointercancel', (event) => {
        if (!palettePointerAction || event.pointerId !== palettePointerAction.pointerId) return;
        palettePointerAction.card.classList.remove('opacity-50', 'scale-95');
        highlightDropTarget(false);
        beaker.classList.remove('beaker-ready');
        palettePointerAction = null;
      });
    }

    function removeIonFromWorkspace(instanceId) {
      workspaceIons = workspaceIons.filter((ion) => ion.instanceId !== instanceId);
      connections = connections.filter(
        (connection) => connection.from !== instanceId && connection.to !== instanceId,
      );
      playSound('remove');
      updateWorkspace();
    }

    function removeElementFromWorkspace(instanceId) {
      completedAlloyIds.delete(instanceId);
      workspaceElements = workspaceElements.filter((element) => element.instanceId !== instanceId);
      alloyConnections = alloyConnections.filter(
        (connection) => connection.from !== instanceId && connection.to !== instanceId,
      );
      playSound('remove');
      updateWorkspace();
    }

    function clearWorkspace() {
      if (!workspaceIons.length && !workspaceElements.length && !workspaceMolecules.length) return;

      workspaceIons = [];
      workspaceElements = [];
      completedAlloyIds.clear();
      workspaceMolecules = [];
      connections = [];
      alloyConnections = [];
      heatedGroupResults.clear();
      heatingProgress.clear();
      playSound('remove');
      updateWorkspace();
    }

    function randomCombine() {
      workspaceIons = [];
      workspaceElements = [];
      completedAlloyIds.clear();
      workspaceMolecules = [];
      connections = [];
      alloyConnections = [];
      heatedGroupResults.clear();
      heatingProgress.clear();
