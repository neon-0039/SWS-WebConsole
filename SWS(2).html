      const cationIds = Object.keys(IONS).filter((id) => IONS[id].type === 'cation');
      const anionIds = Object.keys(IONS).filter((id) => IONS[id].type === 'anion');
      const cationId = cationIds[Math.floor(Math.random() * cationIds.length)];
      const anionCount = IONS[cationId].charge;
      const ionIds = [
        cationId,
        ...Array.from({ length: anionCount }, () => anionIds[Math.floor(Math.random() * anionIds.length)]),
      ];

      ionIds.slice(0, 8).forEach((ionId, index) => {
        workspaceIons.push({
          instanceId: Date.now() + index + Math.random(),
          ...IONS[ionId],
          ...getNextIonPosition(index, ionId),
        });
      });

      playSound('add');
      updateWorkspace();
    }

    function getConnectedGroup(instanceId) {
      const groupIds = new Set([instanceId]);
      let changed = true;

      while (changed) {
        changed = false;
        connections.forEach((connection) => {
          if (groupIds.has(connection.from) && !groupIds.has(connection.to)) {
            groupIds.add(connection.to);
            changed = true;
          }
          if (groupIds.has(connection.to) && !groupIds.has(connection.from)) {
            groupIds.add(connection.from);
            changed = true;
          }
        });
      }

      return groupIds;
    }

    function isPortUsed(instanceId, portIndex) {
      return connections.some(
        (connection) =>
          (connection.from === instanceId && connection.fromPort === portIndex) ||
          (connection.to === instanceId && connection.toPort === portIndex),
      );
    }

    function getPortPosition(ion, portIndex) {
      // Keep this geometry in sync with .ion-tooth and .ion-socket (14px wide).
      // ion.x/y are workspace-local logical coordinates; for 1-valent ions the
      // half-height block is vertically centered in the same 96px logical box.
      return {
        x: ion.x + (ion.type === 'cation' ? ION_WIDTH + 7 : 5),
        y: ion.y + getIonVisualOffsetY(ion) +
          ((portIndex + 0.5) * getIonBlockHeight(ion)) / Math.abs(ion.charge),
      };
    }

    function beginIonDrag(event, ion, block) {
      if (event.target.closest('.delete-ion, .disconnect-ion')) return;
      if (event.button !== undefined && event.button !== 0) return;

      event.preventDefault();
      const groupIds = getConnectedGroup(ion.instanceId);
      const startingPositions = new Map();

      workspaceIons.forEach((item) => {
        if (groupIds.has(item.instanceId)) {
          startingPositions.set(item.instanceId, { x: item.x, y: item.y });
        }
      });

      activePointerDrag = {
        instanceId: ion.instanceId,
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        startingPositions,
        block,
      };

      block.classList.add('is-dragging');
      block.setPointerCapture(event.pointerId);
      block.onpointermove = moveIonDrag;
      block.onpointerup = endIonDrag;
      block.onpointercancel = endIonDrag;
    }

    function isPointInsideElement(element, x, y) {
      const rect = element.getBoundingClientRect();
      return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
    }

    function getCompoundForConnectedGroup(instanceId) {
      const ids = getConnectedGroup(instanceId);
      const group = {
        ions: workspaceIons.filter((ion) => ids.has(ion.instanceId)),
        connections: connections.filter((connection) => ids.has(connection.from) && ids.has(connection.to)),
      };
      return findCompoundForGroup(group) ? group : null;
    }

    function moveIonDrag(event) {
      if (!activePointerDrag || event.pointerId !== activePointerDrag.pointerId) return;

      const { width, height } = getWorkspaceBounds();
      const overBeaker = isPointInsideElement(document.getElementById('beaker-drop'), event.clientX, event.clientY);
      const canDropCompound = overBeaker && Boolean(getCompoundForConnectedGroup(activePointerDrag.instanceId));
      const workspace = document.getElementById('workspace');
      workspace.classList.toggle('dragging-out', canDropCompound);
      document.getElementById('beaker-drop').classList.toggle('beaker-ready', canDropCompound);
      let deltaX = event.clientX - activePointerDrag.startX;
      let deltaY = event.clientY - activePointerDrag.startY;

      if (!canDropCompound) {
        activePointerDrag.startingPositions.forEach((position, instanceId) => {
          deltaX = Math.max(-position.x, Math.min(width - ION_WIDTH - 14 - position.x, deltaX));
          const ion = workspaceIons.find((item) => item.instanceId === instanceId);
          const ionHeight = ion ? getIonFootprintHeight(ion) : ION_HEIGHT;
          deltaY = Math.max(-position.y, Math.min(height - ionHeight - position.y, deltaY));
        });
      }

      workspaceIons.forEach((ion) => {
        const start = activePointerDrag.startingPositions.get(ion.instanceId);
        if (!start) return;

        ion.x = start.x + deltaX;
        ion.y = start.y + deltaY;
      });

      document.querySelectorAll('#workspace .ion-block').forEach((block) => {
        const ion = workspaceIons.find((item) => String(item.instanceId) === block.dataset.instanceId);
        if (!ion) return;

        block.style.left = `${ion.x}px`;
        block.style.top = `${ion.y + getIonVisualOffsetY(ion)}px`;
      });

      renderConnections();
    }

    function endIonDrag(event) {
      if (!activePointerDrag || event.pointerId !== activePointerDrag.pointerId) return;

      const drag = activePointerDrag;
      const shouldTransfer = event.type === 'pointerup' &&
        isPointInsideElement(document.getElementById('beaker-drop'), event.clientX, event.clientY) &&
        Boolean(getCompoundForConnectedGroup(drag.instanceId));
      drag.block.classList.remove('is-dragging');
      drag.block.onpointermove = null;
      drag.block.onpointerup = null;
      drag.block.onpointercancel = null;
      activePointerDrag = null;
      document.getElementById('workspace').classList.remove('dragging-out');
      document.getElementById('beaker-drop').classList.remove('beaker-ready');

      if (shouldTransfer) {
        transferCompoundGroupToBeaker(drag.instanceId);
        return;
      }

      snapIon(drag.instanceId);
      updateWorkspace();
    }

    function snapIon(instanceId) {
      const draggedGroup = getConnectedGroup(instanceId);
      const draggedIon = workspaceIons.find((ion) => ion.instanceId === instanceId);
      if (!draggedIon) return;

      let bestMatch = null;
      workspaceIons.forEach((otherIon) => {
        if (draggedGroup.has(otherIon.instanceId) || otherIon.type === draggedIon.type) return;

        const cation = otherIon.type === 'cation' ? otherIon : draggedIon;
        const anion = otherIon.type === 'anion' ? otherIon : draggedIon;

        for (let cationPort = 0; cationPort < Math.abs(cation.charge); cationPort += 1) {
          for (let anionPort = 0; anionPort < Math.abs(anion.charge); anionPort += 1) {
            if (isPortUsed(cation.instanceId, cationPort) || isPortUsed(anion.instanceId, anionPort)) {
              continue;
            }

            const cationPosition = getPortPosition(cation, cationPort);
            const anionPosition = getPortPosition(anion, anionPort);
            const distance = Math.hypot(
              cationPosition.x - anionPosition.x,
              cationPosition.y - anionPosition.y,
            );

            if (distance <= SNAP_DISTANCE && (!bestMatch || distance < bestMatch.distance)) {
              bestMatch = { cation, anion, cationPort, anionPort, distance };
            }
          }
        }
      });

      if (!bestMatch) return;

      const cationPosition = getPortPosition(bestMatch.cation, bestMatch.cationPort);
      const anionPosition = getPortPosition(bestMatch.anion, bestMatch.anionPort);
      const direction = draggedIon.type === 'cation' ? 1 : -1;
      const deltaX = direction * (anionPosition.x - cationPosition.x);
      const deltaY = direction * (anionPosition.y - cationPosition.y);
      const { width, height } = getWorkspaceBounds();
      let fitsInWorkspace = true;

      draggedGroup.forEach((groupIonId) => {
        const ion = workspaceIons.find((item) => item.instanceId === groupIonId);
        if (!ion) return;

        const nextX = ion.x + deltaX;
        const nextY = ion.y + deltaY;
        if (
          nextX < 2 ||
          nextX > width - ION_WIDTH - 14 ||
          nextY < 0 ||
          nextY > height - getIonFootprintHeight(ion)
        ) {
          fitsInWorkspace = false;
        }
      });

      if (!fitsInWorkspace) return;

      draggedGroup.forEach((groupIonId) => {
        const ion = workspaceIons.find((item) => item.instanceId === groupIonId);
        if (!ion) return;

        ion.x += deltaX;
        ion.y += deltaY;
      });

      connections.push({
        from: bestMatch.cation.instanceId,
        fromPort: bestMatch.cationPort,
        to: bestMatch.anion.instanceId,
        toPort: bestMatch.anionPort,
      });
      playSound('add');
    }

    function disconnectIon(instanceId) {
      const connectionIndex = connections.findIndex(
        (connection) => connection.from === instanceId || connection.to === instanceId,
      );
      if (connectionIndex < 0) return;

      connections.splice(connectionIndex, 1);
      playSound('remove');
      updateWorkspace();
    }

    function formatBeakerAmount(amount) {
      return Number.isInteger(amount) ? String(amount) : amount.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    }

    function igniteBeakerHydrogen(flameRect) {
      const gasKey = HYDROGEN_MOLECULE?.key;
      const amount = gasKey ? beakerState.gases[gasKey] || 0 : 0;
      const liquid = document.getElementById('beaker-liquid');
      if (!amount || !liquid) return;
      const liquidRect = liquid.getBoundingClientRect();
      const flameTouchesLiquid = flameRect.left <= liquidRect.right && flameRect.right >= liquidRect.left &&
        flameRect.top <= liquidRect.bottom && flameRect.bottom >= liquidRect.top;
      if (!flameTouchesLiquid) return;

      // 2H₂ + O₂ → 2H₂O. Air is treated as available; the resulting water
      // returns to the same beaker water pool used by the metal reactions.
      beakerState.gases[gasKey] = 0;
      const waterProduced = amount * 2;
      beakerState.waterMl += waterProduced * BEAKER_WATER_PER_METAL_UNIT_ML;
      beakerState.molecules['H1OH1'] = (beakerState.molecules['H1OH1'] || 0) + waterProduced;
      appendBeakerLog(`2H₂ + O₂ → 2H₂O（H₂ ${formatBeakerAmount(amount)} 単位が燃焼）`);
      const vessel = document.querySelector('.beaker-vessel');
      vessel.classList.add('is-hydrogen-burning');
      window.setTimeout(() => vessel.classList.remove('is-hydrogen-burning'), 560);
      playSound('success');
    }

    function appendBeakerLog(message) {
      beakerState.logs.unshift(message);
      beakerState.logs = beakerState.logs.slice(0, 12);
      renderBeaker();
    }

    function animateDissolution(color) {
      const liquid = document.getElementById('beaker-liquid');
      if (!liquid) return;
      for (let index = 0; index < 14; index += 1) {
        const particle = document.createElement('span');
        particle.className = 'dissolution-particle';
        particle.style.left = `${8 + Math.random() * 84}%`;
        particle.style.top = `${8 + Math.random() * 44}%`;
        particle.style.setProperty('--drift-x', `${Math.round(Math.random() * 50 - 25)}px`);
        particle.style.backgroundColor = color || '#67e8f9';
        liquid.appendChild(particle);
        window.setTimeout(() => particle.remove(), 1300);
      }
    }

    function getDissolvedCompoundData(item) {
      return COMPOUNDS.find((compound) => compound.key === item.key) || item;
    }

    function getDissolvedCompoundAmount(key) {
      return beakerState.dissolvedCompounds
        .filter((item) => item.key === key)
        .reduce((total, item) => total + item.amount, 0);
    }

    function consumeDissolvedCompoundAmount(key, amount) {
      let remaining = amount;
      beakerState.dissolvedCompounds.forEach((item) => {
        if (item.key !== key || remaining <= 1e-9) return;
        const consumed = Math.min(item.amount, remaining);
        item.amount -= consumed;
        remaining -= consumed;
      });
      beakerState.dissolvedCompounds = beakerState.dissolvedCompounds.filter((item) => item.amount > 1e-9);
      return amount - remaining;
    }

    function consumeDissolvedIonSources(ionId, amount, allowedKeys = null) {
      let remaining = amount;
      const result = { consumed: 0, sources: [], spectatorCations: {}, spectatorAnions: {} };

      beakerState.dissolvedCompounds.forEach((item) => {
        if (remaining <= 1e-9 || (allowedKeys && !allowedKeys.includes(item.key))) return;
        const compound = getDissolvedCompoundData(item);
        const cations = compound.cations || {};
        const anions = compound.anions || {};
        const ionCount = (cations[ionId] || 0) + (anions[ionId] || 0);
        if (!ionCount) return;

        const units = Math.min(item.amount, remaining / ionCount);
        if (units <= 0) return;
        item.amount -= units;
        remaining -= ionCount * units;
        result.sources.push({ compound, units });
        Object.entries(cations).forEach(([sourceIonId, count]) => {
          if (sourceIonId !== ionId) {
            result.spectatorCations[sourceIonId] = (result.spectatorCations[sourceIonId] || 0) + count * units;
          }
        });
        Object.entries(anions).forEach(([sourceIonId, count]) => {
          if (sourceIonId !== ionId) {
            result.spectatorAnions[sourceIonId] = (result.spectatorAnions[sourceIonId] || 0) + count * units;
          }
        });
      });

      beakerState.dissolvedCompounds = beakerState.dissolvedCompounds.filter((item) => item.amount > 1e-9);
      result.consumed = amount - remaining;
      return result;
    }

    function recordDissolvedCompound(compound, amount) {
      if (!compound || amount <= 1e-9) return;
      const existing = beakerState.dissolvedCompounds.find((item) => item.key === compound.key);
      if (existing) {
        existing.amount += amount;
        existing.cations = compound.cations;
        existing.anions = compound.anions;
      } else {
        beakerState.dissolvedCompounds.push({
          key: compound.key,
          formula: compound.formula,
          amount,
          cations: compound.cations,
          anions: compound.anions,
        });
      }
    }

    function getCompositionUnitCount(cations, anions) {
      return [...Object.values(cations), ...Object.values(anions)]
        .reduce((divisor, count) => greatestCommonDivisor(divisor, count), 0) || 1;
    }

    function findDissolvedSaltSource(ionId) {
      return beakerState.dissolvedCompounds.reduce((source, item) => {
        if (source) return source;
        const compound = getDissolvedCompoundData(item);
        const cations = compound.cations || {};
        const cationIds = Object.keys(cations);
        const anions = compound.anions || {};
        if (cationIds.length !== 1 || cationIds[0] !== ionId || !Object.keys(anions).length) return null;
        return { item, compound, ionCountPerUnit: cations[ionId] };
      }, null);
    }

    function formatReactionTerm(coefficient, formula) {
      const coefficientText = Math.abs(coefficient - 1) < 1e-9
        ? ''
        : `${formatBeakerAmount(coefficient)} `;
      return `${coefficientText}${formula}`;
    }

    function formatReactionTerms(terms, extent = 1) {
      return terms.map((term) => {
        const compound = COMPOUNDS.find((item) => item.key === term.key);
        const formula = compound?.formula || term.key;
        const phase = term.phase === 'precipitate' ? '↓' : '';
        return `${formatReactionTerm(term.coefficient * extent, formula)}${phase}`;
      }).join(' + ');
    }

    function flashBeakerReaction() {
      const vessel = document.querySelector('.beaker-vessel');
      if (!vessel) return;
      vessel.classList.remove('reaction-complete');
      void vessel.offsetWidth;
      vessel.classList.add('reaction-complete');
      window.setTimeout(() => vessel.classList.remove('reaction-complete'), 450);
    }

    function neutralizeBeakerAcidBase() {
      const acidRule = ACID_BASE_RULES.find((rule) => rule.role === 'acid');
      const baseRule = ACID_BASE_RULES.find((rule) => rule.role === 'base');
      if (!acidRule || !baseRule) return false;
      const acidAmount = beakerState.solutionIons[acidRule.ionId] || 0;
      const baseAmount = beakerState.solutionIons[baseRule.ionId] || 0;
      const neutralized = Math.min(acidAmount, baseAmount);
      if (neutralized <= 1e-9) return false;

      consumeDissolvedIonSources(acidRule.ionId, neutralized);
      consumeDissolvedIonSources(baseRule.ionId, neutralized);
      beakerState.solutionIons[acidRule.ionId] = acidAmount - neutralized;
      beakerState.solutionIons[baseRule.ionId] = baseAmount - neutralized;
      beakerState.molecules.H1OH1 = (beakerState.molecules.H1OH1 || 0) + neutralized;
      appendBeakerLog(`H⁺ + OH⁻ → H₂O（中和 ${formatBeakerAmount(neutralized)} 単位）`);
      return true;
    }

    function runPrecipitationRules() {
      let changed = true;
      let pass = 0;
      const products = [];
      while (changed && pass < 12) {
        changed = false;
        pass += 1;
        PRECIPITATION_RULES.forEach((rule) => {
          const availableCations = beakerState.solutionIons[rule.cationId] || 0;
          const availableAnions = beakerState.solutionIons[rule.anionId] || 0;
          const extent = Math.floor(Math.min(
            availableCations / rule.cationCount,
            availableAnions / rule.anionCount,
          ) + 1e-9);
          if (extent <= 0) return;

          beakerState.solutionIons[rule.cationId] = availableCations - rule.cationCount * extent;
          beakerState.solutionIons[rule.anionId] = availableAnions - rule.anionCount * extent;
          const existing = beakerState.precipitates.find((item) => item.key === rule.compound.key);
          if (existing) existing.amount += extent;
          else beakerState.precipitates.push({
            key: rule.compound.key,
            formula: rule.compound.formula,
            name: rule.compound.name,
            color: rule.compound.color,
            amount: extent,
          });
          products.push({ compound: rule.compound, amount: extent });
          const cationTerm = `${rule.cationCount > 1 ? `${rule.cationCount} ` : ''}${formatIonFormula(rule.cationId)}`;
          const anionTerm = `${rule.anionCount > 1 ? `${rule.anionCount} ` : ''}${formatIonFormula(rule.anionId)}`;
          appendBeakerLog(`${cationTerm} + ${anionTerm} → ${rule.compound.formula}↓（沈殿）`);
          changed = true;
        });
      }
      return products;
    }

    function runDisplacementReactions() {
      let reacted = false;
      ACTIVITY_SERIES.forEach((metal) => {
        const metalIon = METAL_IONS[metal];
        if (!metalIon || !IONS[metalIon.ionId] || !ELEMENTS[metal]) return;
        let availableMetal = beakerState.metalPieces[metal] || 0;
        if (availableMetal <= 0) return;

        const metalRank = ACTIVITY_SERIES.indexOf(metal);
        ACTIVITY_SERIES.slice(metalRank + 1).forEach((targetMetal) => {
          if (availableMetal <= 0) return;
          const targetIon = METAL_IONS[targetMetal];
          if (!targetIon || !IONS[targetIon.ionId]) return;
          const source = findDissolvedSaltSource(targetIon.ionId);
          if (!source) return;

          const ionsInSolution = beakerState.solutionIons[targetIon.ionId] || 0;
          const sourceIonsAvailable = source.ionCountPerUnit * source.item.amount;
          const targetAmount = Math.min(ionsInSolution, sourceIonsAvailable);
          const divisor = greatestCommonDivisor(metalIon.charge, targetIon.charge);
          const metalCoefficient = targetIon.charge / divisor;
          const targetCoefficient = metalIon.charge / divisor;
          const extent = Math.min(availableMetal / metalCoefficient, targetAmount / targetCoefficient);
          if (extent <= 1e-9) return;

          const metalConsumed = metalCoefficient * extent;
          const targetConsumed = targetCoefficient * extent;
          const sourceUnits = targetConsumed / source.ionCountPerUnit;
          const productAnions = Object.fromEntries(
            Object.entries(source.compound.anions).map(([ionId, count]) => [ionId, count * sourceUnits]),
          );
          const productInputs = { [metalIon.ionId]: metalConsumed };
          const product = makeRuntimeCompound(productInputs, productAnions);
          if (!product) return;

          consumeDissolvedCompoundAmount(source.item.key, sourceUnits);
          availableMetal -= metalConsumed;
          beakerState.metalPieces[metal] = Math.max(0, availableMetal);
          beakerState.solutionIons[targetIon.ionId] = ionsInSolution - targetConsumed;
          beakerState.solutionIons[metalIon.ionId] = (beakerState.solutionIons[metalIon.ionId] || 0) + metalConsumed;
          beakerState.depositedMetals[targetMetal] = (beakerState.depositedMetals[targetMetal] || 0) + targetConsumed;
          const productUnits = getCompositionUnitCount(productInputs, productAnions);
          recordDissolvedCompound(product, productUnits);

          const equation = `${formatReactionTerm(metalConsumed, metal)} + ${formatReactionTerm(sourceUnits, source.compound.formula)} → ${formatReactionTerm(productUnits, product.formula)} + ${formatReactionTerm(targetConsumed, targetMetal)}`;
          appendBeakerLog(`${equation}\n置換反応：${metal}が${formatIonFormula(targetIon.ionId)}を還元して${targetMetal}を析出させました。`);
          reacted = true;
        });
      });
      return reacted;
    }

    function runMetalAcidReactions() {
      const hydrogenRank = ACTIVITY_SERIES.indexOf('Cu');
      if (hydrogenRank < 0) return false;
      let reacted = false;
      ACTIVITY_SERIES.slice(0, hydrogenRank).forEach((metal) => {
        const metalIon = METAL_IONS[metal];
        if (!metalIon || !IONS[metalIon.ionId] || !ELEMENTS[metal]) return;
        let availableMetal = beakerState.metalPieces[metal] || 0;
        if (availableMetal <= 0) return;

        BEAKER_REACTION_RULES.acidSources.forEach((acidKey) => {
          if (availableMetal <= 0) return;
          const acidItem = beakerState.dissolvedCompounds.find((item) => item.key === acidKey);
          if (!acidItem) return;
          const acid = getDissolvedCompoundData(acidItem);
          if (Object.keys(acid.cations || {}).length !== 1 || !acid.cations['H+'] || !Object.keys(acid.anions || {}).length) return;

          const divisor = greatestCommonDivisor(metalIon.charge, 2);
          const metalCoefficient = 2 / divisor;
          const hydrogenCoefficient = metalIon.charge * metalCoefficient;
          const hydrogenGasCoefficient = hydrogenCoefficient / 2;
          const hydrogenPerAcid = acid.cations['H+'];
          const acidUnitsPerExtent = hydrogenCoefficient / hydrogenPerAcid;
          if (!Number.isInteger(acidUnitsPerExtent)) return;
          const availableHydrogen = beakerState.solutionIons['H+'] || 0;
          const extent = Math.min(
            availableMetal / metalCoefficient,
            acidItem.amount / acidUnitsPerExtent,
            availableHydrogen / hydrogenCoefficient,
          );
          if (extent <= 1e-9) return;

          const metalConsumed = metalCoefficient * extent;
          const acidUnits = acidUnitsPerExtent * extent;
          const productAnions = Object.fromEntries(
            Object.entries(acid.anions).map(([ionId, count]) => [ionId, count * acidUnits]),
          );
          const productInputs = { [metalIon.ionId]: metalConsumed };
          const product = makeRuntimeCompound(productInputs, productAnions);
          if (!product) return;

          consumeDissolvedCompoundAmount(acidKey, acidUnits);
          availableMetal -= metalConsumed;
          beakerState.metalPieces[metal] = Math.max(0, availableMetal);
          beakerState.solutionIons['H+'] = availableHydrogen - hydrogenCoefficient * extent;
          beakerState.solutionIons[metalIon.ionId] = (beakerState.solutionIons[metalIon.ionId] || 0) + metalConsumed;
          const gasKey = HYDROGEN_MOLECULE?.key || 'H2';
          beakerState.gases[gasKey] = (beakerState.gases[gasKey] || 0) + hydrogenGasCoefficient * extent;
          const productUnits = getCompositionUnitCount(productInputs, productAnions);
          recordDissolvedCompound(product, productUnits);
          const equation = `${formatReactionTerm(metalConsumed, metal)} + ${formatReactionTerm(acidUnits, acid.formula)} → ${formatReactionTerm(productUnits, product.formula)} + ${formatReactionTerm(hydrogenGasCoefficient * extent, 'H₂')}`;
          appendBeakerLog(`${equation}\n金属＋酸反応：${metal}がH⁺を還元して水素を発生させました。`);
          for (let index = 0; index < Math.min(10, Math.ceil(hydrogenGasCoefficient * extent * 6)); index += 1) createBeakerReactionBubbles();
          reacted = true;
        });
      });
      return reacted;
    }

    function runDoubleDisplacementReactions(precipitationProducts) {
      let reacted = false;
      BEAKER_REACTION_RULES.doubleDisplacement.forEach((rule) => {
        const precipitateCoefficient = rule.products.find((product) => product.phase === 'precipitate')?.coefficient || 1;
        const precipitatedAmount = precipitationProducts
          .filter((product) => product.compound.key === rule.precipitateKey)
          .reduce((total, product) => total + product.amount, 0);
        let extent = precipitatedAmount / precipitateCoefficient;
        rule.reactants.forEach((reactant) => {
          extent = Math.min(extent, getDissolvedCompoundAmount(reactant.key) / reactant.coefficient);
        });
        if (extent <= 1e-9) return;

        rule.reactants.forEach((reactant) => consumeDissolvedCompoundAmount(reactant.key, reactant.coefficient * extent));
        rule.products.filter((product) => product.phase !== 'precipitate').forEach((product) => {
          const compound = COMPOUNDS.find((item) => item.key === product.key);
          if (compound) recordDissolvedCompound(compound, product.coefficient * extent);
        });
        const equation = `${formatReactionTerms(rule.reactants, extent)} → ${formatReactionTerms(rule.products, extent)}`;
        appendBeakerLog(`${equation}\n複分解反応：難溶性の${COMPOUNDS.find((item) => item.key === rule.precipitateKey)?.formula || rule.precipitateKey}が生成しました。`);
        reacted = true;
      });
      return reacted;
    }

    function runGasEvolutionReactions() {
      let reacted = false;
      BEAKER_REACTION_RULES.gasEvolution.forEach((rule) => {
        const anionAmount = beakerState.solutionIons[rule.ionId] || 0;
        const hydrogenAmount = beakerState.solutionIons['H+'] || 0;
        const extent = Math.floor(Math.min(anionAmount, hydrogenAmount / rule.acidEquivalents) + 1e-9);
        if (extent <= 1e-9) return;

        const anionSources = consumeDissolvedIonSources(rule.ionId, extent);
        const acidSources = consumeDissolvedIonSources('H+', rule.acidEquivalents * extent, BEAKER_REACTION_RULES.acidSources);
        beakerState.solutionIons[rule.ionId] = anionAmount - extent;
        beakerState.solutionIons['H+'] = hydrogenAmount - rule.acidEquivalents * extent;
        beakerState.gases[rule.gasKey] = (beakerState.gases[rule.gasKey] || 0) + extent;
        beakerState.molecules.H1OH1 = (beakerState.molecules.H1OH1 || 0) + extent;
        const spectatorSalt = makeRuntimeCompound(anionSources.spectatorCations, acidSources.spectatorAnions);
        if (spectatorSalt) {
          const spectatorUnits = getCompositionUnitCount(anionSources.spectatorCations, acidSources.spectatorAnions);
          recordDissolvedCompound(spectatorSalt, spectatorUnits);
        }
        appendBeakerLog(`${rule.equation}（気体発生反応）`);
        for (let index = 0; index < Math.min(10, Math.ceil(extent * 6)); index += 1) createBeakerReactionBubbles();
        reacted = true;
      });
      return reacted;
    }

    function isAquaRegiaPresent() {
      return beakerState.waterMl > 0 && BEAKER_REACTION_RULES.aquaRegia.some((rule) =>
        rule.acidKeys.every((acidKey) => beakerState.dissolvedCompounds.some((item) =>
          item.key === acidKey && item.amount > 1e-9,
        )),
      );
    }

    function runAquaRegiaReactions() {
      let reacted = false;
      BEAKER_REACTION_RULES.aquaRegia.forEach((rule) => {
        if (!isAquaRegiaPresent()) return;
        const goldAmount = beakerState.metalPieces[rule.metal] || 0;
        if (goldAmount <= 0) return;

        beakerState.metalPieces[rule.metal] = 0;
        beakerState.dissolvedMetals[rule.metal] = (beakerState.dissolvedMetals[rule.metal] || 0) + goldAmount;
        appendBeakerLog(rule.log);
        reacted = true;
      });
      return reacted;
    }

    function processBeakerReactions() {
      const aquaRegia = runAquaRegiaReactions();
      const displacement = runDisplacementReactions();
      const metalAcid = runMetalAcidReactions();
      const precipitationProducts = runPrecipitationRules();
      const doubleDisplacement = runDoubleDisplacementReactions(precipitationProducts);
      const neutralization = neutralizeBeakerAcidBase();
      const gasEvolution = runGasEvolutionReactions();
      const reacted = aquaRegia || displacement || metalAcid || precipitationProducts.length > 0 ||
        doubleDisplacement || neutralization || gasEvolution;
      measureBeakerPH(false);
      renderBeaker();
      if (reacted) flashBeakerReaction();
      return reacted;
    }

    function addCompoundToBeaker(compound) {
      const solubility = getCompoundSolubility(compound);
      const dissolvedAmount = solubility === 'insoluble' ? 0 : solubility === 'slightlySoluble' ? 0.1 : 1;
      if (dissolvedAmount > 0) {
        Object.entries(compound.cations).forEach(([ionId, count]) => {
          beakerState.solutionIons[ionId] = (beakerState.solutionIons[ionId] || 0) + count * dissolvedAmount;
        });
        Object.entries(compound.anions).forEach(([ionId, count]) => {
          beakerState.solutionIons[ionId] = (beakerState.solutionIons[ionId] || 0) + count * dissolvedAmount;
        });
        const dissolved = beakerState.dissolvedCompounds.find((item) => item.key === compound.key);
        if (dissolved) dissolved.amount += dissolvedAmount;
        else beakerState.dissolvedCompounds.push({ key: compound.key, formula: compound.formula, amount: dissolvedAmount });
        animateDissolution(compound.color);
      }
      if (dissolvedAmount < 1) {
        beakerState.undissolvedSolids.push({
          key: compound.key,
          formula: compound.formula,
          name: compound.name,
          color: compound.color,
          amount: 1 - dissolvedAmount,
        });
      }

      appendBeakerLog(dissolvedAmount === 1
        ? `${compound.formula} が水に溶け、イオンに分散しました。`
        : dissolvedAmount === 0
          ? `${compound.formula} は水に溶けず、ビーカー底に残りました。`
          : `${compound.formula} は一部が溶け、残りは固体として残りました。`);
      processBeakerReactions();
    }

    function applyReactionGasToWater(key, amount = 1) {
      if (beakerState.waterMl <= 0 || amount <= 0) return;
      if (key === 'CO2') {
        // CO₂ ⇌ H₂CO₃: represent the weak acid with a small H⁺ contribution.
        beakerState.solutionIons['H+'] = (beakerState.solutionIons['H+'] || 0) + amount * 0.01;
        appendBeakerLog(`CO₂ + H₂O ⇌ H₂CO₃：水溶液が酸性側に変化しました。`);
      } else if (key === 'NH3') {
        // NH₃ + H₂O ⇌ NH₄⁺ + OH⁻. Keep the NH₃ gas inventory intact.
        beakerState.solutionIons['NH4+'] = (beakerState.solutionIons['NH4+'] || 0) + amount * 0.05;
        beakerState.solutionIons['OH-'] = (beakerState.solutionIons['OH-'] || 0) + amount * 0.05;
        appendBeakerLog(`NH₃ + H₂O ⇌ NH₄⁺ + OH⁻：水溶液がアルカリ性側に変化しました。`);
      }
      measureBeakerPH(false);
    }

    function transferWorkspaceMoleculeToBeaker(instanceId) {
      const molecule = workspaceMolecules.find((item) => item.instanceId === instanceId);
      if (!molecule) return;
      workspaceMolecules = workspaceMolecules.filter((item) => item.instanceId !== instanceId);
      const amount = molecule.amount || 1;
      if (molecule.key === 'CO2' || molecule.key === 'NH3') {
        beakerState.gases[molecule.key] = (beakerState.gases[molecule.key] || 0) + amount;
        if (beakerState.waterMl > 0) applyReactionGasToWater(molecule.key, amount);
        for (let index = 0; index < Math.min(10, Math.ceil(amount * 6)); index += 1) createBeakerReactionBubbles();
      } else if (molecule.key === 'H1OH1' || molecule.key === 'H2O1') {
        beakerState.molecules.H1OH1 = (beakerState.molecules.H1OH1 || 0) + amount;
        beakerState.waterMl += amount * BEAKER_WATER_PER_METAL_UNIT_ML;
      } else {
        const compound = COMPOUNDS.find((item) => item.key === molecule.key);
        if (compound) {
          addTransferredCompoundToBeaker(compound, amount);
        }
      }
      appendBeakerLog(`${molecule.formula}${amount > 1 ? ` ×${formatBeakerAmount(amount)}` : ''} をビーカーへ移しました。`);
      measureBeakerPH(false);
      renderBeaker();
      updateWorkspace();
    }

    function beginWorkspaceMoleculeDrag(event, molecule, block) {
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault();
      activeMoleculeDrag = {
        instanceId: molecule.instanceId, pointerId: event.pointerId,
        startX: event.clientX, startY: event.clientY, originX: molecule.x, originY: molecule.y, block,
      };
      block.classList.add('is-dragging');
      block.setPointerCapture(event.pointerId);
      block.onpointermove = moveWorkspaceMoleculeDrag;
      block.onpointerup = endWorkspaceMoleculeDrag;
      block.onpointercancel = endWorkspaceMoleculeDrag;
    }

    function moveWorkspaceMoleculeDrag(event) {
      const drag = activeMoleculeDrag;
      if (!drag || event.pointerId !== drag.pointerId) return;
      const molecule = workspaceMolecules.find((item) => item.instanceId === drag.instanceId);
      if (!molecule) return;
      const workspace = document.getElementById('workspace');
      const overBeaker = isPointInsideElement(document.getElementById('beaker-drop'), event.clientX, event.clientY);
      workspace.classList.toggle('dragging-out', overBeaker);
      document.getElementById('beaker-drop').classList.toggle('beaker-ready', overBeaker);
      const bounds = getWorkspaceBounds();
      molecule.x = Math.max(0, Math.min(bounds.width - 88, drag.originX + event.clientX - drag.startX));
      molecule.y = Math.max(0, Math.min(bounds.height - 42, drag.originY + event.clientY - drag.startY));
      drag.block.style.left = `${molecule.x}px`;
      drag.block.style.top = `${molecule.y}px`;
    }

    function endWorkspaceMoleculeDrag(event) {
      const drag = activeMoleculeDrag;
      if (!drag || event.pointerId !== drag.pointerId) return;
      const overBeaker = event.type === 'pointerup' &&
        isPointInsideElement(document.getElementById('beaker-drop'), event.clientX, event.clientY);
      drag.block.classList.remove('is-dragging');
      drag.block.onpointermove = drag.block.onpointerup = drag.block.onpointercancel = null;
      activeMoleculeDrag = null;
      document.getElementById('workspace').classList.remove('dragging-out');
      document.getElementById('beaker-drop').classList.remove('beaker-ready');
      if (overBeaker) transferWorkspaceMoleculeToBeaker(drag.instanceId);
      else updateWorkspace();
    }

    function transferCompoundGroupToBeaker(instanceId) {
      const group = getCompoundForConnectedGroup(instanceId);
      if (!group) return;
      const compound = findCompoundForGroup(group);
      if (!compound) return;
      const groupIds = new Set(group.ions.map((ion) => ion.instanceId));
      workspaceIons = workspaceIons.filter((ion) => !groupIds.has(ion.instanceId));
      connections = connections.filter((connection) => !groupIds.has(connection.from) || !groupIds.has(connection.to));
      const groupKey = getCompoundGroupKey(group);
      completedGroupKeys.delete(groupKey);
      heatedGroupResults.delete(groupKey);
      heatingProgress.delete(groupKey);
      addCompoundToBeaker(compound);
      playSound('add');
      updateWorkspace();
    }

    function transferElementGroupToBeaker(instanceId) {
      const groupIds = getConnectedElementGroup(instanceId);
      const transferred = workspaceElements.filter((element) => groupIds.has(element.instanceId));
      if (!transferred.length) return;
      workspaceElements = workspaceElements.filter((element) => !groupIds.has(element.instanceId));
      alloyConnections = alloyConnections.filter(
        (connection) => !groupIds.has(connection.from) || !groupIds.has(connection.to),
      );
      transferred.forEach((element) => processElementDropIntoBeaker(element.id));
      measureBeakerPH(false);
      renderBeaker();
      playSound('add');
      updateWorkspace();
    }

    function calculateBeakerPH() {
      let acid = 0;
      let base = 0;
      ACID_BASE_RULES.forEach((rule) => {
        const amount = beakerState.solutionIons[rule.ionId] || 0;
        if (rule.role === 'acid') acid += amount;
        if (rule.role === 'base') base += amount;
      });
      const net = acid - base;
      if (Math.abs(net) < 1e-9) return 7;
      const concentration = Math.abs(net) * BEAKER_MOLES_PER_UNIT / BEAKER_VOLUME_LITERS;
      const pH = net > 0 ? -Math.log10(concentration) : 14 + Math.log10(concentration);
      return Math.max(0, Math.min(14, pH));
    }

    function measureBeakerPH(writeLog = true) {
      const pH = calculateBeakerPH();
      const classification = pH < 6.95 ? '酸性' : pH > 7.05 ? 'アルカリ性' : '中性';
      beakerState.lastPH = pH;
      if (writeLog) appendBeakerLog(`pH：${pH.toFixed(1)}　判定：${classification}`);
      else renderBeaker();
      return pH;
    }

    function getAlkaliHydroxideCompound(metal) {
      const reaction = ALKALI_METAL_WATER_REACTIONS[metal];
      if (!reaction) return null;
      const registered = COMPOUNDS.find((compound) => compound.key === reaction.hydroxideKey);
      if (registered) return registered;
      if (metal !== 'Cs') return null;

      // CsOH is not in the current hand-authored catalogue; provide the same
      // compound data shape to the existing dissolution/display pipeline.
      return {
        key: 'CsOH', formula: 'CsOH', name: '水酸化セシウム',
        cations: { 'Cs+': 1 }, anions: { 'OH-': 1 },
        color: '#c4b5fd', solubility: 'soluble',
      };
    }

    function createBeakerReactionBubbles() {
      const liquid = document.getElementById('beaker-liquid');
      if (!liquid) return;
      const bubble = document.createElement('span');
      bubble.className = 'beaker-reaction-bubble';
      bubble.style.left = `${18 + Math.random() * 64}%`;
      bubble.style.setProperty('--bubble-drift', `${Math.round(Math.random() * 24 - 12)}px`);
      liquid.appendChild(bubble);
      window.setTimeout(() => bubble.remove(), 1050);
    }

    function renderAlkaliReactionState() {
      const vessel = document.querySelector('.beaker-vessel');
      const indicator = document.getElementById('beaker-reaction-indicator');
      const flame = document.getElementById('beaker-reaction-flame');
      const reactions = [...beakerState.activeAlkaliReactions.values()]
        .filter((reaction) => reaction.isReacting);
      const current = reactions[reactions.length - 1];
      const heatingKey = beakerState.heatingReactantKey;
      const heatingReaction = heatingKey ? HEATING_REACTIONS[heatingKey] : null;
      vessel.classList.toggle('is-alkali-reacting', Boolean(current));
      vessel.classList.toggle('is-violent-reaction', Boolean(current?.intense));
      vessel.classList.toggle('is-chemical-heating', Boolean(heatingReaction));
      if (current) vessel.style.setProperty('--reaction-glow', `${current.color}aa`);
      else vessel.style.removeProperty('--reaction-glow');
      const compoundHeating = !current && Boolean(heatingReaction);
      indicator.classList.toggle('hidden', !current && !compoundHeating);
      flame.classList.toggle('hidden', !current);
      if (current) {
        indicator.textContent = `${current.label}の炎・反応中：${current.equation}`;
        flame.style.setProperty('--reaction-color', current.color);
      } else if (compoundHeating) {
        indicator.textContent = `加熱中：${getHeatingEquation(heatingReaction)}`;
      }
    }

    function finishAlkaliMetalWaterReaction(reactionId) {
      const reaction = beakerState.activeAlkaliReactions.get(reactionId);
      if (!reaction?.isReacting) return;
      reaction.isReacting = false;
      window.clearInterval(reaction.bubbleTimer);
      beakerState.activeAlkaliReactions.delete(reactionId);

      const hydroxide = getAlkaliHydroxideCompound(reaction.metal);
      if (hydroxide) addCompoundToBeaker(hydroxide);
      if (HYDROGEN_MOLECULE) {
        // One metal unit follows M + H₂O → MOH + ½H₂; amount is in
        // formula-unit equivalents so the atom balance stays consistent.
        beakerState.gases[HYDROGEN_MOLECULE.key] =
          (beakerState.gases[HYDROGEN_MOLECULE.key] || 0) + 0.5;
      }

      appendBeakerLog(`${reaction.equation}（反応完了）`);
      const vessel = document.querySelector('.beaker-vessel');
      vessel.classList.add('reaction-complete');
      window.setTimeout(() => vessel.classList.remove('reaction-complete'), 450);
      renderAlkaliReactionState();
      renderBeaker();
      playSound('success');
    }

    function startAlkaliMetalWaterReaction(metal) {
      const config = ALKALI_METAL_WATER_REACTIONS[metal];
      if (!config || beakerState.waterMl < BEAKER_WATER_PER_METAL_UNIT_ML) return false;

      const hydroxide = getAlkaliHydroxideCompound(metal);
      if (!hydroxide || !HYDROGEN_MOLECULE) return false;

      beakerState.waterMl = Math.max(0, beakerState.waterMl - BEAKER_WATER_PER_METAL_UNIT_ML);
      const reactionId = ++nextAlkaliReactionId;
      const equation = `2${metal} + 2H₂O → 2${hydroxide.formula} + H₂`;
      const reaction = {
        id: reactionId,
        metal,
        color: config.color,
        label: config.label,
        equation,
        intense: Boolean(config.intense),
        isReacting: true,
        bubbleTimer: null,
      };
      beakerState.activeAlkaliReactions.set(reactionId, reaction);
      appendBeakerLog(`${metal} + 水：反応開始。金属と水を各1単位消費します。`);
      renderAlkaliReactionState();
      renderBeaker();
      createBeakerReactionBubbles();
      reaction.bubbleTimer = window.setInterval(createBeakerReactionBubbles, 150);
      reaction.completionTimer = window.setTimeout(
        () => finishAlkaliMetalWaterReaction(reactionId),
        config.duration,
      );
      return true;
    }

    function processElementDropIntoBeaker(elementId) {
      if (!ELEMENTS[elementId]) return;
      if (ALKALI_METAL_WATER_REACTIONS[elementId] && beakerState.waterMl > 0) {
        if (startAlkaliMetalWaterReaction(elementId)) return;
      }
      beakerState.metalPieces[elementId] = (beakerState.metalPieces[elementId] || 0) + 1;
      appendBeakerLog(beakerState.waterMl <= 0 && ALKALI_METAL_WATER_REACTIONS[elementId]
        ? `${elementId} をビーカーに入れました。水がないため反応せず、単体のまま残ります。`
        : `${elementId} をビーカーに入れました。`);
      processBeakerReactions();
    }

    function addMetalToBeaker(metal) {
      if (!ELEMENTS[metal]) return;
      processElementDropIntoBeaker(metal);
    }

    function clearBeaker() {
      beakerState.activeAlkaliReactions.forEach((reaction) => {
        reaction.isReacting = false;
        window.clearInterval(reaction.bubbleTimer);
        window.clearTimeout(reaction.completionTimer);
      });
      beakerState.activeAlkaliReactions.clear();
      beakerState.heatingProgress = {};
      beakerState.heatingReactantKey = null;
      beakerState.solutionIons = {};
      beakerState.dissolvedCompounds = [];
      beakerState.undissolvedSolids = [];
      beakerState.precipitates = [];
      beakerState.metalPieces = {};
      beakerState.dissolvedMetals = {};
      beakerState.depositedMetals = {};
      beakerState.waterMl = 100;
      beakerState.gases = {};
      beakerState.molecules = {};
      beakerState.logs = [];
      beakerState.lastPH = null;
      renderAlkaliReactionState();
      renderBeaker();
    }

    function renderBeaker() {
      const ionCloud = document.getElementById('beaker-ion-cloud');
      if (!ionCloud) return;
      const liquid = document.getElementById('beaker-liquid');
      const waterRatio = Math.max(0, Math.min(1, beakerState.waterMl / 100));
      liquid.style.inset = `${100 - waterRatio * 72}% 0 0`;
      liquid.classList.toggle('is-aqua-regia', isAquaRegiaPresent());
      document.getElementById('beaker-water-label').textContent = `水 ${formatBeakerAmount(beakerState.waterMl)} mL`;
      ionCloud.innerHTML = '';
      Object.entries(beakerState.solutionIons).forEach(([ionId, amount]) => {
        if (amount <= 0.001) return;
        const badge = document.createElement('span');
        badge.className = 'rounded-full bg-slate-950/70 border border-cyan-300/30 px-1.5 py-0.5 text-[9px] text-cyan-100';
        badge.innerHTML = `${formatIonFormula(ionId)} ×${formatBeakerAmount(amount)}`;
        ionCloud.appendChild(badge);
      });

      const solids = document.getElementById('beaker-solids');
      solids.innerHTML = '';
      [...beakerState.dissolvedCompounds.map((item) => ({ ...item, state: '溶解中' })),
        ...beakerState.undissolvedSolids.map((item) => ({ ...item, state: '未溶解' })),
        ...beakerState.precipitates.map((item) => ({ ...item, state: '沈殿' })),
        ...Object.entries(beakerState.depositedMetals).filter(([, amount]) => amount > 0).map(([metal, amount]) => ({ formula: metal, amount, color: '#cbd5e1', state: '析出金属' })),
        ...Object.entries(beakerState.dissolvedMetals).filter(([, amount]) => amount > 0).map(([metal, amount]) => ({ formula: metal, amount, color: '#fbbf24', state: '王水に溶解' })),
        ...Object.entries(beakerState.metalPieces).filter(([, amount]) => amount > 0).map(([metal, amount]) => ({ formula: metal, amount, color: '#94a3b8', state: '単体' })),
        ...Object.entries(beakerState.gases).filter(([, amount]) => amount > 0).map(([key, amount]) => {
          const compound = REACTION_ONLY_COMPOUNDS[key] || COMPOUNDS.find((item) => item.key === key);
          return { formula: compound?.formula || key, amount, color: compound?.color || '#bae6fd', state: '気体' };
        }),
        ...Object.entries(beakerState.molecules).filter(([, amount]) => amount > 0).map(([key, amount]) => {
          const compound = COMPOUNDS.find((item) => item.key === key);
          return { formula: compound?.formula || key, amount, color: compound?.color || '#bae6fd', state: '生成分子' };
        }),
      ].forEach((item) => {
        const badge = document.createElement('span');
        badge.className = 'rounded-md border border-slate-700 bg-slate-900 px-1.5 py-1 text-slate-300';
        badge.style.borderColor = item.color || '#475569';
        badge.textContent = `${item.formula} ×${formatBeakerAmount(item.amount)} ${item.state}`;
        solids.appendChild(badge);
      });

      const bed = document.getElementById('beaker-precipitate-bed');
      const totalPrecipitate = beakerState.precipitates.reduce((sum, item) => sum + item.amount, 0);
      bed.style.height = totalPrecipitate ? `${Math.min(24, 5 + totalPrecipitate * 3)}px` : '0px';
      bed.style.background = beakerState.precipitates.length
        ? `linear-gradient(90deg, ${beakerState.precipitates.map((item) => item.color).join(', ')})`
        : 'transparent';

      const pHBadge = document.getElementById('beaker-ph');
      if (beakerState.lastPH === null) pHBadge.textContent = 'pH —';
      else {
        const pH = beakerState.lastPH;
        pHBadge.textContent = `pH ${pH.toFixed(1)} · ${pH < 6.95 ? '酸性' : pH > 7.05 ? 'アルカリ性' : '中性'}`;
        pHBadge.className = `text-xs font-bold ${pH < 6.95 ? 'text-rose-300' : pH > 7.05 ? 'text-lime-300' : 'text-cyan-200'}`;
      }
      document.getElementById('beaker-result-log').textContent = beakerState.logs.length
        ? beakerState.logs.join('\n')
        : '化合物または単体をフラスコからドラッグして入れてください。';
    }

    function updateWorkspace() {
      let totalCharge = 0;
      workspaceIons.forEach((ion) => {
        clampIon(ion);
        totalCharge += ion.charge;
      });

      const chargeIndicator = document.getElementById('charge-indicator');
      chargeIndicator.innerText = `合計電荷: ${totalCharge > 0 ? `+${totalCharge}` : totalCharge}`;
      chargeIndicator.className =
        totalCharge === 0 && workspaceIons.length
          ? 'text-xs font-bold px-2.5 py-1 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
          : 'text-xs font-bold px-2.5 py-1 rounded-md bg-slate-800 text-amber-400 border border-amber-500/30';

      renderIonBlocks();
      renderConnections();
      renderElementBlocks();
      renderWorkspaceMolecules();
      renderAlloyConnections();
      checkReaction();
    }

    function renderIonBlocks() {
      const workspace = document.getElementById('workspace');
      const emptyHint = document.getElementById('empty-hint');
      workspace.querySelectorAll('.ion-block').forEach((block) => block.remove());
      emptyHint.classList.toggle('hidden', workspaceIons.length + workspaceElements.length + workspaceMolecules.length > 0);

      workspaceIons.forEach((ion) => {
        const block = document.createElement('div');
        const portCount = Math.abs(ion.charge);
        const visualHeight = getIonBlockHeight(ion);
        const colorClasses = getIonColorClasses(ion);
        const dragging = activePointerDrag?.instanceId === ion.instanceId;
        const layer = dragging ? 20 : ion.type === 'cation' ? 3 : 2;

        block.className = `ion-block ${portCount === 1 ? 'charge-1 ' : ''}rounded-xl ${colorClasses} border-2 ${ion.borderColor} flex flex-col items-center justify-center shadow-lg`;
        block.style.cssText = `width:${ION_WIDTH}px;height:${visualHeight}px;left:${ion.x}px;top:${ion.y + getIonVisualOffsetY(ion)}px;z-index:${layer}`;
        applyIonColor(block, ion);
        block.dataset.instanceId = String(ion.instanceId);
        block.innerHTML = `
          <div class="text-xl font-black ${ion.textColor} pointer-events-none">
            ${formatIonFormula(ion.id)}
          </div>
          <button class="absolute -top-2 -right-2 w-6 h-6 bg-slate-900 text-rose-400 rounded-full delete-ion" title="削除" aria-label="イオンを削除">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;

        for (let portIndex = 0; portIndex < portCount; portIndex += 1) {
          const mark = document.createElement('span');
          mark.className = `ion-shape-mark ${ion.type === 'cation' ? `ion-tooth ${colorClasses} ${ion.borderColor}` : 'ion-socket'}`;
          if (ion.type === 'cation') applyIonColor(mark, ion);
          mark.style.top = `${((portIndex + 0.5) / portCount) * 100}%`;
          mark.dataset.portIndex = String(portIndex);
          if (isPortUsed(ion.instanceId, portIndex)) mark.classList.add('is-connected');
          block.appendChild(mark);
        }

        if (connections.some((connection) => connection.from === ion.instanceId || connection.to === ion.instanceId)) {
          const disconnectButton = document.createElement('button');
          disconnectButton.className = 'absolute -top-2 -left-2 w-6 h-6 bg-slate-900 text-cyan-300 rounded-full disconnect-ion';
          disconnectButton.title = '接続解除';
          disconnectButton.setAttribute('aria-label', '接続を解除');
          disconnectButton.innerHTML = '<i class="fa-solid fa-link-slash"></i>';
          disconnectButton.onclick = (event) => {
            event.stopPropagation();
            disconnectIon(ion.instanceId);
          };
          block.appendChild(disconnectButton);
        }

        block.querySelector('.delete-ion').onclick = (event) => {
          event.stopPropagation();
          removeIonFromWorkspace(ion.instanceId);
        };
        block.onpointerdown = (event) => beginIonDrag(event, ion, block);
        block.oncontextmenu = (event) => {
          event.preventDefault();
          disconnectIon(ion.instanceId);
        };
        workspace.appendChild(block);
      });
    }

    function renderElementBlocks() {
      const workspace = document.getElementById('workspace');
      workspace.querySelectorAll('.element-block').forEach((block) => block.remove());

      workspaceElements.forEach((element) => {
        const block = document.createElement('div');
        const link = alloyConnections.find(
          (connection) => connection.from === element.instanceId || connection.to === element.instanceId,
        );
        const alloy = link && ALLOYS.find((item) => item.key === link.alloyKey);
        const dragging = activeElementDrag?.instanceId === element.instanceId;
        const isAlloy = element.type === 'alloy';
        block.className = `element-block metal-block rounded-lg bg-gradient-to-br ${element.color} border-2 ${element.borderColor} shadow-lg flex flex-col items-center justify-center`;
        block.style.left = `${element.x}px`;
        block.style.top = `${element.y}px`;
        block.style.zIndex = dragging ? '20' : '4';
        if (element.surfaceColor) block.style.backgroundColor = element.surfaceColor;
        block.dataset.instanceId = String(element.instanceId);
        block.innerHTML = `
          <span class="font-black text-xl ${element.textColor} pointer-events-none">${isAlloy ? (element.formula || element.name) : element.id}</span>
          ${isAlloy ? `<span class="text-[8px] font-bold text-amber-100/90 pointer-events-none">${element.name || ''}</span>` : ''}
          ${link ? `<span class="text-[8px] font-bold text-amber-100/90 pointer-events-none" title="${alloy?.name || '合金'}">${alloy?.name || '合金'}</span>` : ''}
          <button class="absolute -top-2 -right-2 w-6 h-6 bg-slate-900 text-rose-400 rounded-full delete-element" title="単体を削除" aria-label="単体を削除">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;
        block.querySelector('.delete-element').onclick = (event) => {
          event.stopPropagation();
          removeElementFromWorkspace(element.instanceId);
        };
        block.onpointerdown = (event) => beginElementDrag(event, element, block);
        workspace.appendChild(block);
      });
    }

    function renderWorkspaceMolecules() {
      const workspace = document.getElementById('workspace');
      workspace.querySelectorAll('.workspace-molecule').forEach((block) => block.remove());
      workspaceMolecules.forEach((molecule) => {
        const block = document.createElement('div');
        block.className = `workspace-molecule rounded-lg border-2 bg-slate-800/95 px-2 py-1 shadow-lg flex flex-col items-center justify-center ${['CO2', 'NH3'].includes(molecule.key) ? 'is-gas' : ''}`;
        block.style.left = `${molecule.x}px`;
        block.style.top = `${molecule.y}px`;
        block.style.borderColor = molecule.color;
        block.dataset.instanceId = String(molecule.instanceId);
        block.title = molecule.name;
        block.innerHTML = `<span class="text-sm font-black text-slate-50">${molecule.formula}${molecule.amount > 1 ? ` ×${formatBeakerAmount(molecule.amount)}` : ''}</span><span class="text-[8px] text-slate-300">${molecule.name}${['CO2', 'NH3'].includes(molecule.key) ? '・気体' : ''}</span>`;
        block.onpointerdown = (event) => beginWorkspaceMoleculeDrag(event, molecule, block);
        workspace.appendChild(block);
      });
    }

    function renderAlloyConnections() {
      const workspace = document.getElementById('workspace');
      workspace.querySelector('.alloy-connection-layer')?.remove();
      const layer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      layer.setAttribute('class', 'alloy-connection-layer');

      alloyConnections.forEach((connection) => {
        const first = workspaceElements.find((element) => element.instanceId === connection.from);
        const second = workspaceElements.find((element) => element.instanceId === connection.to);
        if (!first || !second) return;
        const rule = ALLOYS.find((alloy) => alloy.key === connection.alloyKey);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', first.x + ELEMENT_BLOCK_WIDTH / 2);
        line.setAttribute('y1', first.y + ELEMENT_BLOCK_HEIGHT / 2);
        line.setAttribute('x2', second.x + ELEMENT_BLOCK_WIDTH / 2);
        line.setAttribute('y2', second.y + ELEMENT_BLOCK_HEIGHT / 2);
        line.setAttribute('stroke', rule?.color || '#fbbf24');
        line.setAttribute('stroke-width', '4');
        line.setAttribute('stroke-linecap', 'round');
        layer.appendChild(line);
      });
      workspace.prepend(layer);
    }

    function renderConnections() {
      const workspace = document.getElementById('workspace');
      workspace.querySelector('.connection-layer')?.remove();

      const layer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      layer.setAttribute('class', 'connection-layer');

      connections.forEach((connection) => {
        const fromIon = workspaceIons.find((ion) => ion.instanceId === connection.from);
        const toIon = workspaceIons.find((ion) => ion.instanceId === connection.to);
        if (!fromIon || !toIon) return;

        const from = getPortPosition(fromIon, connection.fromPort);
        const to = getPortPosition(toIon, connection.toPort);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x);
        line.setAttribute('y2', to.y);
        line.setAttribute('stroke', '#67e8f9');
        line.setAttribute('stroke-width', '3');
        layer.appendChild(line);
      });

      workspace.prepend(layer);
    }

    function buildCompoundGroups() {
      const unassigned = new Set(workspaceIons.map((ion) => ion.instanceId));
      const groups = [];

      while (unassigned.size) {
        const seed = unassigned.values().next().value;
        const memberIds = new Set([seed]);
        let changed = true;
        unassigned.delete(seed);

        while (changed) {
          changed = false;
          connections.forEach((connection) => {
            if (memberIds.has(connection.from) && unassigned.has(connection.to)) {
              memberIds.add(connection.to);
              unassigned.delete(connection.to);
              changed = true;
            }
            if (memberIds.has(connection.to) && unassigned.has(connection.from)) {
              memberIds.add(connection.from);
              unassigned.delete(connection.from);
              changed = true;
            }
          });
        }

        const ions = workspaceIons.filter((ion) => memberIds.has(ion.instanceId));
        const groupConnections = connections.filter(
          (connection) => memberIds.has(connection.from) && memberIds.has(connection.to),
        );
        groups.push({ ions, connections: groupConnections });
      }

      compoundGroups = groups;
      return groups;
    }

    function getGroupComposition(ions) {
      const composition = { cations: {}, anions: {} };

      ions.forEach((ion) => {
        const counts = ion.type === 'cation' ? composition.cations : composition.anions;
        counts[ion.id] = (counts[ion.id] || 0) + 1;
      });

      return composition;
    }

    function findCompoundForGroup(group) {
      if (!group.connections.length) return null;

      const { cations, anions } = getGroupComposition(group.ions);

      // 電荷中性だけで完成にせず、正規化した辞書組成と照合する。
      return makeRuntimeCompound(cations, anions);
    }

    function handleGenerationSuccess() {
      confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
      playSound('success');
    }

    function checkReaction() {
      const formula = document.getElementById('result-formula');
      const name = document.getElementById('result-name');
      const icon = document.getElementById('result-icon');
      const description = document.getElementById('result-desc');
      const groups = buildCompoundGroups();
      const matchedCompounds = [];
      const matchedAlloys = workspaceElements.filter((element) => element.type === 'alloy');

      groups.forEach((group) => {
        const compound = findCompoundForGroup(group);
        if (!compound) return;

        const groupKey = getCompoundGroupKey(group);
        matchedCompounds.push({
          compound,
          heatResult: heatedGroupResults.get(groupKey),
        });
        if (completedGroupKeys.has(groupKey)) return;

        completedGroupKeys.add(groupKey);
        if (compound.generated) {
          if (!discoveredSpecialCompounds.includes(compound.key)) {
            discoveredSpecialCompounds.unshift(compound.key);
            saveDiscoveredSpecialCompounds();
            updateDexBadge();
          }
        } else if (!discoveredCompounds.has(compound.key)) {
          discoveredCompounds.add(compound.key);
          updateDexBadge();
        }
        handleGenerationSuccess();
      });

      matchedAlloys.forEach((alloy) => {
        if (completedAlloyIds.has(alloy.instanceId)) return;
        completedAlloyIds.add(alloy.instanceId);
        handleGenerationSuccess();
      });

      const moleculeFormula = workspaceMolecules.map((molecule) =>
        `${molecule.formula}${molecule.amount > 1 ? ` ×${formatBeakerAmount(molecule.amount)}` : ''}`,
      ).join(' + ');
      const moleculeNames = workspaceMolecules.map((molecule) => molecule.name).join('・');

      if (matchedCompounds.length || matchedAlloys.length) {
        formula.innerText = matchedCompounds
          .map(({ compound, heatResult }) => heatResult?.formula || compound.formula)
          .concat(matchedAlloys.map((alloy) => alloy.formula || alloy.name))
          .concat(workspaceMolecules.map((molecule) =>
            `${molecule.formula}${molecule.amount > 1 ? ` ×${formatBeakerAmount(molecule.amount)}` : ''}`,
          ))
          .join('  +  ');
        formula.className = 'text-3xl font-black text-emerald-400';
        name.innerText = `${matchedCompounds
          .map(({ compound, heatResult }) => heatResult?.name || compound.name)
          .concat(matchedAlloys.map((alloy) => alloy.name || alloy.formula))
          .concat(workspaceMolecules.map((molecule) => molecule.name))
          .join(' ・ ')} (${matchedCompounds.length}件の化合物${workspaceMolecules.length ? `・生成分子 ${workspaceMolecules.length}個` : ''})`;
        name.innerText = [
          ...matchedCompounds.map(({ compound, heatResult }) => heatResult?.name || compound.name),
          ...matchedAlloys.map((alloy) => alloy.name || alloy.formula),
          ...workspaceMolecules.map((molecule) => molecule.name),
        ].filter(Boolean).join(' · ');
        icon.className = 'w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center text-2xl success-glow';
        icon.innerHTML = matchedCompounds.some(({ heatResult }) => heatResult)
          ? '<i class="fa-solid fa-fire"></i>'
          : '<i class="fa-solid fa-check"></i>';
        description.innerText = matchedCompounds
          .map(({ compound, heatResult }) => heatResult?.desc || compound.desc || '')
          .filter(Boolean)
          .concat(workspaceMolecules.map((molecule) => `${molecule.formula}（${molecule.name}）${molecule.amount > 1 ? ` ×${formatBeakerAmount(molecule.amount)}` : ''}`))
          .join(' ');
        description.innerText += matchedAlloys.map((alloy) => alloy.desc || '').filter(Boolean).join(' ');
        return;
      }

      if (!workspaceIons.length && !workspaceElements.length && workspaceMolecules.length) {
        formula.innerText = moleculeFormula;
        formula.className = 'text-3xl font-black text-emerald-400';
        name.innerText = moleculeNames;
        icon.className = 'w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center text-2xl success-glow';
        icon.innerHTML = '<i class="fa-solid fa-fire"></i>';
        description.innerText = '反応で生成した中性分子です。';
        return;
      }

      if (!workspaceIons.length && !workspaceElements.length && !workspaceMolecules.length) {
        formula.innerText = '---';
        formula.className = 'text-2xl font-black text-slate-400';
        name.innerText = 'ブロックをフラスコに入れて組み立てよう';
        icon.className = 'w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-slate-500 text-2xl';
        icon.innerHTML = '<i class="fa-solid fa-atom"></i>';
        description.innerText = '';
        return;
      }

      formula.innerText = '未完成';
      formula.className = 'text-2xl font-black text-slate-500';
      name.innerText = 'イオンを凸凹で接続できます';
      icon.className = 'w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-slate-600 text-2xl';
      icon.innerHTML = '<i class="fa-solid fa-link-slash"></i>';
      description.innerText = workspaceElements.length
        ? '単体は別ブロックとして配置されます。合金ルールに登録された組み合わせは近づけると接続します。'
        : '接続済みのイオン群ごとに化合物を判定します。右クリックまたは解除ボタンで接続を外せます。';
    }
    function updateDexBadge() {
      const badge = document.getElementById('dex-badge');
      badge.innerText = `${discoveredCompounds.size}/${MANUAL_COMPOUNDS.length}`;
    }

    function revealAllDexCompounds() {
      MANUAL_COMPOUNDS.forEach((compound) => discoveredCompounds.add(compound.key));
      MINERAL_COMPOUNDS.forEach((compound) => discoveredCompounds.add(compound.key));
      updateDexBadge();
      if (activeTab === 'dex') renderDex();
    }

    const DEX_CATEGORIES = [
      { id: 'basic-acid', label: '基本酸' },
      { id: 'hydride', label: '水素化物' },
      { id: 'oxide-sulfide', label: '酸化・硫化物' },
      { id: 'halide', label: 'ハロゲン化物' },
      { id: 'sulfate-nitrate-carbonate', label: '硫酸・硝酸・炭酸' },
      { id: 'halogen-oxoacid', label: 'ハロゲン酸' },
      { id: 'chromate-arsenate-manganate', label: 'クロム酸・ヒ素酸・マンガン酸' },
      { id: 'phosphate', label: 'リン酸' },
      { id: 'fulminate-cyanide', label: '雷酸・シアン化' },
      { id: 'other', label: 'その他' },
    ];

    function getDexCompoundCategory(compound) {
      const cations = Object.keys(compound.cations || {});
      const anions = Object.keys(compound.anions || {});
      const anionSet = new Set(anions);
      const hydrogenCationOnly = cations.length === 1 && cations[0] === 'H+';

      if (anionSet.has('H-')) return 'hydride';
      if (hydrogenCationOnly && ['F-', 'Cl-', 'Br-', 'I-'].some((ionId) => anionSet.has(ionId))) {
        return 'halogen-oxoacid';
      }
      if (['SO4-2', 'NO3-1', 'CO3-2', 'HCO3-1'].some((ionId) => anionSet.has(ionId))) {
        return 'sulfate-nitrate-carbonate';
      }
      if (['IO3-1', 'ClO3-1', 'BrO3-1', 'AtO3-1'].some((ionId) => anionSet.has(ionId))) {
        return 'halogen-oxoacid';
      }
      if (['CrO4-2', 'Cr2O7-2', 'AsO4-3', 'MnO4-1'].some((ionId) => anionSet.has(ionId))) {
        return 'chromate-arsenate-manganate';
      }
      if (anionSet.has('PO4-3')) return 'phosphate';
      if (['CNO-1', 'CN-1'].some((ionId) => anionSet.has(ionId))) {
        return 'fulminate-cyanide';
      }
      if (hydrogenCationOnly && !['H2O1', 'H1OH1'].includes(compound.key) &&
          compound.specialType !== 'hydrogen_molecule') {
        return 'basic-acid';
      }
      if (['H2O1', 'H1OH1'].includes(compound.key)) return 'other';
      if (['O2-', 'OH-', 'S2-'].some((ionId) => anionSet.has(ionId))) {
        return 'oxide-sulfide';
      }
      if (['F-', 'Cl-', 'Br-', 'I-'].some((ionId) => anionSet.has(ionId))) {
        return 'halide';
      }
      return 'other';
    }

    function renderDexCategoryNavigation(categoryCompounds) {
      const navigation = document.getElementById('dex-category-nav');
      navigation.innerHTML = '';
      navigation.classList.remove('hidden');

      if (currentDexCategory) {
        const category = DEX_CATEGORIES.find((item) => item.id === currentDexCategory);
        const toolbar = document.createElement('div');
        toolbar.className = 'flex flex-wrap items-center gap-3';
        const backButton = document.createElement('button');
        backButton.type = 'button';
        backButton.className = 'px-3 py-2 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 text-sm font-bold';
        backButton.textContent = '分類一覧へ戻る';
        backButton.onclick = () => {
          currentDexCategory = null;
          renderDex();
        };
        const heading = document.createElement('h3');
        heading.className = 'text-sm font-bold text-cyan-200';
        heading.textContent = `${category?.label || '分類'}（${categoryCompounds.length}件）`;
        toolbar.append(backButton, heading);
        navigation.appendChild(toolbar);
        return;
      }

      const categoryList = document.createElement('div');
      categoryList.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3';
      DEX_CATEGORIES.forEach((category) => {
        const count = MANUAL_COMPOUNDS.filter(
          (compound) => getDexCompoundCategory(compound) === category.id,
        ).length;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'flex items-center justify-between gap-3 rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-left text-sm font-bold text-slate-200 transition hover:border-cyan-500 hover:bg-slate-800';
        const label = document.createElement('span');
        label.textContent = category.label;
        const itemCount = document.createElement('span');
        itemCount.className = 'shrink-0 rounded-full bg-slate-800 px-2 py-1 text-xs text-slate-400';
        itemCount.textContent = `${count}件`;
        button.append(label, itemCount);
        button.onclick = () => {
          currentDexCategory = category.id;
          renderDex();
        };
        categoryList.appendChild(button);
      });
      navigation.appendChild(categoryList);
    }

    function switchDexTab(tab) {
      currentDexTab = tab;
      currentDexCategory = null;
      const manualButton = document.getElementById('dex-tab-manual');
      const specialButton = document.getElementById('dex-tab-special');
      const mineralButton = document.getElementById('dex-tab-mineral');
      const activeClass = 'px-4 py-2 rounded-xl text-sm font-bold bg-cyan-500 text-slate-950';
      const inactiveClass = 'px-4 py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-300 hover:bg-slate-700';

      manualButton.className = tab === 'manual' ? activeClass : inactiveClass;
      specialButton.className = tab === 'special' ? activeClass : inactiveClass;
      mineralButton.className = tab === 'mineral' ? activeClass : inactiveClass;
      manualButton.setAttribute('aria-selected', String(tab === 'manual'));
      specialButton.setAttribute('aria-selected', String(tab === 'special'));
      mineralButton.setAttribute('aria-selected', String(tab === 'mineral'));
      renderDex();
    }

    function buildDexCard(compound) {
      const isDiscovered = compound.generated || discoveredCompounds.has(compound.key);
      const displayColor = compound.color || '#334155';
      const card = document.createElement('div');

      if (isDiscovered) {
        card.className =
          'dex-card p-4 rounded-xl bg-slate-950 border border-emerald-500/30 flex gap-4 items-start relative overflow-hidden';
        card.innerHTML = `
          <div class="dex-card-formula w-14 h-14 rounded-xl flex items-center justify-center font-black text-xl shadow-inner shrink-0"
               style="background-color: ${displayColor}20; color: ${displayColor}; border: 1px solid ${displayColor}40;">
            ${compound.formula}
          </div>
          <div class="dex-card-content">
            <div class="flex items-center gap-2">
              <h3 class="dex-card-name font-extrabold text-white text-md">${compound.name}</h3>
              <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-bold">
                発見済み
              </span>
            </div>
            ${compound.generated ? '' : `<p class="dex-card-desc text-xs text-slate-400 mt-1">${compound.desc}</p>`}
            ${!compound.generated && compound.mineral ? `
              <p class="dex-card-desc text-xs text-cyan-300 mt-2">
                鉱物情報: ${compound.mineral.name} — ${compound.mineral.desc}
              </p>
            ` : ''}
          </div>
        `;
      } else {
        card.className =
          'dex-card p-4 rounded-xl bg-slate-950/40 border border-slate-800 flex gap-4 items-center opacity-60';
        card.innerHTML = `
          <div class="w-14 h-14 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center font-black text-xl text-slate-700 shrink-0">
            ?
          </div>
          <div>
            <h3 class="dex-card-name font-bold text-slate-500 text-sm">未発見の化合物</h3>
            <p class="dex-card-desc text-xs text-slate-600 mt-1">
              実験室で適切なイオンを結合させて解放しましょう。
            </p>
          </div>
        `;
      }
      return card;
    }

    // 化合物図鑑の描画
    function renderDex() {
      const grid = document.getElementById('dex-grid');
      const description = document.getElementById('dex-description');
      const categoryNavigation = document.getElementById('dex-category-nav');
      grid.innerHTML = '';
      grid.classList.remove('hidden');
      categoryNavigation.classList.toggle('hidden', currentDexTab !== 'manual');

      if (currentDexTab === 'mineral') {
        const visibleMinerals = MINERAL_COMPOUNDS.filter((compound) => discoveredCompounds.has(compound.key));
        const groupedMinerals = new Map();
        visibleMinerals.forEach((compound) => {
          const primaryCation = Object.keys(compound.cations || {})[0] || 'unknown';
          const cationLabel = IONS[primaryCation]?.symbol || IONS[primaryCation]?.id || primaryCation || '不明';
          if (!groupedMinerals.has(cationLabel)) {
            groupedMinerals.set(cationLabel, []);
          }
          groupedMinerals.get(cationLabel).push(compound);
        });

        description.innerText = '発見済みの鉱物組成を陽イオンごとに見やすく整理した図鑑です。';

        const sections = Array.from(groupedMinerals.entries());

        sections.forEach(([cationLabel, compounds]) => {
          const section = document.createElement('section');
          section.className = 'rounded-2xl border border-slate-800 bg-slate-950/60 p-4 space-y-3';
          const heading = document.createElement('h3');
          heading.className = 'text-sm font-bold text-cyan-200';
          heading.textContent = `${cationLabel}系`;
          section.appendChild(heading);

          const cards = document.createElement('div');
          cards.className = 'grid grid-cols-1 md:grid-cols-2 gap-3';
          compounds.forEach((compound) => cards.appendChild(buildDexCard(compound)));
          section.appendChild(cards);
          grid.appendChild(section);
        });

        if (!visibleMinerals.length) {
          const empty = document.createElement('div');
          empty.className = 'rounded-2xl border border-slate-800 bg-slate-950/40 p-6 text-sm text-slate-400';
          empty.textContent = 'まだ発見した鉱物がありません。';
          grid.appendChild(empty);
        }
        return;
      }

      let compoundsToRender;
      if (currentDexTab === 'manual') {
        if (!currentDexCategory) {
          description.innerText = '分類を選択して、手書き登録された化合物と固有の説明を表示します。';
          renderDexCategoryNavigation([]);
          grid.classList.add('hidden');
          return;
        }
        compoundsToRender = MANUAL_COMPOUNDS.filter(
          (compound) => getDexCompoundCategory(compound) === currentDexCategory,
        );
        description.innerText = '選択した分類の化合物を表示します。発見状況は図鑑全体で共通です。';
        renderDexCategoryNavigation(compoundsToRender);
        grid.classList.remove('hidden');
      } else {
        grid.classList.remove('hidden');
        compoundsToRender = discoveredSpecialCompounds
          .map((key) => makeDiscoveredSpecialCompound(key))
          .filter(Boolean);
        description.innerText = '実際に作成して発見した未登録化合物を表示します。';
      }

      compoundsToRender.forEach((compound) => {
        grid.appendChild(buildDexCard(compound));
      });
    }

    // 初期化
    window.onload = function () {
      renderIonList();
      renderBeaker();
      setupDragAndDrop();
      initializeLighter();
      updateDexBadge();
      updateWorkspace();
    };
  </script>
